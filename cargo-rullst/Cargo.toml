[package]
name = "cargo-rullst"
version = "12.1.2"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "The official command-line interface (CLI) for managing and scaffolding Rullst applications."
license = "MIT"
readme = "../README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/cargo-rullst"
keywords = ["rullst", "cli", "scaffold", "generator", "devtools"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "cargo_rullst"
path = "src/lib.rs"

[[bin]]
name = "cargo-rullst"
path = "src/bin/cargo-rullst.rs"
doc = false

[[bin]]
name = "rullst"
path = "src/bin/rullst.rs"
doc = false

[[bin]]
name = "sync-badges"
path = "src/bin/sync_badges.rs"
doc = false

[dependencies]
base64 = { workspace = true }
rullst-core = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
chrono = { workspace = true, features = ["clock"] }
dialoguer = "0.12.0"
ratatui = "0.30.2"
crossterm = "0.29.0"
regex = "1.12.4"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
semver = "1.0.28"
toml_edit = "0.25.15"
toml = { workspace = true }
dotenvy = { workspace = true }
thiserror = { workspace = true }
walkdir = "2.5.0"
tempfile = "3.27.0"
axum = { workspace = true, features = ["ws"] }
notify = { workspace = true }
syn = { version = "3.0.5", features = ["full", "visit", "visit-mut"] }
tokio = { workspace = true, features = ["full"] }
brotli = "9.0.0"
zstd = "0.14.0"
reqwest = { workspace = true, features = ["json", "rustls", "blocking"] }
rand = { workspace = true }
quote = "1.0.47"
proc-macro2 = "1.0.107"
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "mysql", "any"] }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
insta = { version = "1.41", features = ["yaml"] }
# Keeps the generated Tera blueprint dependency locked and cached for the
# packaged-distribution compile gate without adding it to the CLI runtime graph.
tera = "2.4.0"
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["cors"] }

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)'] }
