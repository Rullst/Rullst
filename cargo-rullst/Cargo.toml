[package]
name = "cargo-rullst"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "The official command-line interface (CLI) for managing and scaffolding Rullst applications."
license = "MIT"
readme = "../README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/cargo-rullst"
keywords = ["rullst", "cli", "scaffold", "generator", "devtools"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "cargo_rullst"
path = "src/lib.rs"

[[bin]]
name = "cargo-rullst"
path = "src/bin/cargo-rullst.rs"

[[bin]]
name = "rullst"
path = "src/bin/rullst.rs"

[[bin]]
name = "sync-badges"
path = "src/bin/sync_badges.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
chrono = { workspace = true, features = ["clock"] }
dialoguer = "0.12.0"
ratatui = "0.30.2"
crossterm = "0.29.0"
regex = "1.12.4"
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = "2.5.0"
axum = { workspace = true, features = ["ws"] }
notify = { workspace = true }
syn = { version = "3", features = ["full", "visit", "visit-mut"] }
tokio = { workspace = true, features = ["full"] }
brotli = "8.0.3"
zstd = "0.13.3"
reqwest = { workspace = true, features = ["json", "rustls", "blocking"] }
rand = { workspace = true }
quote = "1.0.47"
proc-macro2 = "1.0.107"
pulldown-cmark = "0.13.0"
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "mysql", "any"] }

[dev-dependencies]
insta = { version = "1.41", features = ["yaml"] }
toml = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["cors"] }

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)'] }
