# Generated by `cargo rullst add browser-tests`; this file belongs to the
# application. It starts the application with its development configuration
# (.env.example, a fresh APP_KEY and, when it has migrations, a migrated
# database) and opens every page of the PAGES list in src/security_tests.rs
# in Chromium, Firefox and WebKit (tests/browser/pages.mjs).
# Guide: https://rullst.github.io/Rullst/book/testing-your-app.html
name: Browser tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  browsers:
    name: Pages in Chromium, Firefox and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust with a dependency cache
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the pinned Playwright, axe-core and browsers
        run: |
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          node tests/browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit

      - name: Build the application
        run: cargo build

      - name: Configure and migrate a development copy
        run: |
          cp .env.example .env
          # A random key for this run only; the environment wins over .env.
          key="$(openssl rand -hex 16)"
          echo "APP_KEY=$key" >> "$GITHUB_ENV"
          if [ -d src/migrations ]; then
            APP_KEY="$key" cargo run --quiet -- db:migrate
          fi

      - name: Start the application
        run: |
          cargo run --quiet > "$RUNNER_TEMP/server.log" 2>&1 &
          curl --silent --show-error --fail --retry 60 --retry-delay 2 --retry-all-errors \
            --output /dev/null http://127.0.0.1:3000/health

      - name: Open every page in the three browsers
        run: node tests/browser/pages.mjs --base-url http://127.0.0.1:3000

      - name: Show the server log of a failure
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/server.log" || true

      - name: Keep the report of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-tests-${{ github.run_attempt }}
          path: tests/browser/results
          if-no-files-found: ignore
          retention-days: 14
