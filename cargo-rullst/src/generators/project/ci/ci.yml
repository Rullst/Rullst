# Generated by `cargo rullst new`; this file belongs to the application.
# Every action is pinned to a full commit SHA (the comment names its
# version); .github/dependabot.yml proposes updates once a month.
# Guide: https://rullst.github.io/Rullst/book/testing-your-app.html
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: new RustSec advisories for the locked dependencies.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'schedule' && '-scheduled' || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Formatting
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
          cache: false

      # A new project is not rustfmt-formatted yet: run `cargo fmt --all`
      # once and commit the result.
      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Clippy and tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust with a dependency cache
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          rustflags: ""

      - name: Clippy (warnings fail)
        run: cargo clippy --all-targets -- -D warnings

      # Unit tests, src/security_tests.rs (headers, WAF, CSRF) and the smoke
      # test of every page in its PAGES list. They run offline.
      - name: Tests
        run: cargo test --all-targets

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit

      # Reads Cargo.lock: commit it (applications should).
      - name: Audit Cargo.lock against the RustSec database
        run: cargo audit

  secrets:
    name: Secret scan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # TruffleHog scans the commits of the push or pull request.
          fetch-depth: 0

      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@27d8ea2876d990b274996fc97aff0f8d952d364c # main @ 2026-09-16
        with:
          path: ./
          # The scanner image is pinned as well as the action.
          version: 3.97.4@sha256:562bc231afa9de3d04de44cfe624252b08207de1fc3cebc5e7ed92bed7f279e4
          extra_args: --only-verified
