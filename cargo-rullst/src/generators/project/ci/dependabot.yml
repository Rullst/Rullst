# Generated by `cargo rullst new`; this file belongs to the application.
# One grouped pull request per ecosystem and month. Security updates for
# vulnerable crates can still arrive at once: enable Dependabot security
# updates in the repository settings.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
