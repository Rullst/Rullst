[package]
name = "rullst-media"
version = "13.0.0-alpha.1"
edition = "2024"
rust-version = "1.96.0"
authors = ["Rullst Core Team"]
description = "Explicit private video lifecycle with Bunny Stream and S3-compatible storage for Rullst"
license = "MIT"
repository = "https://github.com/Rullst/Rullst"
readme = "README.md"

[features]
default = []
bunny = ["dep:reqwest", "dep:ring", "dep:base64", "dep:zeroize", "dep:tokio"]
sqlite = ["dep:sqlx", "dep:ring", "dep:tokio"]
# Experimental S3/R2/MinIO object storage; reuses Core's `aws-sigv4` signer.
s3 = ["dep:reqwest", "dep:ring", "dep:zeroize", "dep:aws-sigv4", "dep:aws-credential-types", "dep:tracing"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["json", "rustls"], optional = true }
ring = { workspace = true, features = ["std"], optional = true }
base64 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time", "rt"], optional = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"], optional = true }
aws-credential-types = { version = "1.3.0", optional = true }
aws-sigv4 = { version = "1.5.1", optional = true, default-features = false, features = ["sign-http", "http1"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
rullst-core = { workspace = true }
async-trait = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tempfile = "3"
axum = { workspace = true }

[[example]]
name = "private_course_video"
required-features = ["bunny", "sqlite"]
