[package]
name = "rullst-connect"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "OAuth2 social login, enterprise message queues, and real-time synchronization for Rullst."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-connect"
keywords = ["oauth2", "connect", "authentication", "login", "queues"]
categories = ["web-programming", "authentication"]

[features]
default = []
axum = ["dep:axum"]
actix = ["dep:actix-web"]
leptos = ["dep:leptos_router"]
rullst = ["axum"]
retry = ["dep:reqwest-middleware", "dep:reqwest-retry"]
reqwest-middleware = ["dep:reqwest-middleware"]
axum-session = ["axum", "dep:tower-sessions"]
mock = []

[dependencies]
async-trait = "0.1"
base64 = "0.23"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rand = "0.10"
reqwest = { version = "0.13", features = ["form", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2.5"

axum = { version = "0.8", optional = true }
actix-web = { version = "4", optional = true }
leptos_router = { version = "0.8", optional = true }
serde_urlencoded = "0.7"
reqwest-middleware = { version = "0.5", optional = true }
reqwest-retry = { version = "0.9", optional = true }
tower-sessions = { version = "0.15", optional = true }
subtle = "2.6.1"
secrecy = { version = "0.10", features = ["serde"] }

[package.metadata.cargo-machete]
ignored = ["leptos_router"]

[dev-dependencies]
axum = "0.8"
actix-web = "4"
serde_urlencoded = "0.7"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
criterion = "0.8"
loom = "0.7"
proptest = "1"

[[bench]]
name = "provider_bench"
harness = false

[[example]]
name = "axum_example"
required-features = ["axum"]

[lints.rust]
# Kani é uma ferramenta externa que injeta `cfg(kani)` automaticamente — não é uma crate do crates.io
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(coverage_nightly)', 'cfg(mutants)'] }
