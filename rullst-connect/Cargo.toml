[package]
name = "rullst-connect"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "OAuth2 social login and OpenID Connect integrations for Rullst."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-connect"
keywords = ["oauth2", "oidc", "authentication", "login", "security"]
categories = ["web-programming", "authentication"]

[features]
default = []
axum = ["dep:axum", "dep:ed25519-dalek"]
actix = ["dep:actix-web"]
# AuthCallback is framework-agnostic and needs no Leptos runtime dependency.
leptos = []
rullst = ["axum"]
retry = ["dep:reqwest-middleware", "dep:reqwest-retry"]
reqwest-middleware = ["dep:reqwest-middleware"]
axum-session = ["axum", "dep:tower-sessions"]
mock = []

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
ed25519-dalek = { version = "2.2.0", optional = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["form", "json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url = "2.5"

axum = { workspace = true, optional = true }
actix-web = { version = "4", optional = true, default-features = false }
serde_urlencoded = "0.7"
reqwest-middleware = { version = "0.5", optional = true }
reqwest-retry = { version = "0.9", optional = true }
tower-sessions = { version = "0.15", optional = true }
subtle = { workspace = true }
secrecy = { version = "0.10", features = ["serde"] }

[dev-dependencies]
axum = { workspace = true }
actix-web = { version = "4", default-features = false }
serde_urlencoded = "0.7"
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
criterion = { workspace = true }
loom = "0.7"
proptest = "1"

[[bench]]
name = "provider_bench"
harness = false

[[example]]
name = "axum_example"
required-features = ["axum"]

[lints.rust]
# Kani é uma ferramenta externa que injeta `cfg(kani)` automaticamente — não é uma crate do crates.io
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(coverage_nightly)', 'cfg(mutants)'] }
