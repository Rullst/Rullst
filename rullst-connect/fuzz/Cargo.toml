[package]
name = "rullst-connect-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[package.metadata.cargo-machete]
ignored = ["libfuzzer-sys", "rullst-connect"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]


[dependencies.rullst-connect]
path = ".."
features = ["axum"]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
serde_urlencoded = "0.7"

[[bin]]
name = "default_target"
path = "fuzz_targets/default_target.rs"
test = false
doc = false

[[bin]]
name = "fuzz_user_json"
path = "fuzz_targets/fuzz_user_json.rs"
test = false
doc = false

[[bin]]
name = "fuzz_token_response"
path = "fuzz_targets/fuzz_token_response.rs"
test = false
doc = false
