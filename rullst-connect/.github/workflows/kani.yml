name: Kani Rust Verifier

on:
  workflow_dispatch:
permissions: read-all

jobs:
  kani:
    name: Run Kani Proofs
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Verify with Kani
        uses: model-checking/kani-github-action@2534b7aeb3c6b4b0a5ecc3981bb3e63d47b5b126 # v1
        with:
          args: "--default-unwind 33"
        continue-on-error: true # Continues if no proofs exist yet
