[advisories]
# Do not fail CI for unmaintained crates (warn only)
unmaintained = "none"
# Temporary exception documented in ../docs/src/security-advisory-exceptions.md.
ignore = ["RUSTSEC-2023-0071"]

[bans]
# Allow multiple versions of the same dependency (e.g. thiserror v1 and v2)
multiple-versions = "allow"


[licenses]
# Licenças permitidas globalmente
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

# Exceções para crates específicos que usam strings de licença fora do padrão SPDX
[[licenses.clarify]]
name = "zstd-sys"
version = "*"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "LICENSE", hash = 0 }
]
