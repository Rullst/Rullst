[package]
name = "rullst-core"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Core runtime, routing engine, and telemetry for the Rullst web framework."
license = "MIT"
readme = "../README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-core"
keywords = ["rullst", "framework", "web", "runtime", "routing"]
categories = ["web-programming::http-server", "asynchronous"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }

[features]
studio = []
redis = ["queue-redis", "cache-redis"]
queue-redis = ["dep:redis"]
cache-redis = ["dep:redis"]
telemetry = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk"]
strict-postgres = ["rullst-orm/strict-postgres"]
strict-mysql = ["rullst-orm/strict-mysql"]
strict-sqlite = ["rullst-orm/strict-sqlite"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
dotenvy = "0.15"
rullst-macros = { version = "12.0.0", path = "../rullst-macros" }
redis = { version = "1.2.2", features = ["tokio-comp", "aio"], optional = true }
tracing-opentelemetry = { version = "0.33.0", optional = true }
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry-otlp = { version = "0.32.0", optional = true, features = ["reqwest-client", "http-proto", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.32.1", optional = true, features = ["rt-tokio"] }
axum = { version = "0.8.9", features = ["macros", "ws"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }
rullst-orm = { version = "12.0.0", path = "../rullst-orm" }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "trace", "cors"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
async-trait = "0.1.89"
rand = "0.10.1"
subtle = "2.6.1"
serde_urlencoded = "0.7"
base64 = "0.22.1"
uuid = { version = "1.23.3", features = ["v4"] }
dashmap = "6.2.1"
cron = "0.17.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
urlencoding = "2.1.3"
validator = { version = "0.20.0", features = ["derive"] }
libloading = "0.9.0"
notify = "8.2.0"
ring = { version = "0.17.14", features = ["std"] }
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "core_bench"
harness = false

