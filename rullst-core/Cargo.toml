[package]
name = "rullst-core"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Core runtime, routing engine, and telemetry for the Rullst web framework."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-core"
keywords = ["rullst", "framework", "web", "runtime", "routing"]
categories = ["web-programming::http-server", "asynchronous"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }

[features]
studio = []
redis = ["queue-redis", "cache-redis"]
queue-redis = ["dep:redis"]
cache-redis = ["dep:redis"]
telemetry = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk"]
strict-postgres = ["rullst-orm/strict-postgres"]
strict-mysql = ["rullst-orm/strict-mysql"]
strict-sqlite = ["rullst-orm/strict-sqlite"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dotenvy = { workspace = true }
rullst-macros = { workspace = true }
redis = { workspace = true, features = ["tokio-comp", "aio"], optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true, features = ["reqwest-client", "http-proto", "reqwest-rustls"] }
opentelemetry_sdk = { workspace = true, optional = true, features = ["rt-tokio"] }
axum = { workspace = true, features = ["macros", "ws"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }
rullst-orm = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio", "macros"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs", "trace", "cors"] }
tower-layer = { workspace = true }
tower-service = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
serde_urlencoded = "0.7"
base64 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
dashmap = { workspace = true }
cron = "0.17.0"
chrono = { workspace = true, features = ["clock"] }
urlencoding = { workspace = true }
validator = { workspace = true, features = ["derive"] }
libloading = { workspace = true }
notify = { workspace = true }
ring = { workspace = true, features = ["std"] }
tracing = { workspace = true }
tracing-core = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth", "windows-sys"]

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }

[[bench]]
name = "core_bench"
harness = false

