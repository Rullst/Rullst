[package]
name = "rullst-security-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[package.metadata.cargo-machete]
ignored = ["libfuzzer-sys", "rullst-security"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[dependencies.rullst-security]
path = ".."

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"

[[bin]]
name = "fuzz_rasp"
path = "fuzz_targets/fuzz_rasp.rs"
test = false
doc = false

[[bin]]
name = "fuzz_schema_guard"
path = "fuzz_targets/fuzz_schema_guard.rs"
test = false
doc = false

[[bin]]
name = "fuzz_vault"
path = "fuzz_targets/fuzz_vault.rs"
test = false
doc = false

[[bin]]
name = "fuzz_totp"
path = "fuzz_targets/fuzz_totp.rs"
test = false
doc = false

[[bin]]
name = "fuzz_log_redactor"
path = "fuzz_targets/fuzz_log_redactor.rs"
test = false
doc = false

[[bin]]
name = "fuzz_dlp"
path = "fuzz_targets/fuzz_dlp.rs"
test = false
doc = false

[[bin]]
name = "fuzz_sanitizer"
path = "fuzz_targets/fuzz_sanitizer.rs"
test = false
doc = false

