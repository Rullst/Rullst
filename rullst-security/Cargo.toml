[package]
name = "rullst-security"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Runtime application security, RASP, OWASP headers, Login Jail, and WAF middleware for Rullst."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-security"
keywords = ["security", "owasp", "rasp", "waf", "middleware"]
categories = ["web-programming", "network-programming"]

[features]
default = []
redis-rate-limit = ["dep:redis"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }

[dependencies]
rullst-core = { workspace = true }
aes-gcm = { version = "0.11.0", features = ["zeroize"] }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tower = { workspace = true, features = ["util"] }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
dashmap = { workspace = true }
ammonia = "4.0.0"
rand = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
sha1 = "0.11.0"
hmac = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
zeroize = { version = "1.8", features = ["derive"] }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
urlencoding = { workspace = true }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
redis = { workspace = true, features = ["tokio-comp", "aio"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
axum = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }

[[bench]]
name = "security_bench"
harness = false

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]
