<circle cx="26" cy="23" r="7" fill="#ff5f57"/><circle cx="50" cy="23" r="7" fill="#febc2e"/><circle cx="74" cy="23" r="7" fill="#28c840"/>
<text x="600.0" y="28" text-anchor="middle" fill="#94a3b8" style="font-size:14px">~/projects — cargo rullst</text>
<g class="content"><g class="ln0"><text x="34" y="92" xml:space="preserve"><tspan fill="#22c55e" font-weight="700">$ </tspan><tspan fill="#e5e7eb">cargo rullst new</tspan></text><g class="cv0"><rect x="54.4" y="70" width="1150" height="30" fill="#0b1020"/><rect class="blink" x="54.4" y="73" width="10" height="23" fill="#e5e7eb"/></g></g><g class="ln1"><text x="34" y="123" xml:space="preserve"><tspan fill="#22c55e" font-weight="700">✔ </tspan><tspan fill="#f8fafc" font-weight="700">🚀 What&#x27;s the New App Name? </tspan><tspan fill="#64748b">(lowercase, no spaces, must start with a letter) · </tspan><tspan fill="#22d3ee" font-weight="700">my_saas</tspan></text></g><g class="ln2"><text x="34" y="154" xml:space="preserve"><tspan fill="#22c55e" font-weight="700">✔ </tspan><tspan fill="#f8fafc" font-weight="700">👉 Select a Starter Blueprint · </tspan><tspan fill="#22d3ee" font-weight="700">SaaS App Starter </tspan><tspan fill="#64748b">(Authentication + Stripe payments billing template)</tspan></text></g><g class="ln3"><text x="34" y="185" xml:space="preserve"><tspan fill="#22c55e" font-weight="700">✔ </tspan><tspan fill="#f8fafc" font-weight="700">🗄️ Will your project need a Database? · </tspan><tspan fill="#22d3ee" font-weight="700">yes</tspan></text></g><g class="ln4"><text x="34" y="216" xml:space="preserve"><tspan fill="#22c55e" font-weight="700">✔ </tspan><tspan fill="#f8fafc" font-weight="700">💾 Select the primary DB · </tspan><tspan fill="#22d3ee" font-weight="700">SQLite</tspan></text></g><g class="ln5"><text x="34" y="247" xml:space="preserve"><tspan fill="#22c55e">  ✅ Database tables created successfully.</tspan></text></g><g class="ln6"><text x="34" y="278" xml:space="preserve"><tspan fill="#f8fafc" font-weight="700">How to run:</tspan></text></g><g class="ln7"><text x="34" y="309" xml:space="preserve"><tspan fill="#22d3ee">  cd my_saas</tspan></text></g><g class="ln8"><text x="34" y="340" xml:space="preserve"><tspan fill="#e5e7eb">    cargo rullst dev   </tspan><tspan fill="#64748b">(standard output)</tspan></text></g><g class="ln9"><text x="34" y="402" xml:space="preserve"><tspan fill="#22c55e" font-weight="700">$ </tspan><tspan fill="#e5e7eb">cd my_saas &amp;&amp; cargo rullst dev</tspan></text><g class="cv9"><rect x="54.4" y="380" width="1150" height="30" fill="#0b1020"/><rect class="blink" x="54.4" y="383" width="10" height="23" fill="#e5e7eb"/></g></g><g class="ln10"><text x="34" y="433" xml:space="preserve"><tspan fill="#22c55e" font-weight="700">   Compiling </tspan><tspan fill="#e5e7eb">my_saas v0.1.0</tspan></text></g><g class="ln11"><text x="34" y="464" xml:space="preserve"><tspan fill="#e5e7eb">Rullst framework serving on </tspan><tspan fill="#22d3ee">http://127.0.0.1:3000</tspan></text></g><g class="ln12"><text x="34" y="495" xml:space="preserve"><tspan fill="#f8fafc" font-weight="700">🚀 Visit: </tspan><tspan fill="#22c55e" font-weight="700">http://localhost:3000</tspan><tspan fill="#f8fafc" font-weight="700"> to see the result!</tspan></text></g><g class="ln12"><rect class="blink" x="34" y="507" width="10" height="23" fill="#e5e7eb"/></g></g>
</g>
