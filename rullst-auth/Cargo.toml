[package]
name = "rullst-auth"
version = "12.0.0-rc.1"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Authentication and authorization engine with Argon2, encrypted sessions, WebAuthn, and RBAC."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-auth"
keywords = ["auth", "webauthn", "argon2", "session", "rbac"]
categories = ["authentication", "web-programming"]

[features]
default = []
oauth = ["dep:rullst-connect"]
jwt = ["dep:hex", "dep:jsonwebtoken"]
sqlite = ["jwt", "dep:sqlx"]

[dependencies]
rullst-core = { workspace = true }
argon2 = "0.5.3"
rand = { workspace = true }
rand_core = { version = "0.6.4", features = ["getrandom"] }
aes-gcm = "0.11.0"
sha2 = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
rullst-connect = { workspace = true, optional = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
ring = { workspace = true, features = ["std"] }
p256 = "0.14.0"
tower = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
dotenvy = { workspace = true }
url = "2.5.8"
jsonwebtoken = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true, features = ["sqlite", "runtime-tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
criterion = { workspace = true, features = ["async_tokio"] }

[[bench]]
name = "auth_bench"
harness = false

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }
