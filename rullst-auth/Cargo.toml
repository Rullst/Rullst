[package]
name = "rullst-auth"
version = "5.1.0"
edition = "2024"

[features]
oauth = ["dep:rullst-connect"]

[dependencies]
rullst-core = { path = "../rullst-core" }
argon2 = "0.5.3"
rand = "0.10.1"
aes-gcm = "0.10.3"
sha2 = "0.11.0"
base64 = "0.22.1"
subtle = "2.6.1"
rullst-connect = { version = "11.0.0", optional = true }
axum = { version = "0.8.9" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
async-trait = "0.1.89"
ring = { version = "0.17.14", features = ["std"] }
