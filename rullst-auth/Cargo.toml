[package]
name = "rullst-auth"
version = "12.0.0"
edition = "2024"
license = "MIT"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)'] }


[features]
oauth = ["dep:rullst-connect"]

[dependencies]
rullst-core = { path = "../rullst-core" }
argon2 = "0.5.3"
rand = "0.10.1"
aes-gcm = "0.10.3"
sha2 = "0.11.0"
base64 = "0.22.1"
subtle = "2.6.1"
rullst-connect = { version = "12.0.0", path = "../rullst-connect", optional = true }
axum = { version = "0.8.9" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
async-trait = "0.1.89"
ring = { version = "0.17.14", features = ["std"] }

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]
