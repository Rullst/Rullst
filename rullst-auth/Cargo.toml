[package]
name = "rullst-auth"
version = "13.0.0-rc.1"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Authentication and authorization engine with Argon2, encrypted sessions, WebAuthn, and RBAC."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-auth"
keywords = ["auth", "webauthn", "argon2", "session", "rbac"]
categories = ["authentication", "web-programming"]

# docs.rs documents every feature on one target; `--cfg docsrs` labels the
# items that need a feature.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = []
# `rullst-core/tls`: the OAuth and PostgreSQL features make TLS connections
# (OAuth over HTTPS, PostgreSQL), so Core installs aws-lc-rs as the rustls
# process default.
oauth = ["dep:rullst-connect", "rullst-core/tls"]
# WebAuthn ES256 passkeys (`auth::passkey`); the only feature that compiles
# aws-lc-rs into this crate. `jwt` reaches aws-lc-rs through jsonwebtoken, so
# `sqlite` (JWT revocation and the passkey device registry) includes it.
passkeys = ["dep:aws-lc-rs"]
jwt = ["dep:hex", "dep:jsonwebtoken"]
sqlite = ["jwt", "passkeys", "dep:sqlx", "sqlx/sqlite"]
recovery-sqlite = ["dep:sqlx", "sqlx/any", "sqlx/sqlite"]
passkey-postgres = ["passkeys", "dep:sqlx", "sqlx/postgres", "sqlx/tls-rustls-aws-lc-rs", "rullst-core/tls"]
recovery-postgres = ["dep:sqlx", "sqlx/any", "sqlx/postgres", "sqlx/tls-rustls-aws-lc-rs", "rullst-core/tls"]
email-login-sqlite = ["recovery-sqlite"]
email-login-postgres = ["recovery-postgres"]
api-tokens-sqlite = ["recovery-sqlite"]
api-tokens-postgres = ["recovery-postgres"]
# Server-side registry of `rullst_session` logins (`session_registry`) over
# the application's own SQLx pool, one feature per database.
session-registry-sqlite = ["dep:sqlx", "sqlx/sqlite"]
session-registry-postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/tls-rustls-aws-lc-rs", "rullst-core/tls"]
session-registry-mysql = ["dep:sqlx", "sqlx/mysql", "sqlx/tls-rustls-aws-lc-rs", "rullst-core/tls"]

[dependencies]
rullst-core = { workspace = true }
argon2 = "0.6.0"
rand = { workspace = true }
aes-gcm = "0.11.0"
sha2 = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
rullst-connect = { workspace = true, optional = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
ring = { workspace = true, features = ["std"] }
# ES256 passkey keys and signatures (`passkeys`); the same features as
# rustls's `aws_lc_rs`.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"], optional = true }
tower = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
dotenvy = { workspace = true }
url = "2.5.8"
jsonwebtoken = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true, features = ["runtime-tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-std"] }
tempfile = "3"
criterion = { workspace = true, features = ["async_tokio"] }
# Only the differential test of the ES256 checks (es256_differential_tests.rs)
# compares aws-lc-rs with the p256 point check used before 13.0.0-alpha.6.
p256 = "0.14.0"

[[bench]]
name = "auth_bench"
harness = false

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }
