[package]
name = "rullst-studio"
version = "12.0.0"
edition = "2024"
license = "MIT"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }

[features]
default = []
strict-sqlite = ["rullst-core/strict-sqlite", "rullst-orm/strict-sqlite"]
strict-postgres = ["rullst-core/strict-postgres", "rullst-orm/strict-postgres"]
strict-mysql = ["rullst-core/strict-mysql", "rullst-orm/strict-mysql"]

[dependencies]
rullst-core = { version = "12.0.0", path = "../rullst-core" }
rullst-orm = { version = "12.0.0", path = "../rullst-orm" }
rullst-capital = { version = "12.0.0", path = "../rullst-capital" }
rullst-macros = { version = "12.0.0", path = "../rullst-macros" }
rullst-security = { version = "12.0.0", path = "../rullst-security" }

axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["axum", "reqwest"] }
sqlx = { version = "0.9", features = ["sqlite", "postgres", "mysql", "runtime-tokio", "tls-rustls"] }
urlencoding = "2.1.3"
chrono = "0.4.45"
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures-util = "0.3.33"

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]
