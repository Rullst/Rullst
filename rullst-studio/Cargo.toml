[package]
name = "rullst-studio"
version = "13.0.0-alpha.4"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Developer Control Room, visual debugger, and telemetry dashboard for Rullst."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-studio"
keywords = ["studio", "dashboard", "telemetry", "debugger", "devtools"]
categories = ["development-tools", "web-programming"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }

[features]
default = ["drivers-all", "queue-sqlite"]
drivers-all = ["rullst-core/drivers-all", "rullst-orm/drivers-all"]
queue-sqlite = ["rullst-core/queue-sqlite"]
strict-sqlite = ["rullst-core/strict-sqlite", "rullst-orm/strict-sqlite"]
strict-postgres = ["rullst-core/strict-postgres", "rullst-orm/strict-postgres"]
strict-mysql = ["rullst-core/strict-mysql", "rullst-orm/strict-mysql"]
# The standalone remote-projects Studio (`rullst-studio` binary): an HTTP
# client, token encryption and the SQLite history. Off by default, so
# applications that mount Studio in development do not build them.
remote = ["sqlx/sqlite", "dep:reqwest", "dep:ring"]

[dependencies]
rullst-core = { workspace = true, features = ["orm"] }
rullst-orm = { workspace = true }
rullst-capital = { workspace = true }
rullst-macros = { workspace = true }
rullst-security = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = "6"
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls-aws-lc-rs"] }
urlencoding = { workspace = true }
chrono = { workspace = true }
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures-util = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true, features = ["rustls"], optional = true }
ring = { workspace = true, features = ["std"], optional = true }

[[bin]]
name = "rullst-studio"
path = "src/bin/rullst-studio.rs"
required-features = ["remote"]

[dev-dependencies]
rullst-orm = { workspace = true, features = ["drivers-all"] }
# The paused clock (`test-util`) drives the remote poller's loop in tests.
tokio = { workspace = true, features = ["full", "test-util"] }
rullst-core = { workspace = true, features = ["queue-sqlite"] }
testcontainers = { version = "0.27.3", default-features = false, features = ["aws-lc-rs"] }
testcontainers-modules = { version = "0.15.0", default-features = false, features = ["aws-lc-rs", "postgres", "mysql", "mariadb"] }

[package.metadata.cargo-machete]
ignored = []
