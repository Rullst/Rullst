[package]
name = "rullst-studio"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Developer Control Room, visual debugger, and telemetry dashboard for Rullst."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-studio"
keywords = ["studio", "dashboard", "telemetry", "debugger", "devtools"]
categories = ["development-tools", "web-programming"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }

[features]
default = []
strict-sqlite = ["rullst-core/strict-sqlite", "rullst-orm/strict-sqlite"]
strict-postgres = ["rullst-core/strict-postgres", "rullst-orm/strict-postgres"]
strict-mysql = ["rullst-core/strict-mysql", "rullst-orm/strict-mysql"]

[dependencies]
rullst-core = { workspace = true, features = ["orm", "queue-sqlite"] }
rullst-orm = { workspace = true }
rullst-capital = { workspace = true }
rullst-macros = { workspace = true }
rullst-security = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["axum", "reqwest"] }
sqlx = { workspace = true, features = ["sqlite", "postgres", "mysql", "runtime-tokio", "tls-rustls"] }
urlencoding = { workspace = true }
chrono = { workspace = true }
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures-util = { workspace = true }

[package.metadata.cargo-machete]
ignored = []
