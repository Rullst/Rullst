[files]
# Exclude provider files — they contain RSA/JWK test key data (base64 strings)
# that trigger false positives for the typos spell checker.
extend-exclude = [
    "rullst-connect/src/providers/apple.rs",
    "rullst-connect/src/providers/google.rs",
    "rullst-connect/src/providers/oidc.rs",
]

[default.extend-words]
# RSA/JWK base64 key tokens in test data
Ba = "Ba"
Jus = "Jus"
Ue = "Ue"

# Technical identifiers — NOT typos
wheres = "wheres"   # SQL WHERE clause collection field in rullst-orm-macros
COSE = "COSE"       # CBOR Object Signing and Encryption (WebAuthn standard)
cose = "cose"       # variable names for COSE keys in passkey.rs
Ratatui = "Ratatui" # real Rust TUI library name
Braket = "Braket"   # AWS Braket (quantum computing product)
CAF = "CAF"         # product SKU code in ERP seed data
