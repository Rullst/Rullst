[files]
extend-exclude = [
    "cargo-rullst/src/blueprints/assets/htmx-2.0.11.min.js",
    "examples/blog/assets/vendor/htmx-1.9.12.min.js",
    "examples/lms/static/htmx-2.0.11.min.js",
    "examples/iot-gateway/static/htmx-2.0.11.min.js",
    "examples/blog/assets/vendor/pico-2.1.1.slate.min.css",
    "rullst-nexus/assets/htmx-2.0.4.min.js",
    "rullst-connect/src/providers/apple.rs",
    "rullst-connect/src/providers/google.rs",
    "rullst-connect/src/providers/oidc.rs",
    "sbom-cyclonedx.json",
    # Golden corpora of the ORM's date/time types: generated text and hex
    # bytes recorded from chrono.
    "rullst-orm/src/temporal/golden/",
    # CLDR month, weekday and currency names in other languages (generated
    # tables).
    "rullst-core/src/i18n/format/data_dates.rs",
    "rullst-core/src/i18n/format/data_numbers.rs",
    "rullst-core/src/i18n/format/cldr_tests.rs",
    "rullst-core/src/i18n/format/cldr_date_tests.rs",
    # Generated public-API listings: paths and names come from the checked
    # sources and their dependencies (for example `serde::ser`).
    ".github/public-api/",
    # Unmodified upstream Wycheproof vectors (base64 keys, upstream comments);
    # the test checks the file's SHA-256, so it cannot be corrected here.
    "rullst-auth/tests/fixtures/wycheproof/",
    # Brazilian Portuguese website pages; the dictionary is English.
    "site/src/pages/landing/pt_top.rs",
    "site/src/pages/landing/pt_bottom.rs",
    "site/src/pages/compare/pt.rs",
    "site/src/pages/privacy/pt.rs",
    # Brazilian Portuguese book pages; their code blocks match the English
    # pages, which are checked (.github/check-translations.py).
    "docs/src/pt-BR/",
    # Golden cron vectors: random field-shaped strings recorded from the
    # `cron` crate (`Nd-Ow`, `/yor`), which must stay as generated.
    "rullst-core/src/scheduler_cron_golden/",
    "rullst-messaging/src/schedules/cron_expression_vectors.txt"
]

[default]
# A Portuguese phrase of the website generator (site/src/benchmarks/) that
# the English dictionary would correct.
extend-ignore-re = ["Eles se atualizam"]

[default.extend-words]
# Eclipse Mosquitto, the MQTT broker.
Mosquitto = "Mosquitto"
# Standard in-toto signed provenance filename suffix (.intoto.jsonl).
intoto = "intoto"
Ba = "Ba"
Jus = "Jus"
Ue = "Ue"
tabel = "tabel"
wheres = "wheres"
COSE = "COSE"
cose = "cose"
Ratatui = "Ratatui"
Braket = "Braket"
CAF = "CAF"
Pilar = "Pilar"
pilar = "pilar"
Interative = "Interative"
Hashi = "Hashi"
HashiCorp = "HashiCorp"
dbe = "dbe"
serie = "serie"
series = "series"
Cliente = "Cliente"
cliente = "cliente"
Anual = "Anual"
anual = "anual"
mor = "mor"
MoR = "MoR"
MOR = "MOR"
erros = "erros"
Curso = "Curso"
# File extensions rejected by the mail attachment inspector.
hta = "hta"
jse = "jse"
vbe = "vbe"
wsf = "wsf"
wsh = "wsh"
scf = "scf"
msp = "msp"
cpl = "cpl"
pif = "pif"
chm = "chm"
mht = "mht"
xht = "xht"
svgz = "svgz"

[type.rust.extend-words]
# ISO 4217 code of the Jordanian dinar, used by the minor-unit table.
JOD = "JOD"
# Portuguese imperative used by the localized account templates.
Confirme = "Confirme"

# Portuguese words of the website generator's benchmark texts
# (site/src/benchmarks/), which keep each sentence in both languages.
altas = "altas"
limite = "limite"
