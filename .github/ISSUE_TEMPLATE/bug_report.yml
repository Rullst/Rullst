name: Bug report
description: A Rullst crate, the CLI or the documentation does not behave as documented.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities:** do not open a public issue. Report them
        privately as described in
        [SECURITY.md](https://github.com/Rullst/Rullst/blob/main/SECURITY.md).

        Never include credentials, access tokens, real user data, private
        source code or an unredacted production database in this report.
  - type: input
    id: version
    attributes:
      label: Rullst version
      description: >-
        The exact versions from `Cargo.lock`, and `cargo rullst --version` if
        the CLI is involved. For unreleased source, the commit SHA.
      placeholder: rullst 13.0.0-alpha.6, cargo-rullst 13.0.0-alpha.6
    validations:
      required: true
  - type: textarea
    id: crates-and-features
    attributes:
      label: Crates and features enabled
      description: >-
        The Rullst crates your project depends on with their Cargo features,
        and the starter, database or provider involved, if any.
      placeholder: |
        rullst = { version = "=13.0.0-alpha.6", features = ["orm", "strict-postgres", "auth"] }
      render: toml
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Rust version
      description: >-
        The OS and architecture, and the output of `rustc --version`. Say
        whether it happens under `cargo rullst dev` or in a release build.
      placeholder: Ubuntu 24.04 x86_64, rustc 1.100.0, release build
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: What the documentation says should happen. Link the page if you can.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: >-
        The complete relevant error or output, with secrets and personal data
        removed. For a CI-only failure, the run URL, job name and source SHA.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >-
        The smallest code and the exact commands that show the problem: for
        example the `cargo rullst new` command or wizard choices, then the
        command that fails. Say whether it happens every time, and the last
        version that worked, if any.
    validations:
      required: true
  - type: dropdown
    id: ai-assistant
    attributes:
      label: Did an AI assistant help find or describe this problem?
      description: Optional. It helps us read the report and does not change how it is handled.
      options:
        - "No"
        - "Yes, it helped find the problem"
        - "Yes, it helped write this report"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps, such as related issues or a workaround you found.
    validations:
      required: false
  - type: checkboxes
    id: no-private-data
    attributes:
      label: Secrets and private data
      options:
        - label: >-
            This report contains no secrets (keys, tokens, passwords) and no
            private data (real user data, private source code, production
            databases).
          required: true
