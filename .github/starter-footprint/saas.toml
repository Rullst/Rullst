# Footprint budget of the SaaS starter (`cargo rullst new --default --blueprint saas`),
# checked by the "Starter footprint budgets" job of .github/workflows/ci.yml
# (.github/check-starter-footprint.py runs `cargo rullst footprint --env
# staging --page-weight --bench --budget` on its release build).
#
# Each limit is the figure measured on a GitHub-hosted ubuntu-latest runner
# (4 logical CPUs, Rust 1.99.1; run 43184063650 on 2026-11-12, and run
# 43192785034 for page_first_visit_bytes after the favicon became a 192x192
# PNG) plus a margin, rounded up: binary +15 %, idle memory +20 %,
# dependencies +5 %, bytes per request and page bytes +10 % (at least 1 KiB),
# page requests and third-party origins +0. CPU time is reported in the job
# summary and never limited: it varies between shared runners.
#
# To raise a limit on purpose, copy the "Suggested limit" of the job summary
# into this file in the pull request that causes the increase, update the
# measured value beside it and say why in the pull request (MAINTAINING.md,
# "Starter footprint budgets").

[footprint.budgets]
binary_size_bytes = 18_120_081    # measured 15_756_592
idle_rss_bytes = 14_573_568       # measured 12_144_640
dependency_count = 418            # measured 398
bytes_per_request = 4_957         # measured 3_933
page_first_visit_bytes = 25_170   # measured 22_881
page_repeat_visit_bytes = 4_957   # measured 3_933
page_requests = 3                 # measured 3
page_third_party_origins = 0      # measured 0
