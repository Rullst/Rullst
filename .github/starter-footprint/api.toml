# Footprint budget of the API starter (`cargo rullst new --default --blueprint blank --database sqlite --api`),
# checked by the "Starter footprint budgets" job of .github/workflows/ci.yml
# (.github/check-starter-footprint.py runs `cargo rullst footprint --env
# staging --page-weight --bench --budget` on its release build).
#
# Each limit is the figure measured on a GitHub-hosted ubuntu-latest runner
# (4 logical CPUs, Rust 1.99.1; run 43184063650 on 2026-11-12) plus a margin,
# rounded up: binary +15 %, idle memory +20 %, dependencies +5 %, bytes per
# request and page bytes +10 % (at least 1 KiB), page requests and
# third-party origins +0. CPU time is reported in the job summary and never
# limited: it varies between shared runners.
#
# dependency_count was lowered from 417 (measured 397) when the `rullst`
# facade stopped forwarding `strict-*` and `drivers-all` to the optional
# rullst-nexus: that kept rullst-nexus, rullst-auth and 23 crates they need
# in this starter's Cargo.lock although none of them is compiled (374
# measured by run 43234888928 on 2026-11-12).
#
# dependency_count was lowered from 393 (measured 374) when Studio and
# Nexus stopped depending on rullst-security (13.0.0-alpha.6: the security
# store moved to rullst-core): 325 packages in this starter's Cargo.lock,
# measured as the job does, from the repository Cargo.lock, on 2026-11-14.
#
# dependency_count was lowered from 342 (measured 325) and
# compiled_dependency_count added when SQLite-only starters stopped
# building a TLS stack (13.0.0-alpha.6): 257 packages in this starter's
# Cargo.lock, 212 of them compiled, measured as the job does, from the
# repository Cargo.lock, on 2026-11-15 (main at 075f5a276 with this change).
# binary_size_bytes was lowered by the same change, measured by run
# 43680823606 (Rust 1.100.0): 7,600,752 bytes, 10,494,936 before (run
# 43666669225).
#
# To raise a limit on purpose, copy the "Suggested limit" of the job summary
# into this file in the pull request that causes the increase, update the
# measured value beside it and say why in the pull request (MAINTAINING.md,
# "Starter footprint budgets").

[footprint.budgets]
binary_size_bytes = 8_740_865    # measured 7_600_752
idle_rss_bytes = 11_865_293      # measured 9_887_744
dependency_count = 270           # measured 257
compiled_dependency_count = 223  # measured 212
bytes_per_request = 1_112        # measured 88
page_first_visit_bytes = 1_112   # measured 88
page_repeat_visit_bytes = 1_112  # measured 88
page_requests = 1                # measured 1
page_third_party_origins = 0     # measured 0
