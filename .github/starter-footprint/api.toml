# Footprint budget of the API starter (`cargo rullst new --default --blueprint blank --database sqlite --api`),
# checked by the "Starter footprint budgets" job of .github/workflows/ci.yml
# (.github/check-starter-footprint.py runs `cargo rullst footprint --env
# staging --page-weight --bench --budget` on its release build).
#
# Each limit is the figure measured on a GitHub-hosted ubuntu-latest runner
# (4 logical CPUs, Rust 1.99.1; run 43184063650 on 2026-11-12) plus a margin,
# rounded up: binary +15 %, idle memory +20 %, dependencies +5 %, bytes per
# request and page bytes +10 % (at least 1 KiB), page requests and
# third-party origins +0. CPU time is reported in the job summary and never
# limited: it varies between shared runners.
#
# To raise a limit on purpose, copy the "Suggested limit" of the job summary
# into this file in the pull request that causes the increase, update the
# measured value beside it and say why in the pull request (MAINTAINING.md,
# "Starter footprint budgets").

[footprint.budgets]
binary_size_bytes = 12_752_912   # measured 11_089_488
idle_rss_bytes = 11_865_293      # measured 9_887_744
dependency_count = 417           # measured 397
bytes_per_request = 1_112        # measured 88
page_first_visit_bytes = 1_112   # measured 88
page_repeat_visit_bytes = 1_112  # measured 88
page_requests = 1                # measured 1
page_third_party_origins = 0     # measured 0
