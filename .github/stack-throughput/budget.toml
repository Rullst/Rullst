# Throughput budget of .github/check-stack-throughput.py (the "Generated stack
# throughput" job of .github/workflows/bench.yml).
#
# Each min_ratio is the lowest accepted ratio of requests per second, a
# generated stack over the minimal one (the same routes without any layer,
# GET /json) in the same round, at 125 connections on a GitHub-hosted
# ubuntu-latest runner, the server on two CPUs and bombardier 2.0.2 on two
# others (medians of three rounds). The ratio depends on the runner model,
# which the job summary names; the AMD EPYC 7763 runner gives the lowest
# ratios, so the limits are set about 10 % below its figures.
#
# Raise a limit in the pull request that makes the stack faster; never lower
# it to pass a slowdown nobody can explain.

# The Blank starter's GET /json, without a cookie (the CSRF layer mints a
# token and sets its cookie), started in a directory with a static/ folder as
# a generated project is.
#
# History, EPYC 7763: 0.253-0.256 with the CSRF masking of #712 (run
# 43757170678); 0.434-0.452 with the one-layer baseline, the background
# access log and the document-only CSP nonce; 0.518-0.529 without the
# generated router's own CSRF and header layers (run 43764126869, limit
# 0.47). Those runs had no static/ folder, so Server did not mount it. With
# the folder, origin/main b44b144f7 measured 0.442-0.447 (53 700 requests/s,
# 37.6 µs of server CPU per request), because the three static-file
# middlewares wrapped every route; with them on the /static mount only, the
# lazy CSP nonce, the per-thread CSRF mask and the cheaper Set-Cookie and
# access-log line, 0.529-0.540 (63 200 requests/s, 31.3 µs; calibration run
# 43804672004). Other runners in that run: Intel Xeon 6975P-C 0.532-0.534 to
# 0.612-0.620, AMD EPYC 9V45 0.642-0.665 to 0.780-0.782.
[throughput]
min_ratio = 0.48

# The SaaS starter's signed-in GET /dashboard (session and CSRF cookies sent,
# SQLite, the strict profile the starter selects by default), generated by
# this checkout's CLI and built with its own release profile.
#
# EPYC 7763, calibration run 43804672004: origin/main 0.050 (5 900
# requests/s, 337 µs per request: the session lookup and two account
# queries, each behind a ping of SQLx's SQLite worker); with one account
# query and no ping, 0.079 (9 300 requests/s, 215 µs). Intel Xeon 6975P-C
# 0.060-0.061 to 0.093-0.094; AMD EPYC 9V45 0.067-0.069 to 0.108-0.116.
[saas]
min_ratio = 0.07
