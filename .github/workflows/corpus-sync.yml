name: Fuzzing Corpus Sync & Minimization

on:
  schedule:
    - cron: '0 2 * * 0' # Weekly on Sunday at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: rullst-fuzz-v1
  SCCACHE_GHA_RW_MODE: READ_WRITE

jobs:
  targets:
    name: Validate fuzz target inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and export matrix
        id: matrix
        shell: bash
        run: |
          python3 .github/validate-fuzz-targets.py
          matrix="$(jq -c '{include: .}' .github/fuzz-targets.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  cmin-corpus:
    name: Minimize ${{ matrix.target }} corpus
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # nightly
        with:
          toolchain: nightly-2026-08-21

      - name: Install cargo-fuzz 0.13.2
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-fuzz@0.13.2

      - name: Restore target corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.dir }}/corpus/${{ matrix.target }}
          key: fuzz-corpus-v1-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-v1-${{ matrix.target }}-${{ github.sha }}-
            fuzz-corpus-v1-${{ matrix.target }}-

      - name: Verify pinned fuzz dependency graph
        working-directory: ${{ matrix.dir }}
        run: cargo +nightly-2026-08-21 metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Warm and minimize target corpus
        id: corpus
        working-directory: ${{ matrix.dir }}
        continue-on-error: true
        shell: bash
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "corpus/$FUZZ_TARGET"
          args=(-max_total_time=60)
          if [ "$FUZZ_TARGET" = "fuzz_parser" ]; then
            args+=(-max_len=2048 -rss_limit_mb=4096)
          fi
          cargo +nightly-2026-08-21 fuzz run "$FUZZ_TARGET" -- "${args[@]}"
          cargo +nightly-2026-08-21 fuzz cmin "$FUZZ_TARGET" "corpus/$FUZZ_TARGET"

      - name: Reject fuzz dependency lock drift
        if: always()
        working-directory: ${{ matrix.dir }}
        run: git diff --exit-code -- Cargo.lock

      - name: Upload warm-up reproducer
        if: steps.corpus.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-warmup-reproducer-${{ matrix.target }}
          path: ${{ matrix.dir }}/artifacts/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload minimized target corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minimized-fuzz-corpus-${{ matrix.target }}
          path: ${{ matrix.dir }}/corpus/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 30
