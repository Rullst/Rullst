name: Fuzzing Corpus Sync & Minimization

on:
  schedule:
    - cron: '0 2 * * 0' # Weekly on Sunday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cmin-corpus:
    name: Minimize & Sync Fuzz Corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nightly Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked || true

      - name: Restore Fuzz Corpus Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/
          key: fuzz-corpus-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-

      - name: Minimize Seed Corpora (cmin)
        run: |
          mkdir -p fuzz/corpus
          echo "[INFO] Running corpus compaction across active fuzz targets..."
          # Run cmin if fuzz targets and corpus directory exist
          if [ -d "fuzz" ]; then
            for target in $(cargo fuzz list 2>/dev/null || true); do
              if [ -d "fuzz/corpus/$target" ]; then
                echo "Minimizing corpus for target: $target"
                cargo fuzz cmin "$target" || true
              fi
            done
          fi

      - name: Save Optimized Corpus Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: minimized-fuzz-corpus
          path: fuzz/corpus/
          retention-days: 30
