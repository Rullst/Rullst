name: Cargo Audit

on:
  push:
    branches: [main, v12]
  pull_request:
    branches: [main, v12]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.98.1
      - name: Install cargo-audit
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-audit
      - name: Audit production and fuzz dependency locks
        shell: bash
        run: |
          cargo audit
          while IFS= read -r lockfile; do
            echo "Auditing $lockfile"
            cargo audit --no-fetch --file "$lockfile"
          done < <(find . -mindepth 3 -maxdepth 3 \
            -path '*/fuzz/Cargo.lock' -print | sort)
