name: Release to crates.io

# Releases are intentionally tag-only. Every distributable crate is packaged,
# verified, hashed, and attested before the first irreversible upload.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  admit:
    name: Admit exact protected-main release SHA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout tagged source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a semantic tag at the current main head
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH or a SemVer prerelease."
            exit 1
          fi
          git fetch --no-tags --force origin main:refs/remotes/origin/main
          git cat-file -e "${GITHUB_SHA}^{commit}"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "Release tag must resolve to the current origin/main head."
            echo "tag=$GITHUB_SHA main=$main_sha"
            exit 1
          fi

      - name: Test exact-SHA admission policy
        run: python3 .github/test-check-release-admission.py

      - name: Require successful automatic and manual gates for the exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/check-release-admission.py

  verify:
    name: Verify release artifacts without release identity
    needs: admit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: rullst-ci-v1
      SCCACHE_GHA_RW_MODE: READ_ONLY
      RULLST_GENERATED_BUILD_JOBS: "2"
    services:
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    permissions:
      contents: read
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore trusted content-addressed compiler outputs
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy
          cache: false

      - name: Install cargo-audit for release evidence
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-audit

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Enforce immutable third-party Action references
        run: |
          python3 .github/test-validate-action-pins.py
          python3 .github/validate-action-pins.py

      - name: Run Clippy (strict)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify public minimal and isolated feature boundaries
        run: bash .github/check-feature-boundaries.sh

      - name: Run the explicit threat-model release-negative minimum
        run: bash .github/check-threat-model-release-minimum.sh

      - name: Run the versioned deterministic AI evals
        run: bash .github/check-ai-evals.sh

      - name: Run all workspace tests
        run: cargo test --workspace --all-features

      - name: Run portable transactional outbox contract
        run: >-
          cargo test -p rullst-orm --no-default-features
          --test outbox_transaction_test -- --test-threads=1

      - name: Run provider matrices (SQL, document, edge and search)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          RULLST_REQUIRE_TESTCONTAINERS: "true"
        run: |
          cargo test -p rullst-orm --test matrix_postgres --test matrix_mysql --test matrix_mariadb -- --test-threads=1
          cargo test -p rullst-orm --no-default-features --features mongodb --test matrix_mongodb
          cargo test -p rullst-orm --no-default-features --features surrealdb --test matrix_surrealdb
          cargo test -p rullst-orm --no-default-features --features turso --test matrix_turso
          cargo test -p rullst-orm --no-default-features --features scout-http --test matrix_meilisearch
          cargo test -p rullst-orm --no-default-features --features pgvector,strict-postgres --test matrix_pgvector
          cargo test -p rullst-orm --no-default-features --features qdrant --test matrix_qdrant
          cargo test -p rullst-orm --no-default-features --features redis --test matrix_redis_data
          cargo test -p rullst-studio --no-default-features --test data_browser_mutation_sqlite -- --test-threads=1
          cargo test -p rullst-studio --no-default-features --features strict-postgres --test data_browser_mutation_postgres -- --test-threads=1
          cargo test -p rullst-studio --no-default-features --features strict-mysql --test data_browser_mutation_mysql -- --test-threads=1
          cargo test -p rullst-studio --no-default-features --features strict-mysql --test data_browser_mutation_mariadb -- --test-threads=1
          cargo test -p rullst-nexus --no-default-features --test tenant_audit -- --test-threads=1
          cargo test -p rullst-ai --features sql-memory --test sql_chat_memory_postgres --test sql_chat_memory_mysql --test sql_chat_memory_mariadb -- --test-threads=1
          cargo test -p rullst-capital --features quota-sql --test quota_sql_postgres --test quota_sql_mysql --test quota_sql_mariadb -- --test-threads=1

      - name: Run live Redis distributed rate-limit contract
        env:
          RULLST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test -p rullst-security --features redis-rate-limit --test redis_rate_limit_live

      - name: Run live Redis queue scheduling contract
        env:
          RULLST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test -p rullst-core --features queue-redis --test queue_scheduling_live

      - name: Run live Redis metadata-only cache inspection contract
        env:
          RULLST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test -p rullst-core --features cache-redis --test cache_inspection_live

      - name: Run ORM cache and post-commit contracts
        env:
          RULLST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: >-
          cargo test -p rullst-orm --features redis
          --test query_cache_live
          --test post_commit_transaction_test
          --test scout_post_commit_test

      - name: Verify current crates.io name ownership and bootstrap scope
        run: bash .github/check-crates-ownership.sh

      - name: Validate tag and package every publishable crate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          # Package verification builds each extracted crate outside the
          # workspace profiles. Keep bundled DuckDB DWARF and parallel C++
          # compilation bounded without reducing the all-feature surface.
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_BUILD_JOBS: "2"
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH or a SemVer prerelease such as v12.0.0-rc.1."
            exit 1
          fi
          release_version="${RELEASE_TAG#v}"
          cargo metadata --locked --no-deps --format-version 1 |
            jq --exit-status \
              --slurpfile release_order .github/release-order.json \
              --arg version "$release_version" \
              -f .github/release-preflight.jq

          cargo package \
            --workspace \
            --exclude rullst-blog-example \
            --all-features \
            --locked

      - name: Inspect packaged crate contents
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/audit-packages.sh "${RELEASE_TAG#v}"

      - name: Test crates-only consumer and installed CLI blueprints
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          # The extracted consumer is intentionally outside the workspace, so
          # it needs the same native-build bounds as package verification.
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_BUILD_JOBS: "2"
        run: bash .github/test-packaged-distribution.sh "${RELEASE_TAG#v}"

      - name: Generate tag-bound SBOM, audit, and bounded compliance evidence
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          evidence_dir="target/package/release-evidence"
          mkdir -p "$evidence_dir"

          cargo metadata --locked --format-version 1 \
            > "$evidence_dir/cargo-metadata.json"

          # Any advisory blocks the release. The JSON result is retained as
          # tag-bound evidence; v12 has no configured advisory exceptions.
          cargo audit --json > "$evidence_dir/cargo-audit.json"

          # This command intentionally emits NOT CHECKED / NOT EVALUATED for
          # controls that a bounded source audit cannot establish.
          cargo run --locked -p cargo-rullst --bin rullst -- \
            audit --idor --compliance --sbom
          mv SECURITY_COMPLIANCE.md \
            "$evidence_dir/security-evidence.md"
          mv sbom-cyclonedx.json \
            "$evidence_dir/sbom-cyclonedx-1.5.json"
          cp Cargo.lock "$evidence_dir/Cargo.lock"
          cp deny.toml "$evidence_dir/deny.toml"
          cp docs/src/security-advisory-exceptions.md \
            "$evidence_dir/security-advisory-exceptions.md"
          cp .github/release-order.json \
            "$evidence_dir/release-order.json"
          mv target/package/crates-ownership.json \
            "$evidence_dir/crates-ownership.json"

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$GITHUB_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{
              schema_version: 1,
              release_tag: $tag,
              commit_sha: $commit,
              repository: $repository,
              github_run_id: $run_id,
              evidence_boundary: "Generated from the tagged source and Cargo.lock; this is not a regulatory certification."
            }' > "$evidence_dir/release-context.json"

          python3 .github/render-release-notes.py \
            "$release_version" \
            "$evidence_dir/release-notes.md"

      - name: Generate release checksums
        run: |
          cd target/package
          sha256sum -- *.crate | sort -k2 > checksums.txt
          sha256sum -- release-evidence/* | sort -k2 > evidence-checksums.txt

      - name: Preserve verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-crates
          path: |
            target/package/*.crate
            target/package/checksums.txt
            target/package/evidence-checksums.txt
            target/package/release-evidence/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  attest:
    name: Attest verified artifacts without source execution
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-crates
          path: verified-crates

      - name: Verify downloaded artifact checksums
        working-directory: verified-crates
        run: |
          sha256sum --check checksums.txt
          sha256sum --check evidence-checksums.txt

      - name: Generate cryptographic build attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            verified-crates/*.crate
            verified-crates/evidence-checksums.txt
            verified-crates/release-evidence/*

  publication_preflight:
    name: Reproduce publication inputs without registry identity
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-crates
          path: verified-crates

      - name: Verify downloaded artifact checksums
        working-directory: verified-crates
        run: |
          sha256sum --check checksums.txt
          sha256sum --check evidence-checksums.txt

      - name: Reproduce verified packages from the tagged checkout
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          cargo package \
            --workspace \
            --exclude rullst-blog-example \
            --all-features \
            --locked \
            --no-verify
          bash .github/audit-packages.sh "$release_version"

          while IFS= read -r crate; do
            cmp --silent \
              "verified-crates/${crate}-${release_version}.crate" \
              "target/package/${crate}-${release_version}.crate" || {
                echo "Reproduced archive differs for ${crate} ${release_version}."
                exit 1
              }
          done < <(jq -r '.[]' .github/release-order.json)

      - name: Recheck crates.io ownership immediately before publication
        run: bash .github/check-crates-ownership.sh target/package/crates-ownership-prepublish.json

      - name: Seal prepublication ownership evidence
        run: |
          mkdir -p publication-evidence
          cp target/package/crates-ownership-prepublish.json publication-evidence/
          sha256sum publication-evidence/crates-ownership-prepublish.json \
            > publication-evidence/checksum.txt

      - name: Preserve prepublication ownership evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-evidence
          path: publication-evidence/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish previously verified crates
    needs: [attest, publication_preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: crates-io
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-crates
          path: verified-crates

      - name: Download prepublication ownership evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publication-evidence
          path: publication-evidence

      - name: Verify immutable publication inputs
        run: |
          (
            cd verified-crates
            sha256sum --check checksums.txt
            sha256sum --check evidence-checksums.txt
          )
          sha256sum --check publication-evidence/checksum.txt
          if jq -e '.has_unregistered == false and all(.packages[]; .registry_status == "registered")' \
            publication-evidence/crates-ownership-prepublish.json >/dev/null; then
            echo "All release packages are registered and owned by the reviewed owner."
          else
            echo "Stable publication refuses bootstrap or unexpected ownership state."
            exit 1
          fi

      - name: Checkout exact admitted source before authentication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: publication-source
          persist-credentials: false

      - name: Prepare isolated Cargo publication configuration
        run: |
          install -d -m 700 \
            /tmp/rullst-publish-work \
            /tmp/rullst-publish-cargo-home
          printf '%s\n' \
            '[registry]' \
            'global-credential-providers = ["cargo:token"]' \
            '[registries.crates-io]' \
            'index = "sparse+https://index.crates.io/"' \
            > /tmp/rullst-publish-cargo-home/config.toml

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish all workspace crates in dependency order
        env:
          CARGO_HOME: /tmp/rullst-publish-cargo-home
          CRATES_IO_TRUSTED_TOKEN: ${{ steps.auth.outputs.token }}
          OWNERSHIP_EVIDENCE: ${{ github.workspace }}/publication-evidence/crates-ownership-prepublish.json
          PUBLISH_WORKDIR: /tmp/rullst-publish-work
          RELEASE_TAG: ${{ github.ref_name }}
          VERIFIED_CRATES: ${{ github.workspace }}/verified-crates
          WORKSPACE_MANIFEST: ${{ github.workspace }}/publication-source/Cargo.toml
        run: |
          cd "$PUBLISH_WORKDIR"
          release_version="${RELEASE_TAG#v}"

          publish_crate() {
            crate="$1"
            verified_archive="${VERIFIED_CRATES}/${crate}-${release_version}.crate"
            if [ ! -f "$verified_archive" ]; then
              echo "Missing verified package: ${verified_archive}"
              return 1
            fi

            registry_status="$(jq -er \
              --arg crate "$crate" \
              '.packages[] | select(.crate == $crate) | .registry_status' \
              "$OWNERSHIP_EVIDENCE")"
            if [ "$registry_status" != "registered" ]; then
              echo "Unexpected registry status for ${crate}: ${registry_status}"
              return 1
            fi

            expected_checksum="$(sha256sum "$verified_archive" | cut -d ' ' -f 1)"
            attempts=0
            while [ "$attempts" -lt 6 ]; do
              if published_metadata="$(curl --fail --silent \
                --user-agent "rullst-release/${release_version}" \
                "https://crates.io/api/v1/crates/${crate}/${release_version}")"; then
                published_checksum="$(jq -r '.version.checksum // empty' <<< "$published_metadata")"
                if [ "$published_checksum" != "$expected_checksum" ]; then
                  echo "Checksum mismatch for existing ${crate} ${release_version}."
                  return 1
                fi
                echo "${crate} ${release_version} is already published; skipping."
                return 0
              fi

              attempts=$((attempts + 1))
              echo "Publishing ${crate} ${release_version} (attempt ${attempts}/6)..."
              if env \
                -u CARGO_TARGET_DIR \
                -u RUSTC_WRAPPER \
                -u RUSTC_WORKSPACE_WRAPPER \
                CARGO_REGISTRY_TOKEN="$CRATES_IO_TRUSTED_TOKEN" \
                CARGO_REGISTRIES_CRATES_IO_TOKEN="$CRATES_IO_TRUSTED_TOKEN" \
                cargo publish \
                  --manifest-path "$WORKSPACE_MANIFEST" \
                  --package "$crate" \
                  --registry crates-io \
                  --locked \
                  --no-verify; then
                index_attempts=0
                while [ "$index_attempts" -lt 18 ]; do
                  if published_metadata="$(curl --fail --silent \
                    --user-agent "rullst-release/${release_version}" \
                    "https://crates.io/api/v1/crates/${crate}/${release_version}")"; then
                    published_checksum="$(jq -r '.version.checksum // empty' <<< "$published_metadata")"
                    if [ "$published_checksum" != "$expected_checksum" ]; then
                      echo "Checksum mismatch after publishing ${crate} ${release_version}."
                      return 1
                    fi
                    echo "${crate} ${release_version} indexed with the verified checksum."
                    return 0
                  fi

                  index_attempts=$((index_attempts + 1))
                  sleep 10
                done

                echo "Could not verify crates.io indexing for ${crate} ${release_version}."
                return 1
              fi

              sleep $((attempts * 10))
            done

            echo "Failed to publish ${crate} ${release_version}."
            return 1
          }

          while IFS= read -r crate; do
            publish_crate "$crate"
          done < <(jq -r '.[]' "$VERIFIED_CRATES/release-evidence/release-order.json")

  github_release:
    name: Create GitHub release without registry identity
    needs: [attest, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-crates
          path: verified-crates

      - name: Verify downloaded artifact checksums
        working-directory: verified-crates
        run: |
          sha256sum --check checksums.txt
          sha256sum --check evidence-checksums.txt

      - name: Create GitHub release from verified artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: verified-crates/release-evidence/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            verified-crates/*.crate
            verified-crates/checksums.txt
            verified-crates/evidence-checksums.txt
            verified-crates/release-evidence/*
          fail_on_unmatched_files: true
