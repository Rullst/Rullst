name: Release to crates.io

# This workflow ONLY runs when a new version tag is pushed (e.g. v1.0.5)
# It will NOT run on regular commits to main or dev.
# To release: merge dev -> main, bump versions, push tag v1.X.X

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Step 1: Run full test suite before publishing anything
  verify:
    name: Verify before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (strict)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run all workspace tests
        run: cargo test --workspace --all-features

      - name: Run Matrix DB Tests (Testcontainers — PostgreSQL & MySQL)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: cargo test -p rullst-orm --test matrix_postgres --test matrix_mysql -- --test-threads=1

  publish:
    name: Publish to crates.io and GitHub
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish all workspace crates in topological order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          publish_crate() {
            echo "Publishing $1..."
            cargo publish -p "$1"
            echo "Waiting for crates.io index to update..."
            sleep 15
          }

          publish_crate rullst-core
          publish_crate rullst-orm-macros
          publish_crate rullst-orm
          publish_crate rullst-macros
          publish_crate rullst-connect
          publish_crate rullst-auth
          publish_crate rullst-mail
          publish_crate rullst-ai
          publish_crate rullst-nexus
          publish_crate rullst-capital
          publish_crate rullst-studio
          publish_crate rullst
          publish_crate cargo-rullst

      - name: Generate Hashes for SLSA
        id: hash
        run: |
          cargo package -p rullst-core
          cargo package -p rullst-orm-macros
          cargo package -p rullst-orm
          cargo package -p rullst-macros
          cargo package -p rullst-connect
          cargo package -p rullst-auth
          cargo package -p rullst-mail
          cargo package -p rullst-ai
          cargo package -p rullst-nexus
          cargo package -p rullst-capital
          cargo package -p rullst-studio
          cargo package -p rullst
          cargo package -p cargo-rullst
          
          cd target/package
          sha256sum *.crate > checksums.txt
          echo "hashes=$(cat checksums.txt | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload Crates
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: target/package/*.crate

  provenance:
    name: Generate SLSA 3 Provenance
    needs: [publish]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.publish.outputs.hashes }}"
      upload-assets: true
