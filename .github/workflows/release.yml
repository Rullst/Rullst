name: Release to crates.io

# Releases are intentionally tag-only. Every distributable crate is packaged,
# verified, hashed, and attested before the first irreversible upload.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify and attest release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt, clippy

      - name: Install cargo-audit for release evidence
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-audit

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (strict)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify public minimal and isolated feature boundaries
        run: bash .github/check-feature-boundaries.sh

      - name: Run the explicit threat-model release-negative minimum
        run: bash .github/check-threat-model-release-minimum.sh

      - name: Run the versioned deterministic AI evals
        run: bash .github/check-ai-evals.sh

      - name: Run all workspace tests
        run: cargo test --workspace --all-features

      - name: Run portable transactional outbox contract
        run: >-
          cargo test -p rullst-orm --no-default-features
          --test outbox_transaction_test -- --test-threads=1

      - name: Run provider matrices (SQL, document, edge and search)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          RULLST_REQUIRE_TESTCONTAINERS: "true"
        run: |
          cargo test -p rullst-orm --test matrix_postgres --test matrix_mysql --test matrix_mariadb -- --test-threads=1
          cargo test -p rullst-orm --no-default-features --features mongodb --test matrix_mongodb
          cargo test -p rullst-orm --no-default-features --features surrealdb --test matrix_surrealdb
          cargo test -p rullst-orm --no-default-features --features turso --test matrix_turso
          cargo test -p rullst-orm --no-default-features --features scout-http --test matrix_meilisearch
          cargo test -p rullst-orm --no-default-features --features pgvector,strict-postgres --test matrix_pgvector
          cargo test -p rullst-orm --no-default-features --features qdrant --test matrix_qdrant
          cargo test -p rullst-orm --no-default-features --features redis --test matrix_redis_data
          cargo test -p rullst-studio --no-default-features --test data_browser_mutation_sqlite -- --test-threads=1
          cargo test -p rullst-studio --no-default-features --features strict-postgres --test data_browser_mutation_postgres -- --test-threads=1
          cargo test -p rullst-studio --no-default-features --features strict-mysql --test data_browser_mutation_mysql -- --test-threads=1
          cargo test -p rullst-studio --no-default-features --features strict-mysql --test data_browser_mutation_mariadb -- --test-threads=1

      - name: Run live Redis distributed rate-limit contract
        env:
          RULLST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test -p rullst-security --features redis-rate-limit --test redis_rate_limit_live

      - name: Run live Redis queue scheduling contract
        env:
          RULLST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test -p rullst-core --features queue-redis --test queue_scheduling_live

      - name: Run ORM cache and post-commit contracts
        env:
          RULLST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: >-
          cargo test -p rullst-orm --features redis
          --test query_cache_live
          --test post_commit_transaction_test
          --test scout_post_commit_test

      - name: Verify current crates.io name ownership and bootstrap scope
        run: bash .github/check-crates-ownership.sh

      - name: Validate tag and package every publishable crate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH or a SemVer prerelease such as v12.0.0-rc.1."
            exit 1
          fi
          release_version="${RELEASE_TAG#v}"
          cargo metadata --no-deps --format-version 1 |
            jq --exit-status \
              --slurpfile release_order .github/release-order.json \
              --arg version "$release_version" \
              -f .github/release-preflight.jq

          cargo package \
            --workspace \
            --exclude rullst-blog-example \
            --all-features \
            --locked

      - name: Inspect packaged crate contents
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/audit-packages.sh "${RELEASE_TAG#v}"

      - name: Test crates-only consumer and installed CLI blueprints
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/test-packaged-distribution.sh "${RELEASE_TAG#v}"

      - name: Generate tag-bound SBOM, audit, and bounded compliance evidence
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          evidence_dir="target/package/release-evidence"
          mkdir -p "$evidence_dir"

          cargo metadata --locked --format-version 1 \
            > "$evidence_dir/cargo-metadata.json"

          # Any advisory outside the governed, expiring exception list blocks
          # the release. The JSON result is retained as tag-bound evidence.
          cargo audit --json \
            --ignore RUSTSEC-2023-0071 \
            > "$evidence_dir/cargo-audit.json"

          # This command intentionally emits NOT CHECKED / NOT EVALUATED for
          # controls that a bounded source audit cannot establish.
          cargo run --locked -p cargo-rullst --bin rullst -- \
            audit --idor --compliance --sbom
          mv SECURITY_COMPLIANCE.md \
            "$evidence_dir/security-evidence.md"
          mv sbom-cyclonedx.json \
            "$evidence_dir/sbom-cyclonedx-1.5.json"
          cp Cargo.lock "$evidence_dir/Cargo.lock"
          cp deny.toml "$evidence_dir/deny.toml"
          cp docs/src/security-advisory-exceptions.md \
            "$evidence_dir/security-advisory-exceptions.md"
          mv target/package/crates-ownership.json \
            "$evidence_dir/crates-ownership.json"

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$GITHUB_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{
              schema_version: 1,
              release_tag: $tag,
              commit_sha: $commit,
              repository: $repository,
              github_run_id: $run_id,
              evidence_boundary: "Generated from the tagged source and Cargo.lock; this is not a regulatory certification."
            }' > "$evidence_dir/release-context.json"

      - name: Generate release checksums
        id: hash
        run: |
          cd target/package
          sha256sum -- *.crate | sort -k2 > checksums.txt
          sha256sum -- release-evidence/* | sort -k2 > evidence-checksums.txt
          echo "hashes=$(base64 -w0 < checksums.txt)" >> "$GITHUB_OUTPUT"

      - name: Generate cryptographic build attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/package/*.crate
            target/package/evidence-checksums.txt
            target/package/release-evidence/*

      - name: Preserve verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-crates
          path: |
            target/package/*.crate
            target/package/checksums.txt
            target/package/evidence-checksums.txt
            target/package/release-evidence/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish verified crates
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: crates-io
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-crates
          path: verified-crates

      - name: Verify downloaded artifact checksums
        working-directory: verified-crates
        run: |
          sha256sum --check checksums.txt
          sha256sum --check evidence-checksums.txt

      - name: Reproduce verified packages from the tagged checkout
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          cargo package \
            --workspace \
            --exclude rullst-blog-example \
            --all-features \
            --locked \
            --no-verify
          bash .github/audit-packages.sh "$release_version"

          while IFS= read -r crate; do
            cmp --silent \
              "verified-crates/${crate}-${release_version}.crate" \
              "target/package/${crate}-${release_version}.crate" || {
                echo "Reproduced archive differs for ${crate} ${release_version}."
                exit 1
              }
          done < <(jq -r '.[]' .github/release-order.json)

      - name: Recheck crates.io ownership immediately before publication
        id: registry_names
        run: bash .github/check-crates-ownership.sh target/package/crates-ownership-prepublish.json

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Require a temporary credential for first publication
        if: steps.registry_names.outputs.has_unregistered == 'true'
        env:
          CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "$CRATES_IO_BOOTSTRAP_TOKEN" ]; then
            echo "CRATES_IO_BOOTSTRAP_TOKEN is required while reviewed crate names remain unregistered."
            exit 1
          fi

      - name: Publish all workspace crates in dependency order
        env:
          CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
          CRATES_IO_TRUSTED_TOKEN: ${{ steps.auth.outputs.token }}
          OWNERSHIP_EVIDENCE: target/package/crates-ownership-prepublish.json
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"

          publish_crate() {
            crate="$1"
            verified_archive="verified-crates/${crate}-${release_version}.crate"
            if [ ! -f "$verified_archive" ]; then
              echo "Missing verified package: ${verified_archive}"
              return 1
            fi

            registry_status="$(jq -er \
              --arg crate "$crate" \
              '.packages[] | select(.crate == $crate) | .registry_status' \
              "$OWNERSHIP_EVIDENCE")"
            case "$registry_status" in
              registered)
                crate_token="$CRATES_IO_TRUSTED_TOKEN"
                ;;
              unregistered-reviewed-bootstrap)
                crate_token="$CRATES_IO_BOOTSTRAP_TOKEN"
                ;;
              *)
                echo "Unexpected registry status for ${crate}: ${registry_status}"
                return 1
                ;;
            esac

            expected_checksum="$(sha256sum "$verified_archive" | cut -d ' ' -f 1)"
            attempts=0
            while [ "$attempts" -lt 6 ]; do
              if published_metadata="$(curl --fail --silent \
                --user-agent "rullst-release/${release_version}" \
                "https://crates.io/api/v1/crates/${crate}/${release_version}")"; then
                published_checksum="$(jq -r '.version.checksum // empty' <<< "$published_metadata")"
                if [ "$published_checksum" != "$expected_checksum" ]; then
                  echo "Checksum mismatch for existing ${crate} ${release_version}."
                  return 1
                fi
                echo "${crate} ${release_version} is already published; skipping."
                return 0
              fi

              attempts=$((attempts + 1))
              echo "Publishing ${crate} ${release_version} (attempt ${attempts}/6)..."
              if CARGO_REGISTRY_TOKEN="$crate_token" \
                cargo publish -p "$crate" --locked --no-verify; then
                index_attempts=0
                while [ "$index_attempts" -lt 18 ]; do
                  if published_metadata="$(curl --fail --silent \
                    --user-agent "rullst-release/${release_version}" \
                    "https://crates.io/api/v1/crates/${crate}/${release_version}")"; then
                    published_checksum="$(jq -r '.version.checksum // empty' <<< "$published_metadata")"
                    if [ "$published_checksum" != "$expected_checksum" ]; then
                      echo "Checksum mismatch after publishing ${crate} ${release_version}."
                      return 1
                    fi
                    echo "${crate} ${release_version} indexed with the verified checksum."
                    return 0
                  fi

                  index_attempts=$((index_attempts + 1))
                  sleep 10
                done

                echo "Could not verify crates.io indexing for ${crate} ${release_version}."
                return 1
              fi

              sleep $((attempts * 10))
            done

            echo "Failed to publish ${crate} ${release_version}."
            return 1
          }

          while IFS= read -r crate; do
            publish_crate "$crate"
          done < <(jq -r '.[]' .github/release-order.json)

      - name: Create GitHub release from verified artifacts
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            verified-crates/*.crate
            verified-crates/checksums.txt
            verified-crates/evidence-checksums.txt
            verified-crates/release-evidence/*
          fail_on_unmatched_files: true

  provenance:
    # The reusable workflow is the official generic SLSA provenance generator.
    # This produces provenance for the release subjects; it does not by itself
    # certify the whole project or release process at a named SLSA level.
    name: Generate release provenance
    needs: [verify, publish]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.verify.outputs.hashes }}"
      upload-assets: true
