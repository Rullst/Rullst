name: Release to crates.io

# Releases are intentionally tag-only. Every distributable crate is packaged,
# verified, hashed, and attested before the first irreversible upload.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify and attest release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (strict)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify minimal Core and umbrella feature boundaries
        run: |
          cargo check -p rullst-core --all-targets --no-default-features
          cargo check -p rullst --all-targets --no-default-features

      - name: Run all workspace tests
        run: cargo test --workspace --all-features

      - name: Run matrix DB tests (Testcontainers — PostgreSQL and MySQL)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: cargo test -p rullst-orm --test matrix_postgres --test matrix_mysql -- --test-threads=1

      - name: Validate tag and package every publishable crate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the exact vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          release_version="${RELEASE_TAG#v}"
          invalid_versions="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r --arg version "$release_version" '
                .packages[]
                | select(.name != "rullst-blog-example")
                | select(.publish != [])
                | select(.version != $version)
                | "\(.name)=\(.version)"
              '
          )"
          if [ -n "$invalid_versions" ]; then
            echo "The release tag does not match every publishable crate:"
            echo "$invalid_versions"
            exit 1
          fi

          cargo package \
            --workspace \
            --exclude rullst-blog-example \
            --all-features \
            --locked

      - name: Generate release checksums
        id: hash
        run: |
          cd target/package
          sha256sum -- *.crate | sort -k2 > checksums.txt
          echo "hashes=$(base64 -w0 < checksums.txt)" >> "$GITHUB_OUTPUT"

      - name: Generate cryptographic build attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: 'target/package/*.crate'

      - name: Preserve verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-crates
          path: |
            target/package/*.crate
            target/package/checksums.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish verified crates
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-crates
          path: verified-crates

      - name: Verify downloaded artifact checksums
        working-directory: verified-crates
        run: sha256sum --check checksums.txt

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish all workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"

          publish_crate() {
            crate="$1"
            verified_archive="verified-crates/${crate}-${release_version}.crate"
            if [ ! -f "$verified_archive" ]; then
              echo "Missing verified package: ${verified_archive}"
              return 1
            fi
            expected_checksum="$(sha256sum "$verified_archive" | cut -d ' ' -f 1)"
            attempts=0
            while [ "$attempts" -lt 6 ]; do
              if published_metadata="$(curl --fail --silent \
                --user-agent "rullst-release/${release_version}" \
                "https://crates.io/api/v1/crates/${crate}/${release_version}")"; then
                published_checksum="$(jq -r '.version.checksum // empty' <<< "$published_metadata")"
                if [ "$published_checksum" != "$expected_checksum" ]; then
                  echo "Checksum mismatch for existing ${crate} ${release_version}."
                  return 1
                fi
                echo "${crate} ${release_version} is already published; skipping."
                return 0
              fi

              attempts=$((attempts + 1))
              echo "Publishing ${crate} ${release_version} (attempt ${attempts}/6)..."
              if cargo publish -p "$crate" --locked --no-verify; then
                return 0
              fi

              sleep $((attempts * 10))
            done

            echo "Failed to publish ${crate} ${release_version}."
            return 1
          }

          # Foundation crates with no internal dependencies.
          publish_crate rullst-macros
          publish_crate rullst-orm-macros
          publish_crate rullst-connect
          publish_crate rullst-iot

          # The actual dependency DAG is ORM -> Core, not Core -> ORM.
          publish_crate rullst-orm
          publish_crate rullst-core

          # Domain crates built on Core.
          publish_crate rullst-security
          publish_crate rullst-ai
          publish_crate rullst-capital
          publish_crate rullst-mail
          publish_crate rullst-auth

          # Developer interfaces and final distribution crates.
          publish_crate rullst-nexus
          publish_crate rullst-studio
          publish_crate rullst
          publish_crate cargo-rullst

      - name: Create GitHub release from verified artifacts
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: verified-crates/*
          fail_on_unmatched_files: true

  provenance:
    name: Generate SLSA 3 provenance
    needs: [verify, publish]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.verify.outputs.hashes }}"
      upload-assets: true
