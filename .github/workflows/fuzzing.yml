name: Fuzzing (cargo-fuzz)

on:
  workflow_dispatch: # STRICTLY MANUAL TRIGGER ONLY
    inputs:
      mode:
        description: Full coverage with verified reuse, or a short single-target diagnostic
        required: true
        default: release
        type: choice
        options:
          - release
          - diagnostic
      target:
        description: Exact target name (required only for diagnostic mode)
        required: false
        type: string
      force_full:
        description: Execute every release target even when equivalent evidence exists
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: rullst-fuzz-v1
  SCCACHE_GHA_RW_MODE: READ_WRITE
  # taiki-e/install-action distributes a statically linked cargo-fuzz binary.
  # cargo-fuzz derives its implicit target from the binary that built it, so
  # leaving this implicit can select musl and make ASan reject crt-static.
  FUZZ_BUILD_TARGET: x86_64-unknown-linux-gnu

jobs:
  targets:
    name: Validate fuzz target inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      directories: ${{ steps.matrix.outputs.directories }}
      campaign_seconds: ${{ steps.matrix.outputs.campaign_seconds }}
      mode: ${{ steps.matrix.outputs.mode }}
      target_count: ${{ steps.matrix.outputs.target_count }}
      selected_count: ${{ steps.matrix.outputs.selected_count }}
      reused_count: ${{ steps.matrix.outputs.reused_count }}
      evidence: ${{ steps.matrix.outputs.evidence }}
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test fuzz evidence policy
        run: |
          python3 .github/test-fuzz-evidence-inputs.py
          python3 .github/test-fuzz-evidence.py

      - name: Validate and export matrix
        id: matrix
        shell: bash
        env:
          CAMPAIGN_MODE: ${{ inputs.mode }}
          REQUESTED_TARGET: ${{ inputs.target }}
          FORCE_FULL: ${{ inputs.force_full }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/validate-fuzz-targets.py

          reused_count=0
          evidence='{}'
          case "$CAMPAIGN_MODE" in
            release)
              if [ -n "$REQUESTED_TARGET" ]; then
                echo "Release mode always covers the complete inventory; leave target empty." >&2
                exit 2
              fi
              args=()
              if [ "$FORCE_FULL" = "true" ]; then
                args+=(--force-full)
              fi
              python3 .github/fuzz_evidence.py "${args[@]}" --output "$RUNNER_TEMP/fuzz-plan.json"
              selected="$(jq -c '.selected' "$RUNNER_TEMP/fuzz-plan.json")"
              reused_count="$(jq '.reused | length' "$RUNNER_TEMP/fuzz-plan.json")"
              evidence="$(jq -c '.' "$RUNNER_TEMP/fuzz-plan.json")"
              campaign_seconds=19800
              ;;
            diagnostic)
              if [ -z "$REQUESTED_TARGET" ]; then
                echo "Diagnostic mode requires one exact target name." >&2
                exit 2
              fi
              selected="$(jq -c --arg target "$REQUESTED_TARGET" \
                '[.[] | select(.target == $target)]' .github/fuzz-targets.json)"
              if [ "$(jq 'length' <<<"$selected")" -ne 1 ]; then
                echo "Unknown or ambiguous fuzz target: $REQUESTED_TARGET" >&2
                exit 2
              fi
              campaign_seconds=300
              ;;
            *)
              echo "Unsupported fuzz campaign mode: $CAMPAIGN_MODE" >&2
              exit 2
              ;;
          esac

          matrix="$(jq -c '{include: .}' <<<"$selected")"
          directories="$(jq -c '{include: (map({dir}) | unique_by(.dir))}' <<<"$selected")"
          {
            echo "matrix=$matrix"
            echo "directories=$directories"
            echo "campaign_seconds=$campaign_seconds"
            echo "mode=$CAMPAIGN_MODE"
            selected_count="$(jq 'length' <<<"$selected")"
            echo "selected_count=$selected_count"
            echo "reused_count=$reused_count"
            echo "target_count=$((selected_count + reused_count))"
            echo "evidence=$evidence"
          } >> "$GITHUB_OUTPUT"

  preflight:
    if: needs.targets.outputs.selected_count != '0'
    name: Compile fuzz package ${{ matrix.dir }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.directories) }}
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # nightly
        with:
          toolchain: nightly-2026-08-21

      - name: Install cargo-fuzz 0.13.2
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-fuzz@0.13.2

      - name: Verify pinned fuzz dependency graph
        working-directory: ${{ matrix.dir }}
        run: cargo +nightly-2026-08-21 metadata --locked --format-version 1 --filter-platform "$FUZZ_BUILD_TARGET" > /dev/null

      - name: Compile the campaign's selected targets
        working-directory: ${{ matrix.dir }}
        shell: bash
        env:
          CAMPAIGN_MODE: ${{ needs.targets.outputs.mode }}
          REQUESTED_TARGET: ${{ inputs.target }}
          FUZZ_DIRECTORY: ${{ matrix.dir }}
        run: |
          inventory="$GITHUB_WORKSPACE/.github/fuzz-targets.json"
          jq -e --arg dir "$FUZZ_DIRECTORY" \
            'any(.[]; .dir == $dir)' "$inventory" > /dev/null
          build_targets=()
          case "$CAMPAIGN_MODE" in
            release)
              if [ -n "$REQUESTED_TARGET" ]; then
                echo "Release preflight must compile every target; leave target empty." >&2
                exit 2
              fi
              ;;
            diagnostic)
              # Inventory was validated before this matrix. Check the exact
              # unique target/package again; never allow a flag or another
              # package's target to change the compiler invocation.
              if [[ ! "$REQUESTED_TARGET" =~ ^[a-zA-Z0-9_]+$ ]]; then
                echo "Diagnostic preflight requires one safe exact target." >&2
                exit 2
              fi
              jq -e --arg dir "$FUZZ_DIRECTORY" --arg target "$REQUESTED_TARGET" \
                '[.[] | select(.target == $target)] | length == 1 and .[0].dir == $dir' \
                "$inventory" > /dev/null
              build_targets+=("$REQUESTED_TARGET")
              ;;
            *)
              echo "Unsupported fuzz preflight mode: $CAMPAIGN_MODE" >&2
              exit 2
              ;;
          esac
          cargo +nightly-2026-08-21 fuzz build \
            --target "$FUZZ_BUILD_TARGET" "${build_targets[@]}"

      - name: Reject fuzz dependency lock drift after preflight
        working-directory: ${{ matrix.dir }}
        run: git diff --exit-code -- Cargo.lock

  fuzz:
    if: needs.targets.outputs.selected_count != '0'
    name: Fuzz ${{ matrix.target }}
    needs: [targets, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # nightly
        with:
          toolchain: nightly-2026-08-21

      - name: Install cargo-fuzz 0.13.2
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-fuzz@0.13.2

      - name: Restore target corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.dir }}/corpus/${{ matrix.target }}
          key: fuzz-corpus-v1-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-v1-${{ matrix.target }}-${{ github.sha }}-
            fuzz-corpus-v1-${{ matrix.target }}-

      - name: Verify pinned fuzz dependency graph
        working-directory: ${{ matrix.dir }}
        run: cargo +nightly-2026-08-21 metadata --locked --format-version 1 --filter-platform "$FUZZ_BUILD_TARGET" > /dev/null

      - name: Run bounded target campaign
        working-directory: ${{ matrix.dir }}
        shell: bash
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          CAMPAIGN_SECONDS: ${{ needs.targets.outputs.campaign_seconds }}
        run: |
          if [ "$FUZZ_TARGET" = "fuzz_parser" ]; then
            # proc-macro2/syn parsing performs sustained allocation churn under
            # ASan. Restart only the fuzzer process every 30 minutes so its RSS
            # does not accumulate for the full campaign. Every batch reuses the
            # same on-disk corpus, so this preserves the 5.5-hour budget and
            # coverage discoveries without tolerating crashes or OOMs.
            remaining="$CAMPAIGN_SECONDS"
            batch=1
            while [ "$remaining" -gt 0 ]; do
              batch_seconds=1800
              if [ "$remaining" -lt "$batch_seconds" ]; then
                batch_seconds="$remaining"
              fi
              echo "Parser fuzz batch $batch (${batch_seconds}s)"
              cargo +nightly-2026-08-21 fuzz run \
                --target "$FUZZ_BUILD_TARGET" "$FUZZ_TARGET" -- \
                -max_total_time="$batch_seconds" \
                -max_len=2048 \
                -timeout=10 \
                -rss_limit_mb=2048
              remaining=$((remaining - batch_seconds))
              batch=$((batch + 1))
            done
          else
            args=()
            if [[ "$FUZZ_TARGET" == fuzz_age_* ]]; then
              args+=(-max_len=9000 -timeout=10 -rss_limit_mb=2048)
            fi
            cargo +nightly-2026-08-21 fuzz run \
              --target "$FUZZ_BUILD_TARGET" "$FUZZ_TARGET" -- \
              -max_total_time="$CAMPAIGN_SECONDS" "${args[@]}"
          fi

      - name: Reject fuzz dependency lock drift
        if: always()
        working-directory: ${{ matrix.dir }}
        run: git diff --exit-code -- Cargo.lock

      - name: Upload reproducer on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-reproducer-${{ matrix.target }}
          path: ${{ matrix.dir }}/artifacts/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 30

  evidence-boundary:
    name: Fuzz campaign evidence boundary
    if: always()
    needs: [targets, preflight, fuzz]
    runs-on: ubuntu-latest
    steps:
      - name: Record strict result and release eligibility
        env:
          CAMPAIGN_MODE: ${{ needs.targets.outputs.mode }}
          TARGET_COUNT: ${{ needs.targets.outputs.target_count }}
          SELECTED_COUNT: ${{ needs.targets.outputs.selected_count }}
          REUSED_COUNT: ${{ needs.targets.outputs.reused_count }}
          TARGETS_RESULT: ${{ needs.targets.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          {
            echo "## Fuzz campaign"
            echo
            echo "Mode: \`$CAMPAIGN_MODE\`; targets: \`$TARGET_COUNT\`."
            echo "Compile preflight: \`$PREFLIGHT_RESULT\`; campaign: \`$FUZZ_RESULT\`."
            echo
            if [ "$CAMPAIGN_MODE" = "release" ]; then
              echo "All 42 targets require a new successful campaign or independently verified equivalent evidence."
            else
              echo "This short single-target diagnostic is strict, but is not release evidence."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TARGETS_RESULT" != "success" ]; then
            exit 1
          fi
          expected=success
          if [ "$SELECTED_COUNT" -eq 0 ]; then
            expected=skipped
          fi
          if [ "$PREFLIGHT_RESULT" != "$expected" ] || [ "$FUZZ_RESULT" != "$expected" ]; then
            exit 1
          fi
          if [ "$((SELECTED_COUNT + REUSED_COUNT))" -ne "$TARGET_COUNT" ]; then
            exit 1
          fi
          if [ "$CAMPAIGN_MODE" = "release" ] && [ "$TARGET_COUNT" -ne 42 ]; then
            echo "Release fuzz evidence must cover exactly 42 validated targets." >&2
            exit 1
          fi

      - name: Retain source evidence and execution receipt
        if: success() && needs.targets.outputs.mode == 'release'
        env:
          EVIDENCE_PLAN: ${{ needs.targets.outputs.evidence }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          report = json.loads(os.environ["EVIDENCE_PLAN"])
          if report["candidate_sha"] != os.environ["GITHUB_SHA"] or report["total_targets"] != 42:
              raise SystemExit("Fuzz evidence plan does not match this candidate")
          report["execution_run_id"] = int(os.environ["GITHUB_RUN_ID"])
          report["execution_run_attempt"] = int(os.environ["GITHUB_RUN_ATTEMPT"])
          pathlib.Path("fuzz-evidence.json").write_text(json.dumps(report, indent=2) + "\n")
          PYTHON

      - name: Upload fuzz evidence receipt
        if: success() && needs.targets.outputs.mode == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: fuzz-evidence.json
          if-no-files-found: error
          retention-days: 30
