name: Fuzzing (cargo-fuzz)

on:
  workflow_dispatch: # STRICTLY MANUAL TRIGGER ONLY

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rullst Core
          - dir: rullst/fuzz
            target: mask_pii
          - dir: rullst/fuzz
            target: html_escape
          - dir: rullst/fuzz
            target: routing
          - dir: rullst/fuzz
            target: validation_json
          - dir: rullst/fuzz
            target: auth_crypto
          - dir: rullst/fuzz
            target: auth_session
          - dir: rullst/fuzz
            target: security_csrf
          - dir: rullst/fuzz
            target: security_waf
          - dir: rullst/fuzz
            target: htmx_headers
          - dir: rullst/fuzz
            target: config_parser
          - dir: rullst/fuzz
            target: multitenant_resolver
          - dir: rullst/fuzz
            target: ws_payload
          # Rullst ORM
          - dir: rullst-orm/fuzz
            target: fuzz_audit
          - dir: rullst-orm/fuzz
            target: fuzz_builder
          - dir: rullst-orm/fuzz
            target: fuzz_parser
          - dir: rullst-orm/fuzz
            target: fuzz_schema
          - dir: rullst-orm/fuzz
            target: fuzz_scout
          # Rullst Connect
          - dir: rullst-connect/fuzz
            target: default_target
          - dir: rullst-connect/fuzz
            target: fuzz_token_response
          - dir: rullst-connect/fuzz
            target: fuzz_user_json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run Fuzzer for ~6 hours (${{ matrix.target }})
        working-directory: ${{ matrix.dir }}
        # We run the fuzzer for a maximum of 21000 seconds (5 hours 50 minutes)
        # to ensure it completes before the 6h GitHub Actions hard limit.
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=21000
