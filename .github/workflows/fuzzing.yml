name: Fuzzing (cargo-fuzz)

on:
  workflow_dispatch: # STRICTLY MANUAL TRIGGER ONLY

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  targets:
    name: Validate fuzz target inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and export matrix
        id: matrix
        shell: bash
        run: |
          python3 .github/validate-fuzz-targets.py
          matrix="$(jq -c '{include: .}' .github/fuzz-targets.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # nightly
        with:
          toolchain: nightly

      - name: Install cargo-fuzz 0.13.2
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Restore target corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.dir }}/corpus/${{ matrix.target }}
          key: fuzz-corpus-v1-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-v1-${{ matrix.target }}-${{ github.sha }}-
            fuzz-corpus-v1-${{ matrix.target }}-

      - name: Run target for approximately 5.5 hours
        working-directory: ${{ matrix.dir }}
        shell: bash
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          args=(-max_total_time=19800)
          if [ "$FUZZ_TARGET" = "fuzz_parser" ]; then
            # The parser contract rejects inputs above 2 KiB. Keep generation at
            # that boundary and leave headroom for libFuzzer's cumulative RSS.
            args+=(-max_len=2048 -rss_limit_mb=4096)
          fi
          cargo +nightly fuzz run "$FUZZ_TARGET" -- "${args[@]}"

      - name: Upload reproducer on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-reproducer-${{ matrix.target }}
          path: ${{ matrix.dir }}/artifacts/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 30
