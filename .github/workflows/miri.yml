name: Miri UB Detection

on:
  workflow_dispatch: # STRICTLY MANUAL TRIGGER ONLY

permissions:
  contents: read

env:
  # Removed FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 to avoid warnings
  # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  miri:
    name: Miri Check (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Miri can run indefinitely on heavy async crates; cap each job
    strategy:
      fail-fast: false
      matrix:
        package: ['rullst', 'rullst-macros', 'cargo-rullst', 'rullst-orm-macros', 'rullst-auth', 'rullst-core', 'rullst-ai', 'rullst-capital']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      
      - name: Install Rust Nightly with Miri
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # nightly
        with:
          toolchain: nightly
          components: miri

      - name: Run Miri (No Isolation)
        working-directory: ${{ matrix.package }}
        continue-on-error: true
        env:
          RUSTFLAGS: "-Zrandomize-layout"
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: cargo +nightly miri test
