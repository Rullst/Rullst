name: Miri UB Detection (manual informational)

on:
  workflow_dispatch: # STRICTLY MANUAL TRIGGER ONLY

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  miri:
    name: Miri informational (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Miri can run indefinitely on heavy async crates; cap each job
    strategy:
      fail-fast: false
      matrix:
        package: ['rullst', 'rullst-macros', 'cargo-rullst', 'rullst-orm-macros', 'rullst-auth', 'rullst-core', 'rullst-ai', 'rullst-capital', 'rullst-security', 'rullst-iot', 'rullst-nexus', 'rullst-studio', 'rullst-mail']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install Rust Nightly with Miri
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # nightly
        with:
          toolchain: nightly
          components: miri

      - name: Run Miri (non-blocking, no isolation)
        working-directory: ${{ matrix.package }}
        continue-on-error: true
        env:
          RUSTFLAGS: "-Zrandomize-layout"
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: cargo +nightly miri test
