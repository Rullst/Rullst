name: Miri UB Detection

on:
  workflow_dispatch: # STRICTLY MANUAL TRIGGER ONLY

permissions:
  contents: read

jobs:
  miri:
    name: Miri Check (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ['rullst', 'rullst-macros', 'cargo-rullst', 'rullst-orm', 'rullst-orm-macros', 'rullst-connect', 'rullst-auth', 'rullst-mail', 'rullst-core', 'rullst-ai', 'rullst-capital']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      
      - name: Install Rust Nightly with Miri
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # nightly
        with:
          toolchain: nightly
          components: miri

      - name: Run Miri (No Isolation)
        working-directory: ${{ matrix.package }}
        continue-on-error: true
        run: cargo +nightly miri test -Z randomize-layout -- -Zmiri-disable-isolation
