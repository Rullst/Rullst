name: OWASP ZAP (Dynamic Application Security Testing)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_KEY: 0123456789abcdef0123456789abcdef
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXUS_ADMIN_PASSWORD: Dast-Only-Password-2026
  NEXUS_ADMIN_USERNAME: dast_admin
  RULLST_ENV: production
  ZAP_DOCKER_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef

jobs:
  zap_scan:
    name: ZAP representative release surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: 1.99.1

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-zap-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-zap-

      - name: Configure blog showcase database
        working-directory: examples/blog
        run: |
          touch blog.db

      - name: Build scanner targets and CLI
        timeout-minutes: 80
        run: |
          cargo fetch --locked
          cargo build --release --locked \
            -p cargo-rullst --bin cargo-rullst
          cargo build --release --locked \
            -p rullst-blog-example --bin rullst-blog-example
          cargo build --release --locked \
            -p rullst-lms-example --bin rullst-lms-example
          test -x target/release/cargo-rullst
          test -x target/release/rullst-blog-example
          test -x target/release/rullst-lms-example

      - name: Materialize the generated API, the SaaS starter and the LMS example
        run: |
          dast_root="$RUNNER_TEMP/rullst-zap"
          printf 'DAST_ROOT=%s\n' "$dast_root" >> "$GITHUB_ENV"
          mkdir -p "$dast_root"

          ./target/release/cargo-rullst new "$dast_root/zap-blank-api" \
            --default \
            --blueprint blank \
            --database sqlite \
            --api \
            --skip-initial-migration
          ./target/release/cargo-rullst new "$dast_root/zap-saas" \
            --default \
            --blueprint saas \
            --skip-initial-migration
          # The LMS starter moved to examples/lms in 13.0.0-alpha.4: scan the
          # workspace build from a scratch copy of its directory (static/,
          # Rullst.toml and a .env whose APP_KEY comes from the job).
          cp -R examples/lms "$dast_root/zap-lms-app"
          grep -v '^APP_KEY=' examples/lms/.env.example > "$dast_root/zap-lms-app/.env"

          # The generated manifests name the framework crates as a published
          # CLI does; this checkout's crates replace them through
          # [patch.crates-io], so the build works before publication.
          for project in zap-blank-api zap-saas; do
            cp Cargo.lock "$dast_root/$project/Cargo.lock"
            python3 .github/dast-generated-app.py registry-patch "$dast_root/$project"
          done

      - name: Build the generated applications in release mode
        timeout-minutes: 100
        run: |
          for project in zap-blank-api zap-saas; do
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build \
              --release \
              --offline \
              --manifest-path "$DAST_ROOT/$project/Cargo.toml"
          done

      - name: Apply application migrations
        run: |
          (
            cd "$DAST_ROOT/zap-blank-api"
            "$GITHUB_WORKSPACE/target/release/zap-blank-api" db:migrate
          )
          (
            cd "$DAST_ROOT/zap-saas"
            "$GITHUB_WORKSPACE/target/release/zap-saas" db:migrate
          )
          (
            cd "$DAST_ROOT/zap-lms-app"
            "$GITHUB_WORKSPACE/target/release/rullst-lms-example" db:migrate
          )

      - name: Start blog showcase
        run: |
          log_path="$RUNNER_TEMP/zap-blog.log"
          pid_path="$RUNNER_TEMP/zap-blog.pid"
          (
            cd examples/blog
            exec ../../target/release/rullst-blog-example
          ) > "$log_path" 2>&1 &
          server_pid=$!
          printf '%s\n' "$server_pid" > "$pid_path"

          ready=false
          for _ in {1..30}; do
            if curl --user-agent 'Mozilla/5.0 (Rullst DAST readiness)' \
              --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            tail -200 "$log_path"
            exit 1
          fi

      - name: Scan blog showcase (informational boundary)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        timeout-minutes: 45
        with:
          target: http://127.0.0.1:3000
          docker_name: ${{ env.ZAP_DOCKER_IMAGE }}
          # action-baseline v0.15 only forwards rules_file_name when the file
          # contains IGNORE. These files deliberately demote explained findings
          # to INFO, so pass the config explicitly and keep all other WARNs live.
          cmd_options: -a -m 2 -c .zap/blog-showcase.tsv
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-blog-showcase

      - name: Stop blog showcase
        if: always()
        run: |
          pid_path="$RUNNER_TEMP/zap-blog.pid"
          if [[ -f "$pid_path" ]]; then
            server_pid=$(< "$pid_path")
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid"
              wait "$server_pid" || true
            fi
          fi

      - name: Start generated REST API
        run: |
          log_path="$RUNNER_TEMP/zap-blank-api.log"
          pid_path="$RUNNER_TEMP/zap-blank-api.pid"
          (
            cd "$DAST_ROOT/zap-blank-api"
            exec "$GITHUB_WORKSPACE/target/release/zap-blank-api"
          ) > "$log_path" 2>&1 &
          server_pid=$!
          printf '%s\n' "$server_pid" > "$pid_path"

          ready=false
          for _ in {1..30}; do
            if curl --user-agent 'Mozilla/5.0 (Rullst DAST readiness)' \
              --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            tail -200 "$log_path"
            exit 1
          fi

      - name: Scan generated REST API (blocking)
        id: zap_api
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        timeout-minutes: 45
        with:
          target: http://127.0.0.1:3000
          docker_name: ${{ env.ZAP_DOCKER_IMAGE }}
          cmd_options: -a -m 1 -c .zap/generated-apps.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-generated-rest-api

      - name: Stop generated REST API
        if: always()
        run: |
          pid_path="$RUNNER_TEMP/zap-blank-api.pid"
          if [[ -f "$pid_path" ]]; then
            server_pid=$(< "$pid_path")
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid"
              wait "$server_pid" || true
            fi
          fi

      - name: Start LMS example
        run: |
          log_path="$RUNNER_TEMP/zap-lms.log"
          pid_path="$RUNNER_TEMP/zap-lms.pid"
          (
            cd "$DAST_ROOT/zap-lms-app"
            exec "$GITHUB_WORKSPACE/target/release/rullst-lms-example"
          ) > "$log_path" 2>&1 &
          server_pid=$!
          printf '%s\n' "$server_pid" > "$pid_path"

          ready=false
          for _ in {1..30}; do
            if curl --user-agent 'Mozilla/5.0 (Rullst DAST readiness)' \
              --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            tail -200 "$log_path"
            exit 1
          fi

      - name: Scan LMS example public surface (blocking)
        id: zap_lms
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        timeout-minutes: 60
        with:
          target: http://127.0.0.1:3000
          docker_name: ${{ env.ZAP_DOCKER_IMAGE }}
          cmd_options: -a -j -m 3 -c .zap/lms-example.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-lms-example

      - name: Stop LMS example
        if: always()
        run: |
          pid_path="$RUNNER_TEMP/zap-lms.pid"
          if [[ -f "$pid_path" ]]; then
            server_pid=$(< "$pid_path")
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid"
              wait "$server_pid" || true
            fi
          fi

      - name: Start generated SaaS starter
        run: |
          log_path="$RUNNER_TEMP/zap-saas.log"
          pid_path="$RUNNER_TEMP/zap-saas.pid"
          # Production refuses mock billing: a placeholder Stripe test key, a
          # strong webhook secret, an HTTPS redirect and an explicit plan
          # allowlist, as in docs/src/vm-deployment.md. The scan never reaches
          # a checkout (it needs a signed-in POST), so Stripe is not contacted.
          (
            cd "$DAST_ROOT/zap-saas"
            export BILLING_API_KEY="sk_test_rullst_dast_$(openssl rand -hex 8)"
            export BILLING_WEBHOOK_SECRET="whsec_$(openssl rand -hex 24)"
            export BILLING_REDIRECT_URL=https://localhost/dashboard
            export BILLING_ALLOWED_PLAN_IDS=price_starter,price_pro
            export RULLST_PUBLIC_ORIGIN=https://localhost
            exec "$GITHUB_WORKSPACE/target/release/zap-saas"
          ) > "$log_path" 2>&1 &
          server_pid=$!
          printf '%s\n' "$server_pid" > "$pid_path"

          ready=false
          for _ in {1..30}; do
            if curl --user-agent 'Mozilla/5.0 (Rullst DAST readiness)' \
              --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            tail -200 "$log_path"
            exit 1
          fi

      - name: Register a disposable SaaS account for the signed-in scan
        # Before the public scan: its form submissions spend the per-client
        # credential budget that registration also uses.
        run: python3 .github/dast-generated-app.py session http://127.0.0.1:3000

      - name: Scan SaaS starter public pages (blocking)
        id: zap_saas_public
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        timeout-minutes: 45
        with:
          target: http://127.0.0.1:3000
          docker_name: ${{ env.ZAP_DOCKER_IMAGE }}
          cmd_options: -a -m 2 -c .zap/saas-starter.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-saas-public

      - name: Scan SaaS starter signed-in pages (blocking)
        id: zap_saas_account
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        timeout-minutes: 45
        env:
          # The action passes these to ZAP, which sets the session cookie on
          # every request to the starter. The rules file puts the POST-only
          # sign-out and billing commands out of scope, so the spider cannot
          # revoke the session or start a checkout.
          ZAP_AUTH_HEADER: Cookie
          ZAP_AUTH_HEADER_VALUE: ${{ env.SAAS_ZAP_COOKIE }}
          ZAP_AUTH_HEADER_SITE: 127.0.0.1
        with:
          target: http://127.0.0.1:3000/dashboard
          docker_name: ${{ env.ZAP_DOCKER_IMAGE }}
          cmd_options: -a -m 2 -c .zap/saas-starter-account.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-saas-account

      - name: Confirm the signed-in scan kept its session
        id: saas_session
        continue-on-error: true
        run: python3 .github/dast-generated-app.py check-session http://127.0.0.1:3000

      - name: Stop SaaS starter
        if: always()
        run: |
          pid_path="$RUNNER_TEMP/zap-saas.pid"
          if [[ -f "$pid_path" ]]; then
            server_pid=$(< "$pid_path")
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid"
              wait "$server_pid" || true
            fi
          fi

      - name: Upload application logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-application-logs
          path: ${{ runner.temp }}/zap-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce blocking application DAST gates
        if: always() && !cancelled()
        env:
          REST_API_OUTCOME: ${{ steps.zap_api.outcome }}
          LMS_OUTCOME: ${{ steps.zap_lms.outcome }}
          SAAS_PUBLIC_OUTCOME: ${{ steps.zap_saas_public.outcome }}
          SAAS_ACCOUNT_OUTCOME: ${{ steps.zap_saas_account.outcome }}
          SAAS_SESSION_OUTCOME: ${{ steps.saas_session.outcome }}
        run: |
          failed=false
          if [[ "$REST_API_OUTCOME" != success ]]; then
            echo "Generated REST API ZAP gate: $REST_API_OUTCOME"
            failed=true
          fi
          if [[ "$LMS_OUTCOME" != success ]]; then
            echo "LMS example ZAP gate: $LMS_OUTCOME"
            failed=true
          fi
          if [[ "$SAAS_PUBLIC_OUTCOME" != success ]]; then
            echo "SaaS starter public ZAP gate: $SAAS_PUBLIC_OUTCOME"
            failed=true
          fi
          if [[ "$SAAS_ACCOUNT_OUTCOME" != success || "$SAAS_SESSION_OUTCOME" != success ]]; then
            echo "SaaS starter signed-in ZAP gate: $SAAS_ACCOUNT_OUTCOME (session kept: $SAAS_SESSION_OUTCOME)"
            failed=true
          fi
          if [[ "$failed" == true ]]; then
            exit 1
          fi
