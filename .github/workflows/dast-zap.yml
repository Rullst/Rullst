name: OWASP ZAP (Dynamic Application Security Testing)

on:
  workflow_dispatch:

permissions: read-all

jobs:
  zap_scan:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Hard cap: build(60) + server start(5) + ZAP scan(60) = ~125min max
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-zap-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-zap-

      - name: Configure environment for Blog Example
        working-directory: examples/blog
        run: |
          echo "APP_KEY=12345678901234567890123456789012" >> .env
          echo "APP_ENV=production" >> .env
          echo "DATABASE_URL=sqlite://db.sqlite3" >> .env

      - name: Build Rullst Server (Blog Example)
        timeout-minutes: 60
        run: cargo build --release -p rullst-blog-example

      - name: Run Rullst Server in background
        working-directory: examples/blog
        run: |
          # Run the pre-compiled release binary directly (no recompilation)
          ../../target/release/rullst-blog-example &
          # Wait for the server to be ready on port 3000
          sleep 3
          curl -s --retry 15 --retry-connrefused --retry-delay 2 http://localhost:3000 > /dev/null
          echo "Server is up at http://localhost:3000"

      - name: Generate ZAP Rules to Ignore CDN False Positives
        run: |
          mkdir -p .zap
          # 10055 = CSP unsafe-inline / unsafe-eval (required for Tailwind/HTMX CDNs)
          # 90003 = Sub Resource Integrity Attribute Missing (dynamic CDN versions)
          # 10017 = Cross-Domain JavaScript (CDN scripts)
          # 10109 = Modern Web Application (Informational)
          # 90004 = Cross-Origin-Embedder-Policy (Handled by production middleware)
          # 10049 = Storable and Cacheable Content (Handled by production middleware)
          echo -e "10055\tIGNORE\t(CSP)\n90003\tIGNORE\t(SRI)\n10017\tIGNORE\t(Cross-Domain)\n10109\tIGNORE\t(Modern Web App)\n90004\tIGNORE\t(COEP/CORP)\n10049\tIGNORE\t(Cache-Control)" > .zap/rules.tsv

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        timeout-minutes: 60
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false # Only warn for now, avoid breaking CI on first run

