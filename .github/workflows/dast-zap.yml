name: OWASP ZAP (Dynamic Application Security Testing)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_KEY: 0123456789abcdef0123456789abcdef
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXUS_ADMIN_PASSWORD: Dast-Only-Password-2026
  NEXUS_ADMIN_USERNAME: dast_admin
  RULLST_ENV: production
  ZAP_DOCKER_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef

jobs:
  zap_scan:
    name: ZAP representative release surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-zap-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-zap-

      - name: Configure blog showcase database
        working-directory: examples/blog
        run: |
          touch blog.db

      - name: Build scanner targets and CLI
        timeout-minutes: 80
        run: |
          cargo fetch --locked
          cargo build --release --locked \
            -p cargo-rullst --bin cargo-rullst
          cargo build --release --locked \
            -p rullst-blog-example --bin rullst-blog-example
          test -x target/release/cargo-rullst
          test -x target/release/rullst-blog-example

      - name: Materialize representative generated applications
        run: |
          dast_root="$RUNNER_TEMP/rullst-zap"
          printf 'DAST_ROOT=%s\n' "$dast_root" >> "$GITHUB_ENV"
          mkdir -p "$dast_root"

          ./target/release/cargo-rullst new "$dast_root/zap-blank-api" \
            --default \
            --blueprint blank \
            --database sqlite \
            --api \
            --skip-initial-migration
          ./target/release/cargo-rullst new "$dast_root/zap-lms-app" \
            --default \
            --blueprint lms \
            --database sqlite \
            --skip-initial-migration

          cp Cargo.lock "$dast_root/zap-blank-api/Cargo.lock"
          cp Cargo.lock "$dast_root/zap-lms-app/Cargo.lock"

      - name: Build generated applications in release mode
        timeout-minutes: 100
        run: |
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build \
            --release \
            --offline \
            --manifest-path "$DAST_ROOT/zap-blank-api/Cargo.toml"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build \
            --release \
            --offline \
            --manifest-path "$DAST_ROOT/zap-lms-app/Cargo.toml"

      - name: Apply generated application migrations
        run: |
          (
            cd "$DAST_ROOT/zap-blank-api"
            "$GITHUB_WORKSPACE/target/release/zap-blank-api" db:migrate
          )
          (
            cd "$DAST_ROOT/zap-lms-app"
            "$GITHUB_WORKSPACE/target/release/zap-lms-app" db:migrate
          )

      - name: Start blog showcase
        run: |
          log_path="$RUNNER_TEMP/zap-blog.log"
          pid_path="$RUNNER_TEMP/zap-blog.pid"
          (
            cd examples/blog
            exec ../../target/release/rullst-blog-example
          ) > "$log_path" 2>&1 &
          server_pid=$!
          printf '%s\n' "$server_pid" > "$pid_path"

          ready=false
          for _ in {1..30}; do
            if curl --user-agent 'Mozilla/5.0 (Rullst DAST readiness)' \
              --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            tail -200 "$log_path"
            exit 1
          fi

      - name: Scan blog showcase (informational boundary)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        timeout-minutes: 45
        with:
          target: http://127.0.0.1:3000
          docker_name: ${{ env.ZAP_DOCKER_IMAGE }}
          # action-baseline v0.15 only forwards rules_file_name when the file
          # contains IGNORE. These files deliberately demote explained findings
          # to INFO, so pass the config explicitly and keep all other WARNs live.
          cmd_options: -a -m 2 -c .zap/blog-showcase.tsv
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-blog-showcase

      - name: Stop blog showcase
        if: always()
        run: |
          pid_path="$RUNNER_TEMP/zap-blog.pid"
          if [[ -f "$pid_path" ]]; then
            server_pid=$(< "$pid_path")
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid"
              wait "$server_pid" || true
            fi
          fi

      - name: Start generated REST API
        run: |
          log_path="$RUNNER_TEMP/zap-blank-api.log"
          pid_path="$RUNNER_TEMP/zap-blank-api.pid"
          (
            cd "$DAST_ROOT/zap-blank-api"
            exec "$GITHUB_WORKSPACE/target/release/zap-blank-api"
          ) > "$log_path" 2>&1 &
          server_pid=$!
          printf '%s\n' "$server_pid" > "$pid_path"

          ready=false
          for _ in {1..30}; do
            if curl --user-agent 'Mozilla/5.0 (Rullst DAST readiness)' \
              --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            tail -200 "$log_path"
            exit 1
          fi

      - name: Scan generated REST API (blocking)
        id: zap_api
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        timeout-minutes: 45
        with:
          target: http://127.0.0.1:3000
          docker_name: ${{ env.ZAP_DOCKER_IMAGE }}
          cmd_options: -a -m 1 -c .zap/generated-apps.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-generated-rest-api

      - name: Stop generated REST API
        if: always()
        run: |
          pid_path="$RUNNER_TEMP/zap-blank-api.pid"
          if [[ -f "$pid_path" ]]; then
            server_pid=$(< "$pid_path")
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid"
              wait "$server_pid" || true
            fi
          fi

      - name: Start generated LMS
        run: |
          log_path="$RUNNER_TEMP/zap-lms.log"
          pid_path="$RUNNER_TEMP/zap-lms.pid"
          (
            cd "$DAST_ROOT/zap-lms-app"
            exec "$GITHUB_WORKSPACE/target/release/zap-lms-app"
          ) > "$log_path" 2>&1 &
          server_pid=$!
          printf '%s\n' "$server_pid" > "$pid_path"

          ready=false
          for _ in {1..30}; do
            if curl --user-agent 'Mozilla/5.0 (Rullst DAST readiness)' \
              --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            tail -200 "$log_path"
            exit 1
          fi

      - name: Scan generated LMS public surface (blocking)
        id: zap_lms
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        timeout-minutes: 60
        with:
          target: http://127.0.0.1:3000
          docker_name: ${{ env.ZAP_DOCKER_IMAGE }}
          cmd_options: -a -j -m 3 -c .zap/generated-lms.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-generated-lms

      - name: Stop generated LMS
        if: always()
        run: |
          pid_path="$RUNNER_TEMP/zap-lms.pid"
          if [[ -f "$pid_path" ]]; then
            server_pid=$(< "$pid_path")
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid"
              wait "$server_pid" || true
            fi
          fi

      - name: Upload application logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-application-logs
          path: ${{ runner.temp }}/zap-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce generated application DAST gates
        if: always() && !cancelled()
        env:
          REST_API_OUTCOME: ${{ steps.zap_api.outcome }}
          LMS_OUTCOME: ${{ steps.zap_lms.outcome }}
        run: |
          failed=false
          if [[ "$REST_API_OUTCOME" != success ]]; then
            echo "Generated REST API ZAP gate: $REST_API_OUTCOME"
            failed=true
          fi
          if [[ "$LMS_OUTCOME" != success ]]; then
            echo "Generated LMS ZAP gate: $LMS_OUTCOME"
            failed=true
          fi
          if [[ "$failed" == true ]]; then
            exit 1
          fi
