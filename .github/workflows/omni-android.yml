name: Omni Android Compile

on:
  push:
    branches: [main]
    paths:
      - "cargo-rullst/src/cli.rs"
      - "cargo-rullst/src/generators/desktop/**"
      - "cargo-rullst/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/omni-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "cargo-rullst/src/cli.rs"
      - "cargo-rullst/src/generators/desktop/**"
      - "cargo-rullst/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/omni-android.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android-build:
    name: Generate and compile Android shell
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: aarch64-linux-android

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Select preinstalled Java and Android NDK
        shell: bash
        run: |
          test -d "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          ndk_dir="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$ndk_dir" ]; then
            ndk_dir="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -d "$ndk_dir"
          echo "NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"

      - name: Build the Rullst CLI
        run: cargo build -p cargo-rullst --bin rullst

      - name: Create a disposable Rullst host project
        shell: bash
        run: |
          cargo new --bin "$RUNNER_TEMP/rullst-omni-host"
          cargo add rullst \
            --path "$GITHUB_WORKSPACE/rullst" \
            --manifest-path "$RUNNER_TEMP/rullst-omni-host/Cargo.toml"

      - name: Generate the Android shell non-interactively
        working-directory: ${{ runner.temp }}/rullst-omni-host
        run: |
          "$GITHUB_WORKSPACE/target/debug/rullst" make:omni \
            --platform android \
            --backend-url https://example.invalid \
            --identifier dev.rullst.omnici

      - name: Compile a debug Android APK
        working-directory: ${{ runner.temp }}/rullst-omni-host/omni-app
        run: npm run tauri -- android build --debug --target aarch64 --apk --ci

      - name: Upload generated Android project on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omni-android-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/rullst-omni-host/omni-app/gen/android
          if-no-files-found: ignore
          retention-days: 7
