name: Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Run weekly

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
        
      - name: Install cargo-audit
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-audit

      - name: Validate advisory exception governance
        shell: bash
        run: |
          set -euo pipefail

          ledger_ids="$(
            # shellcheck disable=SC2016
            sed -n 's/^| `\(RUSTSEC-[0-9-]*\)`.*/\1/p' \
              docs/src/security-advisory-exceptions.md | sort -u
          )"
          deny_ids="$(
            sed -n '/^\[advisories\]/,/^\[/p' deny.toml |
              grep -oE 'RUSTSEC-[0-9-]+' | sort -u
          )"
          workflow_ids="$(
            grep -h -oE -- '--ignore RUSTSEC-[0-9-]+' \
              .github/workflows/audit.yml \
              .github/workflows/security-audit.yml \
              .github/workflows/pqc-compliance.yml \
              .github/workflows/release.yml |
              awk '{print $2}' | sort -u
          )"

          if [ "$ledger_ids" != "$deny_ids" ] || [ "$ledger_ids" != "$workflow_ids" ]; then
            echo "Advisory exception IDs differ between the ledger, deny.toml, and workflows."
            diff -u <(printf '%s\n' "$ledger_ids") <(printf '%s\n' "$deny_ids") || true
            diff -u <(printf '%s\n' "$ledger_ids") <(printf '%s\n' "$workflow_ids") || true
            exit 1
          fi

          today="$(date -u +%F)"
          awk -F '|' -v today="$today" '
            /^\| `RUSTSEC-/ {
              owner = $5
              expiry = $6
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", owner)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", expiry)
              if (owner == "" || expiry !~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/ || expiry < today) {
                print "Invalid or expired advisory exception row: " $0 > "/dev/stderr"
                failed = 1
              }
            }
            END { exit failed }
          ' docs/src/security-advisory-exceptions.md
        
      - name: Run cargo-audit
        # Every exception is time-bounded in docs/src/security-advisory-exceptions.md.
        run: cargo audit --ignore RUSTSEC-2023-0071
