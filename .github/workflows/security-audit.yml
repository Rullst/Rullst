name: Security Audit

on:
  push:
    branches: [main, v12, v13]
  pull_request:
    branches: [main, v12, v13]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Run weekly

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: 1.99.0
        
      - name: Install cargo-audit
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit

      - name: Validate advisory exception governance
        shell: bash
        run: |
          set -euo pipefail

          ledger_ids="$(
            # shellcheck disable=SC2016
            sed -n 's/^| `\(RUSTSEC-[0-9-]*\)`.*/\1/p' \
              docs/src/security-advisory-exceptions.md | sort -u
          )"
          deny_ids="$(
            sed -n '/^\[advisories\]/,/^\[/p' deny.toml |
              grep -oE 'RUSTSEC-[0-9-]+' | sort -u || true
          )"
          workflow_ids="$(
            grep -h -oE -- '--(audit-)?ignore RUSTSEC-[0-9-]+' \
              .github/workflows/audit.yml \
              .github/workflows/security-audit.yml \
              .github/workflows/pqc-compliance.yml \
              .github/workflows/release.yml |
              awk '{print $2}' | sort -u || true
          )"

          if [ "$ledger_ids" != "$deny_ids" ] || [ "$ledger_ids" != "$workflow_ids" ]; then
            echo "Advisory exception IDs differ between the ledger, deny.toml, and workflows."
            diff -u <(printf '%s\n' "$ledger_ids") <(printf '%s\n' "$deny_ids") || true
            diff -u <(printf '%s\n' "$ledger_ids") <(printf '%s\n' "$workflow_ids") || true
            exit 1
          fi

          today="$(date -u +%F)"
          awk -F '|' -v today="$today" '
            /^\| `RUSTSEC-/ {
              owner = $5
              expiry = $6
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", owner)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", expiry)
              if (owner == "" || expiry !~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/ || expiry < today) {
                print "Invalid or expired advisory exception row: " $0 > "/dev/stderr"
                failed = 1
              }
            }
            END { exit failed }
          ' docs/src/security-advisory-exceptions.md
        
      - name: Run cargo-audit
        run: cargo audit
