name: Zero Panics Policy

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-panics:
    name: Enforce Zero Panics (published libraries)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
          target: wasm32-unknown-unknown

      - name: Run Clippy (Deny Panics) — covered native libraries
        # rullst-orm-macros is included because it generates application runtime
        # code. cargo-rullst, rullst-macros, and examples/blog are not covered by
        # this library job and must not be inferred to have passed this policy.
        # rullst-core::testing is downstream assertion support; its explicit
        # assertion-failure panics are test semantics, not an application path.
        run: |
          cargo clippy \
            -p rullst \
            -p rullst-core \
            -p rullst-security \
            -p rullst-orm \
            -p rullst-orm-macros \
            -p rullst-connect \
            -p rullst-auth \
            -p rullst-mail \
            -p rullst-ai \
            -p rullst-nexus \
            -p rullst-capital \
            -p rullst-studio \
            -p rullst-iot \
            --lib --all-features \
            -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::todo \
            -D clippy::unimplemented

      - name: Verify zero-panic ORM runtime expansion
        # Clippy checks the proc-macro engine; this regression test separately
        # inspects the runtime token stream emitted by #[derive(Orm)].
        run: |
          cargo test \
            -p rullst-orm-macros --lib \
            generated_runtime_code_has_no_panicking_calls

      - name: Run Clippy (Deny Panics) — Wasm client path
        run: |
          cargo clippy \
            -p rullst-core \
            --lib --target wasm32-unknown-unknown --no-default-features \
            -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::todo \
            -D clippy::unimplemented
