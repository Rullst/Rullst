name: Zero Panics Policy

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check-panics:
    name: Enforce Zero Panics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          components: clippy

      - name: Run Clippy (Deny Panics) — all production crates
        # Exclude: proc-macro crates (rullst-macros, rullst-orm-macros) since
        # panics in macro expansion are compile-time errors, not runtime risks.
        # Exclude: cargo-rullst (CLI tool, panics acceptable in scaffold commands).
        # Exclude: examples/blog (demo code, not production).
        run: |
          cargo clippy \
            -p rullst \
            -p rullst-core \
            -p rullst-orm \
            -p rullst-connect \
            -p rullst-auth \
            -p rullst-mail \
            -p rullst-ai \
            -p rullst-nexus \
            -p rullst-capital \
            -p rullst-studio \
            --lib --all-features \
            -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::todo \
            -D clippy::unimplemented
