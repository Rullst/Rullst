name: Zero Panics Policy

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-panics:
    name: Enforce Zero Panics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy

      - name: Run Clippy (Deny Panics) — all production crates
        # Exclude: proc-macro crates (rullst-macros, rullst-orm-macros) since
        # panics in macro expansion are compile-time errors, not runtime risks.
        # Exclude: cargo-rullst (CLI tool, panics acceptable in scaffold commands).
        # Exclude: examples/blog (demo code, not production).
        run: |
          cargo clippy \
            -p rullst \
            -p rullst-core \
            -p rullst-security \
            -p rullst-orm \
            -p rullst-connect \
            -p rullst-auth \
            -p rullst-mail \
            -p rullst-ai \
            -p rullst-nexus \
            -p rullst-capital \
            -p rullst-studio \
            -p rullst-iot \
            --lib --all-features \
            -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::todo \
            -D clippy::unimplemented
