# TEMPORARY (dropped before merge): times the first development build of the
# Blank (SQLite) and SaaS starters on a hosted runner with a cold cache.
name: Probe first development build

on:
  push:
    branches: [ci/v13-alpha6-ci-gaps]
    paths: [.github/workflows/probe-first-build.yml, .github/probe-first-build.py]

permissions:
  contents: read

jobs:
  probe:
    name: First development build (Blank, SaaS)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: ""
          build-warnings: ""
          cache: false

      - name: Build the CLI from this checkout
        run: |
          cargo fetch --locked
          cargo build --locked -p cargo-rullst --bin cargo-rullst

      - name: Time the starters' first development builds
        env:
          PROBE_OUT: ${{ runner.temp }}/first-build.json
        run: python3 .github/probe-first-build.py target/debug/cargo-rullst "$RUNNER_TEMP/probe"

      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-build
          path: ${{ runner.temp }}/first-build.json
          if-no-files-found: warn
          retention-days: 14
