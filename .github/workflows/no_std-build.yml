name: no_std Build Check

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-no-std:
    name: Build rullst-iot (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf     # STM32 Cortex-M4/M7
          - thumbv6m-none-eabi        # Cortex-M0 / M0+
          - riscv32imac-unknown-none-elf  # ESP32-C3 (RISC-V)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable with target
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build rullst-iot (no_std, ${{ matrix.target }})
        run: |
          cargo build -p rullst-iot \
            --target ${{ matrix.target }} \
            --no-default-features \
            --release

      - name: Check no_std binary size
        run: |
          if [ -f "target/${{ matrix.target }}/release/librullst_iot.rlib" ]; then
            SIZE=$(wc -c < "target/${{ matrix.target }}/release/librullst_iot.rlib")
            echo "Binary size: ${SIZE} bytes"
          else
            echo "Build successful."
          fi

