name: Concurrency & Memory Sanitizers (TSan & ASan)

on:
  schedule:
    # Daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tsan:
    name: ThreadSanitizer (Data Races) — ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ['rullst-core', 'rullst-security', 'rullst-auth', 'rullst-connect', 'rullst-orm', 'rullst-ai', 'rullst-capital', 'rullst-nexus', 'rullst-studio', 'rullst-mail', 'rullst-iot']
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
          components: rust-src

      - name: Run ThreadSanitizer on ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        env:
          RUSTFLAGS: "-Zsanitizer=thread"
          TSAN_OPTIONS: "second_deadlock_stack=1"
        run: |
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --lib -- --test-threads=4

  asan:
    name: AddressSanitizer (Memory Safety & Leaks) — ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ['rullst-core', 'rullst-security', 'rullst-auth', 'rullst-connect', 'rullst-orm', 'rullst-ai', 'rullst-capital', 'rullst-nexus', 'rullst-studio', 'rullst-mail', 'rullst-iot']
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
          components: rust-src

      - name: Run AddressSanitizer on ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=1:detect_stack_use_after_return=1"
        run: |
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --lib -- --test-threads=2
