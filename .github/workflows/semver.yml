name: SemVer Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-semver-checks
      - name: Check every published Rust API for SemVer regressions
        run: |
          cargo semver-checks check-release \
            -p rullst-macros \
            -p rullst-orm-macros \
            -p rullst-core \
            -p rullst-orm \
            -p rullst-iot \
            -p rullst-mail \
            -p rullst-ai \
            -p rullst-connect \
            -p rullst-security \
            -p rullst-auth \
            -p rullst-capital \
            -p rullst-studio \
            -p rullst-nexus \
            -p rullst
