# TEMPORARY (fix/v13-alpha6-macos-nightly): which targets reject Wycheproof
# ECDSA P-256 tcId 483 with aws-lc-rs. Removed before the pull request merges.
name: Temporary ES256 probe

on:
  push:
    branches: [fix/v13-alpha6-macos-nightly]

permissions:
  contents: read

jobs:
  probe:
    name: ES256 probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ""
      - name: Report the target and the aws-lc versions
        run: |
          uname -a
          rustc -vV
          grep -A1 -E '^name = "aws-lc-(rs|sys)"' Cargo.lock
      - name: List every disagreement with Wycheproof
        run: cargo test -p rullst-auth --features passkeys --lib es256_probe -- --nocapture
      - name: Run the strict Wycheproof test
        run: cargo test -p rullst-auth --features passkeys --lib wycheproof_ecdsa_p256 -- --nocapture
