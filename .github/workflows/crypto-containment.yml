name: IoT and Vault Crypto Containment

# Signed OTA tests for rullst-iot, the Vault encryption tests, a RustSec audit
# and a no-unsafe check of those files. Nothing here is post-quantum: until
# 13.0.0-alpha.4 this file was pqc-compliance.yml, and until 13.0.0-rc.1 it
# also scanned the simulator fixtures that release removed.

on:
  push:
    branches: [main]
    paths:
      - "rullst-iot/**"
      - "rullst-security/src/vault.rs"
      - ".github/workflows/crypto-containment.yml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "rullst-iot/**"
      - "rullst-security/src/vault.rs"
      - ".github/workflows/crypto-containment.yml"
      - "Cargo.lock"
  schedule:
    # Weekly audit every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  crypto-containment:
    name: Signed OTA & Vault Containment Checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: 1.100.0

      - name: Test signed OTA and the IoT encoders
        run: cargo test -p rullst-iot --all-features -- --nocapture

      - name: Run Vault encryption tests
        run: cargo test -p rullst-security vault -- --nocapture

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit

      - name: Run cargo-audit (CVE scan on crypto deps)
        run: cargo audit --ignore RUSTSEC-2026-0459 --ignore RUSTSEC-2026-0440

      - name: Verify no unsafe blocks in OTA, MQTT and Vault modules
        run: |
          echo "Scanning OTA, MQTT, and vault files for unsafe blocks..."
          if grep -rn "unsafe" rullst-iot/src/ota.rs rullst-iot/src/mqtt.rs rullst-security/src/vault.rs; then
            echo "Unsafe blocks detected. Manual review required."
            exit 1
          else
            echo "No unsafe blocks detected in the scanned files."
          fi
