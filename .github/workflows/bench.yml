name: Benchmark Regression

on:
  push:
    # v12 benchmark history is built from the active mainline.
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 04:00 UTC (weekly regression audit)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Checkout Rullst
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      # ── rullst (core framework: router, html!, WAF) ─────────────────────────────
      - name: Run bench — rullst (router, html!, WAF middleware)
        run: |
          set -o pipefail
          cargo bench -p rullst --bench rullst_bench -- --output-format bencher | tee bench_rullst.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches/
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        with:
          name: 'Rullst Core Benchmark'
          tool: 'cargo'
          output-file-path: bench_rullst.txt
          fail-on-alert: false
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches'

      # ── rullst-orm (query builder, schema, audit) ───────────────────────────────
      - name: Run bench — rullst-orm (query builder, schema, row mapping)
        run: |
          set -o pipefail
          cargo bench -p rullst-orm --bench orm_bench -- --output-format bencher | tee bench_orm.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-orm/
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        with:
          name: 'Rullst ORM Benchmark'
          tool: 'cargo'
          output-file-path: bench_orm.txt
          fail-on-alert: false
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-orm'

      # ── rullst-core (escape_str, mask_pii, generate_csrf_token) ─────────────────
      - name: Run bench — rullst-core (HTML escape, PII mask, CSRF token)
        run: |
          set -o pipefail
          cargo bench -p rullst-core --bench core_bench -- --output-format bencher | tee bench_core.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-core/
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        with:
          name: 'Rullst Core Primitives Benchmark'
          tool: 'cargo'
          output-file-path: bench_core.txt
          fail-on-alert: false
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-core'

      # ── rullst-auth (AES-GCM session crypto) ────────────────────────────────────
      - name: Run bench — rullst-auth (AES-256-GCM session encrypt/decrypt)
        run: |
          set -o pipefail
          cargo bench -p rullst-auth --bench auth_bench -- --output-format bencher | tee bench_auth.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-auth/
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        with:
          name: 'Rullst Auth Benchmark'
          tool: 'cargo'
          output-file-path: bench_auth.txt
          fail-on-alert: false
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-auth'

      # ── rullst-connect (OAuth provider construction, PKCE) ──────────────────────
      - name: Run bench — rullst-connect (OAuth provider, PKCE)
        run: |
          set -o pipefail
          cargo bench -p rullst-connect --bench provider_bench -- --output-format bencher | tee bench_connect.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-connect/
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        with:
          name: 'Rullst Connect Benchmark'
          tool: 'cargo'
          output-file-path: bench_connect.txt
          fail-on-alert: false
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-connect'

      # ── rullst-security (RASP inspection, RbacGuard, Vault zeroization) ────────
      - name: Run bench — rullst-security (RASP, RBAC, Vault)
        run: |
          set -o pipefail
          cargo bench -p rullst-security --bench security_bench -- --output-format bencher | tee bench_security.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-security/
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        with:
          name: 'Rullst Security Benchmark'
          tool: 'cargo'
          output-file-path: bench_security.txt
          fail-on-alert: false
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-security'

      # ── rullst-ai (AiGuardrails, PII masking, token context) ───────────────────
      - name: Run bench — rullst-ai (Guardrails, PII masking, Token context)
        run: |
          set -o pipefail
          cargo bench -p rullst-ai --bench ai_bench -- --output-format bencher | tee bench_ai.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-ai/
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        with:
          name: 'Rullst AI Benchmark'
          tool: 'cargo'
          output-file-path: bench_ai.txt
          fail-on-alert: false
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-ai'

      # ── rullst-capital (Webhook validation, Subscription parsing) ───────────────
      - name: Run bench — rullst-capital (Webhooks, Subscription parsing)
        run: |
          set -o pipefail
          cargo bench -p rullst-capital --bench capital_bench -- --output-format bencher | tee bench_capital.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-capital/
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        with:
          name: 'Rullst Capital Benchmark'
          tool: 'cargo'
          output-file-path: bench_capital.txt
          fail-on-alert: false
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-capital'
