name: Benchmark Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Rullst
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1

      # ── rullst (core framework: router, html!, WAF) ─────────────────────────────
      - name: Run bench — rullst (router, html!, WAF middleware)
        run: cargo bench -p rullst --bench rullst_bench -- --output-format bencher | tee bench_rullst.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches/
        uses: benchmark-action/github-action-benchmark@f365922de16cdebc25fd9f201e7456d68b94f6c4 # v1
        with:
          name: 'Rullst Core Benchmark'
          tool: 'cargo'
          output-file-path: bench_rullst.txt
          fail-on-alert: true
          alert-threshold: '300%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches'

      # ── rullst-orm (query builder, schema, audit) ───────────────────────────────
      - name: Run bench — rullst-orm (query builder, schema, row mapping)
        run: cargo bench -p rullst-orm --bench orm_bench -- --output-format bencher | tee bench_orm.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-orm/
        uses: benchmark-action/github-action-benchmark@f365922de16cdebc25fd9f201e7456d68b94f6c4 # v1
        with:
          name: 'Rullst ORM Benchmark'
          tool: 'cargo'
          output-file-path: bench_orm.txt
          fail-on-alert: true
          alert-threshold: '300%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-orm'

      # ── rullst-core (escape_str, mask_pii, generate_csrf_token) ─────────────────
      - name: Run bench — rullst-core (HTML escape, PII mask, CSRF token)
        run: cargo bench -p rullst-core --bench core_bench -- --output-format bencher | tee bench_core.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-core/
        uses: benchmark-action/github-action-benchmark@f365922de16cdebc25fd9f201e7456d68b94f6c4 # v1
        with:
          name: 'Rullst Core Primitives Benchmark'
          tool: 'cargo'
          output-file-path: bench_core.txt
          fail-on-alert: true
          alert-threshold: '300%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-core'

      # ── rullst-auth (AES-GCM session crypto) ────────────────────────────────────
      - name: Run bench — rullst-auth (AES-256-GCM session encrypt/decrypt)
        run: cargo bench -p rullst-auth --bench auth_bench -- --output-format bencher | tee bench_auth.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-auth/
        uses: benchmark-action/github-action-benchmark@f365922de16cdebc25fd9f201e7456d68b94f6c4 # v1
        with:
          name: 'Rullst Auth Benchmark'
          tool: 'cargo'
          output-file-path: bench_auth.txt
          fail-on-alert: true
          alert-threshold: '300%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-auth'

      # ── rullst-connect (OAuth provider construction, PKCE) ──────────────────────
      - name: Run bench — rullst-connect (OAuth provider, PKCE)
        run: cargo bench -p rullst-connect --bench provider_bench -- --output-format bencher | tee bench_connect.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-connect/
        uses: benchmark-action/github-action-benchmark@f365922de16cdebc25fd9f201e7456d68b94f6c4 # v1
        with:
          name: 'Rullst Connect Benchmark'
          tool: 'cargo'
          output-file-path: bench_connect.txt
          fail-on-alert: true
          alert-threshold: '300%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-connect'
