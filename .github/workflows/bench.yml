name: Benchmark Regression

on:
  push:
    # Rolling benchmark history follows the active development mainline.
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 04:00 UTC (weekly regression audit)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: rullst-ci-v1

jobs:
  # The production stack of a generated application against the same routes
  # without layers, and the SaaS starter's signed-in dashboard, on one runner
  # (.github/check-stack-throughput.py): a throughput regression of either
  # fails this job.
  stack-throughput:
    name: Generated stack throughput
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: ""
      RULLST_DISABLE_UPDATE_CHECK: "true"
    steps:
      - name: Checkout Rullst
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # The SaaS starter builds as a newcomer builds it.
          rustflags: ""
          build-warnings: ""
          cache: false

      - name: Install bombardier 2.0.2 (the load generator of Rullst/Benchmarks)
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/bombardier" \
            https://github.com/codesenberg/bombardier/releases/download/v2.0.2/bombardier-linux-amd64
          echo "d3dc4a9ecec3f8bd43f8c196ad533cb4b79ca55b11fc74c3184231e00a95bc0b  $RUNNER_TEMP/bombardier" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bombardier"

      - name: Build the CLI from this checkout (it generates the SaaS starter)
        run: |
          cargo fetch --locked
          cargo build --locked -p cargo-rullst --bin cargo-rullst

      - name: Compare the generated stacks with the minimal one
        run: |
          python3 .github/check-stack-throughput.py --bombardier "$RUNNER_TEMP/bombardier" \
            --cli target/debug/cargo-rullst --work "$RUNNER_TEMP/stack-throughput" --out stack-throughput-results

      - name: Upload the load generator results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-throughput-results
          path: stack-throughput-results
          if-no-files-found: ignore
          retention-days: 14

  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Checkout Rullst
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          cache: false

      # ── rullst (core framework: router, html!, WAF) ─────────────────────────────
      - name: Run bench — rullst (router, html!, WAF middleware)
        run: |
          set -o pipefail
          cargo bench -p rullst --bench rullst_bench -- --output-format bencher | tee bench_rullst.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches/
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1
        with:
          name: 'Rullst Core Benchmark'
          tool: 'cargo'
          output-file-path: bench_rullst.txt
          fail-on-alert: false
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches'

      # ── rullst-orm (local regressions + equivalent cross-ORM SQLite shapes) ─────
      - name: Run bench — rullst-orm (local paths, Diesel and SeaORM)
        run: |
          set -o pipefail
          cargo bench --locked -p rullst-orm --features drivers-all --bench orm_bench -- --output-format bencher | tee bench_orm.txt
          cargo bench --locked -p rullst-orm --features strict-sqlite --bench orm_comparison -- --output-format bencher | tee -a bench_orm.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-orm/
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1
        with:
          name: 'Rullst ORM Benchmark'
          tool: 'cargo'
          output-file-path: bench_orm.txt
          fail-on-alert: false
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-orm'

      # ── rullst-core (escape_str, mask_pii, generate_csrf_token) ─────────────────
      - name: Run bench — rullst-core (HTML escape, PII mask, CSRF token)
        run: |
          set -o pipefail
          cargo bench -p rullst-core --bench core_bench -- --output-format bencher | tee bench_core.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-core/
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1
        with:
          name: 'Rullst Core Primitives Benchmark'
          tool: 'cargo'
          output-file-path: bench_core.txt
          fail-on-alert: false
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-core'

      # ── rullst-auth (AES-GCM session crypto) ────────────────────────────────────
      - name: Run bench — rullst-auth (AES-256-GCM session encrypt/decrypt)
        run: |
          set -o pipefail
          cargo bench -p rullst-auth --bench auth_bench -- --output-format bencher | tee bench_auth.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-auth/
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1
        with:
          name: 'Rullst Auth Benchmark'
          tool: 'cargo'
          output-file-path: bench_auth.txt
          fail-on-alert: false
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-auth'

      # ── rullst-connect (OAuth provider construction, PKCE) ──────────────────────
      - name: Run bench — rullst-connect (OAuth provider, PKCE)
        run: |
          set -o pipefail
          cargo bench -p rullst-connect --bench provider_bench -- --output-format bencher | tee bench_connect.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-connect/
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1
        with:
          name: 'Rullst Connect Benchmark'
          tool: 'cargo'
          output-file-path: bench_connect.txt
          fail-on-alert: false
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-connect'

      # ── rullst-security (RASP inspection, RbacGuard, Vault zeroization) ────────
      - name: Run bench — rullst-security (RASP, RBAC, Vault)
        run: |
          set -o pipefail
          cargo bench -p rullst-security --bench security_bench -- --output-format bencher | tee bench_security.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-security/
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1
        with:
          name: 'Rullst Security Benchmark'
          tool: 'cargo'
          output-file-path: bench_security.txt
          fail-on-alert: false
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-security'

      # ── rullst-ai (AiGuardrails, PII masking, token context) ───────────────────
      - name: Run bench — rullst-ai (Guardrails, PII masking, Token context)
        run: |
          set -o pipefail
          cargo bench -p rullst-ai --bench ai_bench -- --output-format bencher | tee bench_ai.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-ai/
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1
        with:
          name: 'Rullst AI Benchmark'
          tool: 'cargo'
          output-file-path: bench_ai.txt
          fail-on-alert: false
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-ai'

      # ── rullst-capital (Webhook validation, Subscription parsing) ───────────────
      - name: Run bench — rullst-capital (Webhooks, Subscription parsing)
        run: |
          set -o pipefail
          cargo bench -p rullst-capital --bench capital_bench -- --output-format bencher | tee bench_capital.txt

      - name: Reset Cargo.lock after bench
        run: git checkout Cargo.lock || true

      - name: Publish → gh-pages:benches-capital/
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1
        with:
          name: 'Rullst Capital Benchmark'
          tool: 'cargo'
          output-file-path: bench_capital.txt
          fail-on-alert: false
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: 'benches-capital'
