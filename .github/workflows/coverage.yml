name: Test Coverage (LLVM)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  coverage:
    name: Generate Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-llvm-cov

      - name: Run cargo-llvm-cov (all features — unit + integration)
        run: |
          cargo llvm-cov --all-features --workspace \
            --ignore-filename-regex "examples/|cargo-rullst/|rullst-macros/" \
            --lcov --output-path lcov_main.info

      - name: Run cargo-llvm-cov (DB matrix tests — postgres & mysql via testcontainers)
        # Must run without strict-* features so the cfg gates are satisfied
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          cargo llvm-cov -p rullst-orm \
            --test matrix_postgres --test matrix_mysql \
            --lcov --output-path lcov_db.info \
            -- --test-threads=1

      - name: Merge coverage reports
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info \
            --input-files lcov_main.info --input-files lcov_db.info 2>/dev/null \
            || cat lcov_main.info lcov_db.info > lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
