name: Test Coverage (LLVM)

on:
  push:
    branches: [main, v12, v13]
  pull_request:
    branches: [main, v12, v13]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: rullst-coverage-v1
  SCCACHE_GHA_RW_MODE: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'READ_WRITE' || 'READ_ONLY' }}
  RULLST_GENERATED_BUILD_JOBS: "2"

jobs:
  coverage:
    name: Generate Code Coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          components: llvm-tools-preview, clippy
          cache: false

      - name: Install pinned coverage tools
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.137

      - name: Run cargo-llvm-cov (all features — parallel unit + integration)
        env:
          NEXTEST_PROFILE: coverage
        run: |
          python3 .github/test-coverage-libraries.py
          cargo llvm-cov nextest --no-report --all-features --workspace --no-fail-fast

      - name: Preserve exact all-feature test execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-tests-${{ github.sha }}
          path: target/nextest/coverage/junit.xml
          if-no-files-found: error
          retention-days: 30

      - name: Run cargo-llvm-cov (default feature profiles)
        # The all-feature graph deliberately enables mutually exclusive
        # strict-* compile profiles. ORM, Studio, Nexus and the public facade
        # own default-SQLite tests that are cfg-excluded from that graph.
        # Exercise those packages without repeating every other workspace test;
        # cargo-llvm-cov merges both sets of profile data.
        run: |
          cargo llvm-cov --no-report \
            -p rullst-orm -p rullst-studio -p rullst-nexus -p rullst

      - name: Run cargo-llvm-cov (outbox and DB matrix contracts)
        # Must run without strict-* features so the cfg gates are satisfied.
        # The outbox test uses SQLite; PostgreSQL/MySQL use testcontainers.
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          RULLST_REQUIRE_TESTCONTAINERS: "true"
        run: |
          cargo llvm-cov --no-report -p rullst-orm \
            --test outbox_transaction_test \
            --test matrix_postgres --test matrix_mysql \
            -- --test-threads=1
          cargo llvm-cov --no-report -p rullst-orm \
            --no-default-features --features scout-http \
            --test matrix_meilisearch
          cargo llvm-cov --no-report -p rullst-orm \
            --no-default-features --features pgvector,strict-postgres \
            --test matrix_pgvector
          cargo llvm-cov --no-report -p rullst-orm \
            --no-default-features --features qdrant \
            --test matrix_qdrant
          cargo llvm-cov --no-report -p rullst-orm \
            --no-default-features --features redis \
            --test matrix_redis_data
          cargo llvm-cov --no-report -p rullst-studio \
            --no-default-features --features strict-sqlite \
            --test data_browser_mutation_sqlite
          cargo llvm-cov --no-report -p rullst-studio \
            --no-default-features --features strict-postgres \
            --test data_browser_mutation_postgres -- --test-threads=1
          cargo llvm-cov --no-report -p rullst-studio \
            --no-default-features --features strict-mysql \
            --test data_browser_mutation_mysql \
            --test data_browser_mutation_mariadb -- --test-threads=1

      - name: Measure PostgreSQL age/passkey state and server restart contracts
        run: |
          python3 .github/check-privacy-postgres.py --coverage
          python3 .github/check-passkey-postgres.py --coverage

      - name: Measure PostgreSQL recovery and cross-process session revocation
        run: python3 .github/check-auth-recovery-postgres.py --coverage

      - name: Measure private S3 access and service restart contracts
        run: bash .github/test-storage-s3-live.sh --coverage

      - name: Set up Node for the Live recovery browser contract
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Measure Live recovery with Chromium and an application restart
        run: >-
          cargo llvm-cov --no-report -p rullst-core --no-default-features
          --test live_recovery -- --ignored --exact
          chromium_recovers_across_disconnects_and_process_restart --nocapture

      - name: Measure distributed propagation with a standard TLS collector
        run: python3 .github/check-distributed-tracing.py --coverage

      - name: Measure remote messaging, TLS and Redis restart contracts
        run: python3 .github/check-messaging-redis.py --coverage

      - name: Provision the reviewed disposable Labs host
        run: bash .github/provision-labs-host.sh

      - name: Measure the trusted controller with real isolated workloads
        run: |
          python3 .github/test-labs-measurement.py
          # Preserve identical controller/worker bytes and collect only host
          # counters. No profiler state or output path enters the sandbox.
          bash .github/run-labs-coverage.sh

      - name: Generate merged coverage report
        run: |
          cargo llvm-cov report --json --summary-only \
            --output-path coverage-summary.json \
            --ignore-filename-regex "examples/|benches/|benchmark/|test_support\\.rs$"
          cargo llvm-cov report --text --output-path coverage.txt \
            --ignore-filename-regex "examples/|benches/|benchmark/|test_support\\.rs$"
          cargo llvm-cov report --lcov --output-path lcov.info \
            --ignore-filename-regex "examples/|benches/|benchmark/|test_support\\.rs$"
          tail -n 25 coverage.txt

      - name: Preserve exact coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: line-coverage-${{ github.sha }}
          path: |
            coverage-summary.json
            coverage.txt
            target/labs-coverage-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce exact line coverage floors
        run: python3 .github/check-coverage-threshold.py coverage-summary.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: lcov.info
          fail_ci_if_error: true
          use_oidc: true

  branch-coverage:
    name: Measure Branch Coverage (nightly, observational)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up nightly Rust for branch instrumentation
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          toolchain: nightly-2026-08-21
          components: llvm-tools-preview, clippy
          cache: false

      - name: Install pinned coverage tools
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.137

      - name: Run branch-instrumented workspace tests
        env:
          NEXTEST_PROFILE: coverage
        run: |
          cargo llvm-cov nextest --branch --no-report --all-features --workspace --no-fail-fast

      - name: Generate branch coverage evidence
        run: |
          cargo llvm-cov report --branch --json --summary-only \
            --output-path branch-coverage.json \
            --ignore-filename-regex "examples/|benches/|benchmark/|test_support\\.rs$"
          cargo llvm-cov report --branch --text \
            --output-path branch-coverage.txt \
            --ignore-filename-regex "examples/|benches/|benchmark/|test_support\\.rs$"
          tail -n 25 branch-coverage.txt

      - name: Preserve branch coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-coverage-${{ github.sha }}
          path: |
            branch-coverage.json
            branch-coverage.txt
          if-no-files-found: error
          retention-days: 30
