name: Kani Verifier (manual bounded evidence)

on:
  workflow_dispatch: # STRICTLY MANUAL TRIGGER ONLY

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Rullst itself remains pinned to stable Rust 1.98.1 and declares Rust 1.96
  # as its MSRV. Kani is a separate formal-verification tool that carries its
  # own compiler: the latest stable Kani bundle uses rustc 1.93 and cannot
  # compile Rullst, so this reviewed upstream snapshot uses the isolated
  # nightly-2026-08-01 compiler (reported as rustc 1.99.0-nightly). It predates
  # a Kani compare_bytes ICE reproduced with rustc 1.100.0-nightly and does not
  # change either Rullst's stable toolchain or its MSRV.
  KANI_SOURCE_REV: 8fcd6d90ed07b559e553ca8a92b95f2db69b2c78
  KANI_CRATE_VERSION: 0.67.0

jobs:
  build-kani:
    name: Build pinned Kani development bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable Kani source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: model-checking/kani
          ref: ${{ env.KANI_SOURCE_REV }}
          path: .kani-source
          persist-credentials: false

      - name: Install pinned Kani build dependencies
        working-directory: .kani-source
        run: |
          rustup toolchain install nightly-2026-08-01 \
            --profile minimal \
            --component llvm-tools,rustc-dev,rust-src,rustfmt
          ./scripts/setup/ubuntu/install_deps.sh
          git config --global --add safe.directory "$PWD"
          GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --depth 1

      - name: Build Kani bundle and installer crate
        working-directory: .kani-source
        run: |
          cargo bundle -- latest
          cargo package -p kani-verifier

      - name: Upload immutable Kani bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kani-development-bundle-${{ env.KANI_SOURCE_REV }}
          path: .kani-source/kani-latest-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload immutable Kani installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kani-development-installer-${{ env.KANI_SOURCE_REV }}
          path: .kani-source/target/package/kani-verifier-${{ env.KANI_CRATE_VERSION }}.crate
          if-no-files-found: error
          retention-days: 7

  kani:
    name: kani bounded (${{ matrix.package }} / ${{ matrix.harness }})
    needs: build-kani
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - package: rullst-core
            harness: proof_escape_str_safety_and_bounds
          - package: rullst-core
            harness: proof_escape_ascii_byte_exact
          - package: rullst-core
            harness: proof_card_mask_count_boundaries
          - package: rullst-core
            harness: verify_token_bucket_math_safety
          - package: rullst-core
            harness: verify_traffic_shield_thresholds
          - package: rullst-security
            harness: proof_secure_headers_config_initialization
          - package: rullst-security
            harness: proof_key_id_byte_policy
          - package: rullst-security
            harness: proof_progressive_delay_is_bounded
          - package: rullst-security
            harness: proof_buffer_size_gate_boundaries
          - package: rullst-security
            harness: proof_ascii_fold_policy
          - package: rullst-security
            harness: proof_sri_asset_size_boundary
          - package: rullst-auth
            harness: proof_make_logout_cookie_invariants
          - package: rullst-connect
            harness: verify_constant_time_eq_safety
          - package: rullst-iot
            harness: proof_coap_option_component_layout
          - package: rullst-iot
            harness: proof_modbus_crc16_no_panic
          - package: rullst-ai
            harness: proof_tool_param_instantiation
          - package: rullst-capital
            harness: proof_invoice_item_amount_valid
          - package: rullst-nexus
            harness: proof_sanitize_identifier_alphanumeric_or_underscore
          - package: rullst-studio
            harness: proof_sanitize_identifier_length_bound
          - package: rullst-mail
            harness: proof_message_builder_recipient

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download immutable Kani bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kani-development-bundle-${{ env.KANI_SOURCE_REV }}
          path: ${{ runner.temp }}/kani-bundle

      - name: Download immutable Kani installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kani-development-installer-${{ env.KANI_SOURCE_REV }}
          path: ${{ runner.temp }}/kani-installer

      - name: Install pinned Kani development snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/kani-installer/unpacked"
          tar -xzf \
            "$RUNNER_TEMP/kani-installer/kani-verifier-${KANI_CRATE_VERSION}.crate" \
            -C "$RUNNER_TEMP/kani-installer/unpacked"
          cargo install --locked \
            --path "$RUNNER_TEMP/kani-installer/unpacked/kani-verifier-${KANI_CRATE_VERSION}"
          cargo kani setup --use-local-bundle \
            "$RUNNER_TEMP/kani-bundle/kani-latest-x86_64-unknown-linux-gnu.tar.gz"
          cargo kani --version

      - name: Verify named bounded Kani harness
        working-directory: ${{ matrix.package }}
        timeout-minutes: 90
        run: |
          # --default-unwind 5 caps loop unrolling to prevent OOM from
          # unbounded loops in crypto crates. --jobs 1 prevents parallel SAT
          # solvers from competing for runner RAM. A proof failure now fails
          # its matrix job instead of being hidden by continue-on-error.
          cargo kani \
            --harness "${{ matrix.harness }}" \
            --default-unwind 5 \
            --jobs 1
