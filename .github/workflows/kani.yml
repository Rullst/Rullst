name: Kani Verifier (manual informational)

on:
  workflow_dispatch: # STRICTLY MANUAL TRIGGER ONLY

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  kani:
    name: kani informational (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        package: ['rullst-core', 'rullst-security', 'rullst-auth', 'rullst-connect', 'rullst-iot', 'rullst-ai', 'rullst-capital', 'rullst-nexus', 'rullst-studio', 'rullst-mail', 'rullst-macros']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Kani 0.67.0
        run: cargo install kani-verifier --version 0.67.0 --locked && cargo kani setup

      - name: Verify with Kani (non-blocking research harnesses)
        working-directory: ${{ matrix.package }}
        continue-on-error: true
        timeout-minutes: 90
        run: |
          # --default-unwind-bound 5: caps loop unrolling to prevent OOM from
          # unbounded loops in crypto crates (subtle::ct_eq was at 5733 iterations).
          # --jobs 1: prevents parallel SAT solvers from competing for runner RAM.
          cargo kani --default-unwind 5 --jobs 1
