name: Unused Dependencies & Features (informational)

on:
  schedule:
    - cron: '0 3 * * 2' # Weekly on Tuesday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  udeps:
    name: Detect Unused Dependencies (informational)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nightly Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: nightly

      - name: Install cargo-udeps
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-udeps

      - name: Run cargo-udeps across workspace (non-blocking signal)
        # Nightly-only analysis is intentionally advisory; Clippy and the
        # compile/test matrix remain the blocking dependency checks.
        run: cargo +nightly udeps --workspace --all-targets || true
