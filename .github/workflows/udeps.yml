name: Unused Dependencies & Features (informational)

on:
  schedule:
    - cron: '0 3 * * 2' # Weekly on Tuesday at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UDEPS_TOOLCHAIN: nightly-2026-08-21

jobs:
  udeps:
    name: Detect Unused Dependencies (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nightly Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: nightly-2026-08-21

      - name: Install cargo-udeps
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-udeps

      - name: Run cargo-udeps across workspace (non-blocking signal)
        # Nightly-only analysis is intentionally advisory; Clippy and the
        # compile/test matrix remain the blocking dependency checks.
        continue-on-error: true
        run: cargo +"$UDEPS_TOOLCHAIN" udeps --workspace --all-targets --all-features
