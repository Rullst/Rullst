name: Unused Dependencies & Features (informational)

on:
  schedule:
    - cron: '0 3 * * 2' # Weekly on Tuesday at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UDEPS_TOOLCHAIN: nightly-2026-08-21

jobs:
  udeps:
    name: Detect Unused Dependencies (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nightly Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: nightly-2026-08-21

      - name: Install cargo-udeps
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-udeps

      - name: Run cargo-udeps across workspace (non-blocking signal)
        # Nightly-only analysis is intentionally advisory; Clippy and the
        # compile/test matrix remain the blocking dependency checks.
        continue-on-error: true
        run: cargo +"$UDEPS_TOOLCHAIN" udeps --workspace --all-targets --all-features
