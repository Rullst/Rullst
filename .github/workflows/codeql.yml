name: "CodeQL SAST"

on:
  push:
    branches: [main, v12, v13]
  # PRs to main skip this heavy check; it runs after each main push,
  # on the weekly schedule and on PRs to the maintained lines.
  pull_request:
    branches: [v12, v13]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Run weekly

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Analyze (Rust)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        rustflags: "-D warnings"
        build-warnings: ""
        # CodeQL must observe compilation for this exact run; do not restore a
        # target archive that could bypass extractor-visible rustc work.
        cache: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        languages: rust

    - name: Build for CodeQL
      run: cargo check --workspace --all-targets --all-features

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        category: "/language:rust"
        # Uploaded after the test-fixture filter below.
        upload: never
        output: ${{ runner.temp }}/codeql-sarif

    - name: Drop hard-coded-crypto results in test-only files
      run: python3 -I .github/filter-codeql-test-fixtures.py "$RUNNER_TEMP/codeql-sarif/rust.sarif"

    - name: Upload CodeQL results
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        sarif_file: ${{ runner.temp }}/codeql-sarif/rust.sarif

  analyze-javascript:
    name: Analyze (JavaScript)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        languages: javascript-typescript
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        category: "/language:javascript"
