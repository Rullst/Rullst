name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform matrix for a diagnostic rerun; use all for release evidence
        required: true
        default: all
        type: choice
        options:
          - all
          - ubuntu-latest
          - macos-latest
          - windows-latest
      shard:
        description: Test shard for a diagnostic rerun; use all for release evidence
        required: true
        default: all
        type: choice
        options:
          - all
          - workspace
          - cli-standard
          - cli-profiles-basic
          - cli-profiles-relational
          - cli-profiles-polyglot
          - cli-lms
          - cli-saas-foundation
          - cli-saas-product

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_NET_RETRY: 10
  # Content-addressed compiler outputs replace duplicated target archives.
  # Same-repository PRs write only to their isolated pull-request cache scope,
  # which makes retries useful without modifying the trusted main namespace.
  # Forks remain read-only; main pushes and manual runs seed shared objects.
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: rullst-ci-v1
  SCCACHE_GHA_RW_MODE: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'READ_WRITE' || 'READ_ONLY' }}

defaults:
  run:
    working-directory: .

jobs:
  check:
    name: Code Quality & Format
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt, clippy
          cache: false

      - name: Check formatting (Workspace)
        run: cargo fmt --all -- --check

      - name: Set up Node for the development browser contract
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check reload generation, singleton and refresh behavior
        run: node rullst-core/src/server/dev_reload/client_tests.cjs

      - name: Run Clippy (Workspace)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Run Tests (${{ matrix.os }} / ${{ matrix.shard }})
    # Draft PRs still receive the faster format/Clippy feedback above. The
    # expensive cross-platform suite starts when the PR is ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    # Generated CLI applications are real independent Cargo workspaces. Keep
    # them in isolated shards so their compile contracts run concurrently
    # instead of extending one Windows job towards two hours.
    timeout-minutes: 120
    env:
      # The generated profile/blueprint suites otherwise force one nested
      # compiler process for constrained developer machines. Two jobs stay
      # within hosted-runner CPU limits while shortening those serial builds.
      RULLST_GENERATED_BUILD_JOBS: "2"
    strategy:
      fail-fast: false
      matrix:
        # A ready PR (and an explicit manual run) proves all three platforms
        # before merge. The resulting push to main repeats Linux only instead
        # of paying for the exact macOS/Windows matrix a second time. A direct
        # main push still receives the Linux regression gate and can be followed
        # by workflow_dispatch for full cross-platform evidence.
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || github.event_name == 'workflow_dispatch' && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        shard: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.shard != 'all' && format('["{0}"]', inputs.shard) || '["workspace","cli-standard","cli-profiles-basic","cli-profiles-relational","cli-profiles-polyglot","cli-lms","cli-saas-foundation","cli-saas-product"]') }}
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # CLI integration tests intentionally create and remove nested Cargo
          # targets. Caching the whole workspace target races the cache cleanup,
          # emits false ENOENT annotations and uploads multi-gigabyte archives.
          cache: false

      - name: Run complete all-feature test shard
        # Note: --all-features activates strict-sqlite+strict-mysql+strict-postgres
        # simultaneously, which correctly cfg-excludes the DB matrix tests (those
        # run in the dedicated step below with the proper feature combination).
        shell: bash
        env:
          CI_SHARD: ${{ matrix.shard }}
        run: |
          set +e
          (
            set -e
            bash .github/run-workspace-test-shard.sh "$CI_SHARD"
          ) 2>&1 | tee "workspace-tests-$CI_SHARD.log"
          test_status="${PIPESTATUS[0]}"
          set -e
          if [ "$test_status" -ne 0 ]; then
            grep -E '^test .* \.\.\. FAILED$|^    [^[:space:]].* - should panic \.\.\. FAILED$' \
              "workspace-tests-$CI_SHARD.log" |
              while IFS= read -r failure; do
                echo "::error title=Workspace test failure::${failure}"
              done
            exit "$test_status"
          fi

      - name: Upload failed workspace test log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-tests-${{ matrix.os }}-${{ matrix.shard }}
          path: workspace-tests-${{ matrix.shard }}.log
          if-no-files-found: error
          retention-days: 7

      - name: Run portable transactional outbox contract
        if: matrix.shard == 'workspace'
        run: >-
          cargo test -p rullst-orm --no-default-features
          --test outbox_transaction_test -- --test-threads=1

      - name: Run provider matrices (SQL, document, edge and search)
        # Docker testcontainers are supported on Linux runners.
        # Run without strict-* features so the relational matrix cfg
        # gates are satisfied. --test-threads=1 prevents parallel tests from
        # overwriting the global Orm::init() connection pool.
        if: runner.os == 'Linux' && matrix.shard == 'workspace'
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          RULLST_REQUIRE_TESTCONTAINERS: "true"
        run: |
          cargo test -p rullst-orm --test matrix_postgres --test matrix_mysql --test matrix_mariadb -- --test-threads=1
          cargo test -p rullst-orm --no-default-features --features mongodb --test matrix_mongodb
          cargo test -p rullst-orm --no-default-features --features surrealdb --test matrix_surrealdb
          cargo test -p rullst-orm --no-default-features --features turso --test matrix_turso
          cargo test -p rullst-orm --no-default-features --features scout-http --test matrix_meilisearch
          cargo test -p rullst-orm --no-default-features --features pgvector,strict-postgres --test matrix_pgvector
          cargo test -p rullst-orm --no-default-features --features qdrant --test matrix_qdrant
          cargo test -p rullst-orm --no-default-features --features redis --test matrix_redis_data
          cargo test -p rullst-studio --no-default-features --test data_browser_mutation_sqlite -- --test-threads=1
          cargo test -p rullst-studio --no-default-features --features strict-postgres --test data_browser_mutation_postgres -- --test-threads=1
          cargo test -p rullst-studio --no-default-features --features strict-mysql --test data_browser_mutation_mysql -- --test-threads=1
          cargo test -p rullst-studio --no-default-features --features strict-mysql --test data_browser_mutation_mariadb -- --test-threads=1
          cargo test -p rullst-nexus --no-default-features --test tenant_audit -- --test-threads=1
          cargo test -p rullst-ai --features sql-memory --test sql_chat_memory_postgres --test sql_chat_memory_mysql --test sql_chat_memory_mariadb -- --test-threads=1
          cargo test -p rullst-capital --features quota-sql --test quota_sql_postgres --test quota_sql_mysql --test quota_sql_mariadb -- --test-threads=1

  strict-database-features:
    name: ORM ${{ matrix.feature }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      RULLST_REQUIRE_TESTCONTAINERS: "true"
    strategy:
      fail-fast: false
      matrix:
        feature: [strict-postgres, strict-mysql, strict-sqlite]
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Compile ORM feature in isolation
        run: cargo check -p rullst-orm --all-targets --no-default-features --features ${{ matrix.feature }}

      - name: Exercise the selected strict pool and dialect
        env:
          STRICT_DATABASE_FEATURE: ${{ matrix.feature }}
        run: |
          case "$STRICT_DATABASE_FEATURE" in
            strict-postgres)
              cargo test -p rullst-orm --no-default-features \
                --features strict-postgres --test matrix_postgres -- --test-threads=1
              ;;
            strict-mysql)
              cargo test -p rullst-orm --no-default-features \
                --features strict-mysql --test matrix_mysql -- --test-threads=1
              ;;
            strict-sqlite)
              cargo test -p rullst-orm --no-default-features \
                --features strict-sqlite --test matrix_sqlite -- --test-threads=1
              ;;
            *)
              echo "Unknown strict database feature: $STRICT_DATABASE_FEATURE"
              exit 1
              ;;
          esac

  redis-rate-limit:
    name: Redis live contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Prove independent clients share one atomic budget
        env:
          RULLST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test -p rullst-security --features redis-rate-limit --test redis_rate_limit_live

      - name: Prove Redis queue never claims scheduled jobs early
        env:
          RULLST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test -p rullst-core --features queue-redis --test queue_scheduling_live

      - name: Prove Redis cache inspection stays metadata-only and bounded
        env:
          RULLST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test -p rullst-core --features cache-redis --test cache_inspection_live

      - name: Prove ORM cache and post-commit contracts
        env:
          RULLST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: >-
          cargo test -p rullst-orm --features redis
          --test query_cache_live
          --test post_commit_transaction_test
          --test scout_post_commit_test

  feature-boundaries:
    name: Public feature boundaries (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Compile all public minimal and isolated feature boundaries
        run: bash .github/check-feature-boundaries.sh --shard "${{ matrix.shard }}/4"

  threat-model-release-minimum:
    name: Threat-model release-negative minimum (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Run the explicit threat-model release-negative minimum
        shell: bash
        run: |
          set +e
          bash .github/check-threat-model-release-minimum.sh \
            --shard "${{ matrix.shard }}/4" 2>&1 | tee threat-model-release-minimum.log
          check_status="${PIPESTATUS[0]}"
          set -e
          if [ "$check_status" -ne 0 ]; then
            echo "::error title=Threat-model release minimum failed::See threat-model-release-minimum.log"
            exit "$check_status"
          fi

      - name: Upload failed threat-model evidence log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threat-model-release-minimum-${{ matrix.shard }}
          path: threat-model-release-minimum.log
          if-no-files-found: error
          retention-days: 7

  versioned-ai-evals:
    name: Versioned deterministic AI evals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Validate and run the versioned offline eval suite
        run: bash .github/check-ai-evals.sh

  generated-release-access:
    name: Generated release access boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Prove Nexus never selects credential-free release access
        run: cargo test --release -p rullst-nexus ergonomic_policy_never_selects_loopback_in_release_builds

      - name: Prove Studio rejects its local capability in release builds
        run: cargo test --release -p rullst-studio protected_router_accepts_only_a_verified_loopback_peer

  facade-composition:
    name: Facade shared-local recovery composition
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Prove cross-domain restart and corruption isolation
        run: bash .github/check-facade-composition.sh

  msrv:
    name: Check MSRV (Rust 1.96.0)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Install Rust 1.96.0 (declared MSRV)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: "1.96.0"

      - name: Check workspace compiles on MSRV
        # Use `cargo check` (no linking) to validate the MSRV without full build time.
        # If any crate uses a stabilized API newer than 1.96.0, this will fail.
        run: cargo check --workspace --all-features

  quality-scorecard:
    name: Evidence quality scorecard (observational)
    # The scorecard's verification dimension requires the full OS matrix. A
    # Linux-only post-merge push must not silently inherit cross-platform credit.
    if: >-
      always() && github.event_name != 'push' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || (inputs.platform == 'all' && inputs.shard == 'all'))
    needs:
      - check
      - test
      - strict-database-features
      - redis-rate-limit
      - feature-boundaries
      - threat-model-release-minimum
      - versioned-ai-evals
      - generated-release-access
      - facade-composition
      - msrv
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RULLST_SCORECARD_SHA: ${{ github.sha }}
      RULLST_SCORECARD_TIME: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at || 'workflow_dispatch' }}
      RULLST_SCORECARD_CHECK: ${{ needs.check.result }}
      RULLST_SCORECARD_TESTS: ${{ needs.test.result }}
      RULLST_SCORECARD_STRICT_DB: ${{ needs.strict-database-features.result }}
      RULLST_SCORECARD_REDIS: ${{ needs.redis-rate-limit.result }}
      RULLST_SCORECARD_FEATURES: ${{ needs.feature-boundaries.result }}
      RULLST_SCORECARD_THREAT: ${{ needs.threat-model-release-minimum.result }}
      RULLST_SCORECARD_AI_EVALS: ${{ needs.versioned-ai-evals.result }}
      RULLST_SCORECARD_LOCAL_ACCESS: ${{ needs.generated-release-access.result }}
      RULLST_SCORECARD_FACADE: ${{ needs.facade-composition.result }}
      RULLST_SCORECARD_MSRV: ${{ needs.msrv.result }}
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SHA-bound scorecard
        run: bash .github/generate-quality-scorecard.sh quality-scorecard.md

      - name: Add report to workflow summary
        run: cat quality-scorecard.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-scorecard-${{ github.sha }}
          path: quality-scorecard.md
          if-no-files-found: error
          retention-days: 90
