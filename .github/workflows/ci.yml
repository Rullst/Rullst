name: Rust CI

on:
  push:
    branches: [main, v12, v13]
  pull_request:
    branches: [main, v12, v13]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform matrix; packaged-distribution and release evidence require all
        required: true
        default: all
        type: choice
        options:
          - all
          - ubuntu-latest
          - macos-latest
          - windows-latest
      shard:
        description: Test shard for a diagnostic rerun; use all for release evidence
        required: true
        default: all
        type: choice
        options:
          - all
          - workspace
          - cli-standard
          - cli-updates
          - packaged-distribution
          - labs-isolation
          - cli-profiles-basic
          - cli-profiles-relational
          - cli-profiles-polyglot
          - cli-lms
          - cli-saas-foundation
          - cli-saas-product

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_NET_RETRY: 10
  # Content-addressed compiler outputs replace duplicated target archives.
  # Same-repository PRs write only to their isolated pull-request cache scope,
  # which makes retries useful without modifying the trusted main namespace.
  # Forks remain read-only; main pushes and manual runs seed shared objects.
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: rullst-ci-v1
  SCCACHE_GHA_RW_MODE: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'READ_WRITE' || 'READ_ONLY' }}

defaults:
  run:
    working-directory: .

jobs:
  scope:
    name: Verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      runtime_required: ${{ steps.scope.outputs.runtime_required }}
    steps:
      - name: Checkout source and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate diagnostic selectors and admit source-equivalent site pushes
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.before || '' }}
          RULLST_CI_SHARD: ${{ inputs.shard }}
          RULLST_CI_PLATFORM: ${{ inputs.platform }}
        run: bash .github/plan-ci-scope.sh

  site-validation:
    name: Verify site-only presentation
    needs: scope
    if: github.event_name == 'push' && (github.ref == 'refs/heads/v13' || github.ref == 'refs/heads/main') && needs.scope.outputs.runtime_required == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout site candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned documentation builder
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: mdbook@0.5.4
      - name: Set up browser-test runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate rendered content and real browser behavior
        run: |
          mdbook build docs
          python3 .github/validate-site.py
          node --check docs/site.js
          node .github/site-browser-smoke.mjs

  check:
    needs: scope
    # A manual Labs diagnostic has targeted formatting/Clippy in its own job.
    # Full workspace quality remains required for PRs and complete release runs.
    if: >-
      !cancelled() &&
      (github.event_name != 'workflow_dispatch' || inputs.shard != 'labs-isolation') &&
      (github.event_name != 'workflow_dispatch' || inputs.shard != 'packaged-distribution' || inputs.platform == 'all') &&
      (github.event_name != 'push' || (github.ref != 'refs/heads/v13' && github.ref != 'refs/heads/main') || needs.scope.result != 'success' || needs.scope.outputs.runtime_required != 'false')
    name: Code Quality & Format
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          components: rustfmt, clippy
          cache: false

      - name: Check formatting (Workspace)
        run: cargo fmt --all -- --check

      - name: Set up Node for the development browser contract
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check reload generation, singleton and refresh behavior
        run: node rullst-core/src/server/dev_reload/client_tests.cjs

      - name: Verify all fuzz dependency locks before expensive checks
        run: bash .github/check-fuzz-locks.sh

      - name: Run Clippy (Workspace)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    needs: scope
    name: Run Tests (${{ matrix.os }} / ${{ matrix.shard }})
    # Draft PRs still receive the faster format/Clippy feedback above. The
    # expensive cross-platform suite starts when the PR is ready for review.
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || (inputs.shard != 'packaged-distribution' && inputs.shard != 'labs-isolation')) &&
      (github.event_name != 'push' || (github.ref != 'refs/heads/v13' && github.ref != 'refs/heads/main') || needs.scope.result != 'success' || needs.scope.outputs.runtime_required != 'false')
    runs-on: ${{ matrix.os }}
    # Generated CLI applications are real independent Cargo workspaces. Keep
    # them in isolated shards so their compile contracts run concurrently
    # instead of extending one Windows job towards two hours.
    timeout-minutes: 120
    env:
      # The generated profile/blueprint suites otherwise force one nested
      # compiler process for constrained developer machines. Two jobs stay
      # within hosted-runner CPU limits while shortening those serial builds.
      RULLST_GENERATED_BUILD_JOBS: "2"
      # Reuse real renderer/generated-project tests; do not add another build.
      RULLST_UI_BROWSER_TESTS: ${{ matrix.os == 'ubuntu-latest' && (matrix.shard == 'workspace' || matrix.shard == 'cli-saas-product') && '1' || '0' }}
      RULLST_UI_BROWSER_SCRIPT: ${{ github.workspace }}/.github/mobile-ui-browser-smoke.mjs
      RULLST_MEDIA_BROWSER_TESTS: ${{ matrix.os == 'ubuntu-latest' && matrix.shard == 'workspace' && '1' || '0' }}
      RULLST_SUPERVISION_BROWSER_TESTS: ${{ matrix.os == 'ubuntu-latest' && matrix.shard == 'cli-standard' && '1' || '0' }}
      RULLST_BILLING_BROWSER_TESTS: ${{ matrix.os == 'ubuntu-latest' && matrix.shard == 'cli-standard' && '1' || '0' }}
      RULLST_API_CONTRACT_TESTS: ${{ matrix.os == 'ubuntu-latest' && matrix.shard == 'cli-standard' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        # A ready PR (and an explicit manual run) proves all three platforms
        # before merge. The resulting push to main repeats Linux only instead
        # of paying for the exact macOS/Windows matrix a second time. A direct
        # main push still receives the Linux regression gate and can be followed
        # by workflow_dispatch for full cross-platform evidence.
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || github.event_name == 'workflow_dispatch' && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        shard: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.shard != 'all' && format('["{0}"]', inputs.shard) || '["workspace","cli-standard","cli-profiles-basic","cli-profiles-relational","cli-profiles-polyglot","cli-lms","cli-saas-foundation","cli-saas-product"]') }}
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          # CLI integration tests intentionally create and remove nested Cargo
          # targets. Caching the whole workspace target races the cache cleanup,
          # emits false ENOENT annotations and uploads multi-gigabyte archives.
          cache: false

      - name: Set up Node for browser and typed API regressions
        if: env.RULLST_UI_BROWSER_TESTS == '1' || env.RULLST_BILLING_BROWSER_TESTS == '1' || env.RULLST_API_CONTRACT_TESTS == '1'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pinned TypeScript contract compiler
        if: env.RULLST_API_CONTRACT_TESTS == '1'
        run: npm ci --prefix .github/api-contract --ignore-scripts --no-audit --no-fund

      - name: Run complete all-feature test shard
        # Note: --all-features activates strict-sqlite+strict-mysql+strict-postgres
        # simultaneously, which correctly cfg-excludes the DB matrix tests (those
        # run in the dedicated step below with the proper feature combination).
        shell: bash
        env:
          CI_SHARD: ${{ matrix.shard }}
        run: |
          set +e
          (
            set -e
            bash .github/run-workspace-test-shard.sh "$CI_SHARD"
          ) 2>&1 | tee "workspace-tests-$CI_SHARD.log"
          test_status="${PIPESTATUS[0]}"
          set -e
          if [ "$test_status" -ne 0 ]; then
            grep -E '^test .* \.\.\. FAILED$|^    [^[:space:]].* - should panic \.\.\. FAILED$' \
              "workspace-tests-$CI_SHARD.log" |
              while IFS= read -r failure; do
                echo "::error title=Workspace test failure::${failure}"
              done
            exit "$test_status"
          fi

      - name: Exercise Live recovery in Chromium across a server restart
        if: runner.os == 'Linux' && matrix.shard == 'workspace'
        run: >-
          cargo test --locked -p rullst-core --no-default-features
          --test live_recovery -- --ignored --exact
          chromium_recovers_across_disconnects_and_process_restart --nocapture

      - name: Exercise distributed propagation against a standard TLS collector
        if: runner.os == 'Linux' && matrix.shard == 'workspace'
        run: python3 .github/check-distributed-tracing.py

      - name: Exercise guided update in a real terminal
        if: runner.os == 'Linux' && (matrix.shard == 'cli-standard' || matrix.shard == 'cli-updates')
        run: python3 .github/cli-guided-pty-smoke.py target/debug/cargo-rullst

      - name: Upload failed workspace test log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-tests-${{ matrix.os }}-${{ matrix.shard }}
          path: workspace-tests-${{ matrix.shard }}.log
          if-no-files-found: error
          retention-days: 7

      - name: Run portable transactional outbox contract
        if: matrix.shard == 'workspace'
        run: >-
          cargo test -p rullst-orm --no-default-features --features drivers-all
          --test outbox_transaction_test -- --test-threads=1

      - name: Run portable Stripe inbox transaction contract
        if: matrix.shard == 'workspace'
        env:
          RULLST_REQUIRE_SQLITE_INBOX: "1"
        run: cargo test -p rullst-capital --features webhook-sql --test stripe_inbox_sql --locked

      - name: Run provider matrices (SQL, document, edge and search)
        # Docker testcontainers are supported on Linux runners.
        # Run without strict-* features so the relational matrix cfg
        # gates are satisfied. --test-threads=1 prevents parallel tests from
        # overwriting the global Orm::init() connection pool.
        if: runner.os == 'Linux' && matrix.shard == 'workspace'
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          RULLST_REQUIRE_TESTCONTAINERS: "true"
        run: |
          cargo test -p rullst-orm --test matrix_postgres --test matrix_mysql --test matrix_mariadb -- --test-threads=1
          cargo test -p rullst-orm --no-default-features --features mongodb --test matrix_mongodb
          cargo test -p rullst-orm --no-default-features --features surrealdb --test matrix_surrealdb
          cargo test -p rullst-orm --no-default-features --features turso --test matrix_turso
          cargo test -p rullst-orm --no-default-features --features scout-http --test matrix_meilisearch
          cargo test -p rullst-orm --no-default-features --features pgvector,strict-postgres --test matrix_pgvector
          cargo test -p rullst-orm --no-default-features --features qdrant --test matrix_qdrant
          cargo test -p rullst-orm --no-default-features --features redis --test matrix_redis_data
          cargo test -p rullst-studio --no-default-features --test data_browser_mutation_sqlite -- --test-threads=1
          cargo test -p rullst-studio --no-default-features --features strict-postgres --test data_browser_mutation_postgres -- --test-threads=1
          cargo test -p rullst-studio --no-default-features --features strict-mysql --test data_browser_mutation_mysql -- --test-threads=1
          cargo test -p rullst-studio --no-default-features --features strict-mysql --test data_browser_mutation_mariadb -- --test-threads=1
          cargo test -p rullst-nexus --no-default-features --test tenant_audit -- --test-threads=1
          cargo test -p rullst-ai --features sql-memory --test sql_chat_memory_postgres --test sql_chat_memory_mysql --test sql_chat_memory_mariadb -- --test-threads=1
          cargo test -p rullst-capital --features quota-sql,webhook-sql --test quota_sql_postgres --test quota_sql_mysql --test quota_sql_mariadb -- --test-threads=1

  strict-database-features:
    needs: scope
    if: >-
      !cancelled() && (github.event_name != 'push' || (github.ref != 'refs/heads/v13' && github.ref != 'refs/heads/main') || needs.scope.result != 'success' || needs.scope.outputs.runtime_required != 'false') &&
      (github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == 'workspace')
    name: ORM ${{ matrix.feature }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      RULLST_REQUIRE_TESTCONTAINERS: "true"
    strategy:
      fail-fast: false
      matrix:
        feature: [strict-postgres, strict-mysql, strict-sqlite]
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          cache: false

      - name: Set up Node for the shared passkey browser contract
        if: matrix.feature == 'strict-postgres'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prove standalone ORM driver isolation
        env:
          STRICT_DATABASE_FEATURE: ${{ matrix.feature }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: python3 .github/check-orm-driver-consumer.py "$STRICT_DATABASE_FEATURE"

      - name: Compile ORM feature in isolation
        run: cargo check -p rullst-orm --all-targets --no-default-features --features ${{ matrix.feature }}

      - name: Exercise the selected strict pool and dialect
        env:
          STRICT_DATABASE_FEATURE: ${{ matrix.feature }}
        run: |
          case "$STRICT_DATABASE_FEATURE" in
            strict-postgres)
              RULLST_EMAIL_LOGIN_BROWSER_TESTS=1 python3 .github/check-auth-recovery-postgres.py
              python3 .github/check-mail-postgres.py
              python3 .github/check-privacy-postgres.py
              RULLST_PASSKEY_BROWSER_TESTS=1 python3 .github/check-passkey-postgres.py
              cargo test -p rullst-orm --no-default-features \
                --features strict-postgres --test matrix_postgres -- --test-threads=1
              cargo test -p rullst-capital --features quota-sql,webhook-sql,rullst-orm/strict-postgres \
                --test quota_sql_postgres --locked -- --test-threads=1
              ;;
            strict-mysql)
              cargo test -p rullst-orm --no-default-features \
                --features strict-mysql --test matrix_mysql -- --test-threads=1
              cargo test -p rullst-capital --features quota-sql,webhook-sql,rullst-orm/strict-mysql \
                --test quota_sql_mysql --test quota_sql_mariadb --locked -- --test-threads=1
              ;;
            strict-sqlite)
              cargo test -p rullst-orm --no-default-features \
                --features strict-sqlite --test matrix_sqlite -- --test-threads=1
              RULLST_REQUIRE_SQLITE_INBOX=1 cargo test -p rullst-capital \
                --features webhook-sql,rullst-orm/strict-sqlite --test stripe_inbox_sql --locked
              ;;
            *)
              echo "Unknown strict database feature: $STRICT_DATABASE_FEATURE"
              exit 1
              ;;
          esac

  storage-s3:
    needs: scope
    if: >-
      !cancelled() && (github.event_name != 'push' || (github.ref != 'refs/heads/v13' && github.ref != 'refs/heads/main') || needs.scope.result != 'success' || needs.scope.outputs.runtime_required != 'false') &&
      (github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == 'workspace')
    name: Private S3 storage contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          cache: false
      - name: Prove private object access, signature rejection and restart persistence
        run: bash .github/test-storage-s3-live.sh

  redis-rate-limit:
    needs: scope
    if: >-
      !cancelled() && (github.event_name != 'push' || (github.ref != 'refs/heads/v13' && github.ref != 'refs/heads/main') || needs.scope.result != 'success' || needs.scope.outputs.runtime_required != 'false') &&
      (github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == 'workspace')
    name: Redis live contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          cache: false

      - name: Prove independent clients share one atomic budget
        env:
          RULLST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test -p rullst-security --features redis-rate-limit --test redis_rate_limit_live

      - name: Prove Redis messaging leases, TLS, outbox replay and AOF restart
        run: python3 .github/check-messaging-redis.py

      - name: Prove two Rullst processes behind the owned Caddy and Redis profile
        run: python3 .github/check-deployment-proxy.py

      - name: Prove Redis queue never claims scheduled jobs early
        env:
          RULLST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test -p rullst-core --features queue-redis --test queue_scheduling_live

      - name: Prove Redis cache inspection stays metadata-only and bounded
        env:
          RULLST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test -p rullst-core --features cache-redis --test cache_inspection_live

      - name: Prove ORM cache and post-commit contracts
        env:
          RULLST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: >-
          cargo test -p rullst-orm --features redis
          --test query_cache_live
          --test post_commit_transaction_test
          --test scout_post_commit_test

  feature-boundaries:
    needs: scope
    if: >-
      !cancelled() && (github.event_name != 'push' || (github.ref != 'refs/heads/v13' && github.ref != 'refs/heads/main') || needs.scope.result != 'success' || needs.scope.outputs.runtime_required != 'false') &&
      (github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == 'workspace')
    name: Public feature boundaries (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          cache: false

      - name: Compile all public minimal and isolated feature boundaries
        run: bash .github/check-feature-boundaries.sh --shard "${{ matrix.shard }}/4"

  threat-model-release-minimum:
    needs: scope
    if: >-
      !cancelled() && (github.event_name != 'push' || (github.ref != 'refs/heads/v13' && github.ref != 'refs/heads/main') || needs.scope.result != 'success' || needs.scope.outputs.runtime_required != 'false') &&
      (github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == 'workspace')
    name: Threat-model release-negative minimum (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Use the same bounded nested-Cargo parallelism as the generated-project
      # matrix; the dedicated LMS evidence retains its complete application tests.
      RULLST_GENERATED_BUILD_JOBS: "2"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          cache: false

      - name: Run the explicit threat-model release-negative minimum
        shell: bash
        run: |
          set +e
          bash .github/check-threat-model-release-minimum.sh \
            --shard "${{ matrix.shard }}/4" 2>&1 | tee threat-model-release-minimum.log
          check_status="${PIPESTATUS[0]}"
          set -e
          if [ "$check_status" -ne 0 ]; then
            echo "::error title=Threat-model release minimum failed::See threat-model-release-minimum.log"
            exit "$check_status"
          fi

      - name: Upload failed threat-model evidence log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threat-model-release-minimum-${{ matrix.shard }}
          path: threat-model-release-minimum.log
          if-no-files-found: error
          retention-days: 7

  versioned-ai-evals:
    needs: scope
    if: >-
      !cancelled() && (github.event_name != 'push' || (github.ref != 'refs/heads/v13' && github.ref != 'refs/heads/main') || needs.scope.result != 'success' || needs.scope.outputs.runtime_required != 'false') &&
      (github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == 'workspace')
    name: Versioned deterministic AI evals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          cache: false

      - name: Validate and run the versioned offline eval suite
        run: bash .github/check-ai-evals.sh

  generated-release-access:
    needs: scope
    if: >-
      !cancelled() && (github.event_name != 'push' || (github.ref != 'refs/heads/v13' && github.ref != 'refs/heads/main') || needs.scope.result != 'success' || needs.scope.outputs.runtime_required != 'false') &&
      (github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == 'workspace')
    name: Generated release access boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          cache: false

      - name: Prove Nexus never selects credential-free release access
        run: cargo test --release -p rullst-nexus ergonomic_policy_never_selects_loopback_in_release_builds

      - name: Prove Studio rejects its local capability in release builds
        run: cargo test --release -p rullst-studio protected_router_accepts_only_a_verified_loopback_peer

  facade-composition:
    needs: scope
    if: >-
      !cancelled() && (github.event_name != 'push' || (github.ref != 'refs/heads/v13' && github.ref != 'refs/heads/main') || needs.scope.result != 'success' || needs.scope.outputs.runtime_required != 'false') &&
      (github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == 'workspace')
    name: Facade shared-local recovery composition
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          cache: false

      - name: Prove cross-domain restart and corruption isolation
        run: bash .github/check-facade-composition.sh

  msrv:
    needs: scope
    if: >-
      !cancelled() && (github.event_name != 'push' || (github.ref != 'refs/heads/v13' && github.ref != 'refs/heads/main') || needs.scope.result != 'success' || needs.scope.outputs.runtime_required != 'false') &&
      (github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == 'workspace')
    name: Check MSRV (Rust 1.96.0)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Install Rust 1.96.0 (declared MSRV)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: "1.96.0"

      - name: Check workspace compiles on MSRV
        # Use `cargo check` (no linking) to validate the MSRV without full build time.
        # If any crate uses a stabilized API newer than 1.96.0, this will fail.
        run: cargo check --workspace --all-features

  native-cli-artifacts:
    name: Native CLI distribution
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'all' && (inputs.shard == 'all' || inputs.shard == 'cli-standard')
    uses: ./.github/workflows/cli-artifacts.yml
    permissions:
      contents: read

  packaged-distribution:
    name: Packaged distribution and installed CLI
    # Exercise the actual archives before a tag or any registry publication.
    # An explicit package diagnostic exercises the same archives without the OS
    # test/native matrix; it cannot satisfy complete release admission.
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'all' && (inputs.shard == 'all' || inputs.shard == 'packaged-distribution')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RULLST_DISABLE_UPDATE_CHECK: "true"
    steps:
      - name: Checkout source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          cache: false

      - name: Validate versions and topological package inventory
        id: inventory
        run: |
          cargo metadata --locked --no-deps --format-version 1 > candidate-metadata.json
          candidate_version="$(jq -er '.packages[] | select(.name == "cargo-rullst") | .version' candidate-metadata.json)"
          jq --arg version "$candidate_version" \
            --slurpfile release_order .github/release-order.json \
            -f .github/release-preflight.jq candidate-metadata.json
          printf 'version=%s\n' "$candidate_version" >> "$GITHUB_OUTPUT"

      - name: Fetch locked dependencies for the isolated offline consumer
        # The archive consumer inspects its full dependency graph, including
        # target-specific edges. A host-only fetch leaves that offline metadata
        # check dependent on an accidentally warm foreign-platform cache.
        run: cargo fetch --locked

      - name: Package and audit candidate archives without publication
        env:
          CANDIDATE_VERSION: ${{ steps.inventory.outputs.version }}
        run: |
          # Rehearse unpublished candidates without release-order admission.
          bash .github/package-release.sh --no-verify --v13-candidates
          bash .github/audit-packages.sh "$CANDIDATE_VERSION" target/package --v13-candidates

      - name: Compile archive-only consumer and test the isolated installed CLI
        env:
          CANDIDATE_VERSION: ${{ steps.inventory.outputs.version }}
        run: bash .github/test-packaged-distribution.sh "$CANDIDATE_VERSION" target/package --v13-candidates

  labs-isolation:
    name: Isolated Labs acceptance (Linux)
    # Independent runtime evidence runs alongside workspace quality in full CI.
    # A manual diagnostic is targeted evidence, never complete release evidence.
    needs: scope
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == 'labs-isolation') &&
      (github.event_name != 'push' || (github.ref != 'refs/heads/v13' && github.ref != 'refs/heads/main') || needs.scope.result != 'success' || needs.scope.outputs.runtime_required != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up framework build toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          components: rustfmt, clippy
          cache: false

      - name: Check formatting and targeted quality for the manual Labs diagnostic
        if: github.event_name == 'workflow_dispatch' && inputs.shard == 'labs-isolation'
        run: |
          cargo fmt --all --check
          cargo clippy --locked -p rullst-labs -p rullst-labs-runner --all-features --all-targets -- -D warnings

      - name: Provision the reviewed disposable Labs host
        run: bash .github/provision-labs-host.sh

      - name: Verify profiling stays outside the cleared worker environment
        run: python3 .github/test-labs-measurement.py

      - name: Build separate controller and application fixture
        run: cargo build --locked -p rullst-labs -p rullst-labs-runner --all-features --bins --examples

      - name: Prove the separate compiler domain blocks parent descriptor aliases
        run: cargo test --locked -p rullst-labs-runner --test landlock_domains -- --ignored --exact independent_domains_block_interpreter_descriptors

      - name: Prove pinned tool spawning preserves the no-sockets policy
        run: cargo test --locked -p rullst-labs-runner --test seccomp_spawn -- --ignored --exact absolute_tool_spawn_preserves_socket_denial

      - name: Require real isolated execution in an owned unprivileged service
        env:
          LABS_UNIT_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # The test creates children only under this disposable delegated unit.
          # No global namespace/sysctl downgrade is allowed on unsupported hosts.
          sudo systemd-run --wait --collect --pipe \
            --unit="rullst-labs-acceptance-$LABS_UNIT_SUFFIX" \
            --property="User=$(id -un)" --property="Group=$(id -gn)" \
            --property=Delegate=yes --property=MemoryMax=3G \
            --property=TasksMax=256 --property=RuntimeMaxSec=15min \
            --setenv=RULLST_LABS_HOSTED_ACCEPTANCE=1 \
            --working-directory="$PWD" \
            /usr/bin/python3 .github/test-labs-isolation.py \
            --runner "$PWD/target/debug/rullst-labs-runner" \
            --app "$PWD/target/debug/examples/course_app" \
            --toolchain "$(rustc +1.96.0 --print sysroot)" \
            --launcher /usr/lib/rullst-labs-ci/bwrap --evidence "$PWD/target/labs-evidence.json"

      - name: Retain minimized execution evidence without fixture keys or source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: labs-isolation-${{ github.sha }}
          path: target/labs-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Install pinned measurement tool for the manual Labs diagnostic
        if: github.event_name == 'workflow_dispatch' && inputs.shard == 'labs-isolation'
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Measure the controller through the real isolated journey
        if: github.event_name == 'workflow_dispatch' && inputs.shard == 'labs-isolation'
        run: |
          rustup component add llvm-tools-preview
          bash .github/run-labs-coverage.sh
          cargo llvm-cov report --json --summary-only --output-path target/labs-coverage-summary.json

      - name: Retain the scoped controller coverage diagnostic
        if: github.event_name == 'workflow_dispatch' && inputs.shard == 'labs-isolation'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: labs-controller-coverage-${{ github.sha }}
          path: |
            target/labs-coverage-evidence.json
            target/labs-coverage-summary.json
          if-no-files-found: error
          retention-days: 14

  quality-scorecard:
    name: Evidence quality scorecard (observational)
    # The scorecard's verification dimension requires the full OS matrix. A
    # Linux-only post-merge push must not silently inherit cross-platform credit.
    # Report failures, but never hold a replaced run's concurrency slot after
    # cancellation. An always() job can survive normal workflow cancellation.
    if: >-
      !cancelled() && github.event_name != 'push' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || (inputs.platform == 'all' && inputs.shard == 'all'))
    needs:
      - check
      - test
      - strict-database-features
      - redis-rate-limit
      - feature-boundaries
      - threat-model-release-minimum
      - versioned-ai-evals
      - generated-release-access
      - facade-composition
      - msrv
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RULLST_SCORECARD_SHA: ${{ github.sha }}
      RULLST_SCORECARD_TIME: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at || 'workflow_dispatch' }}
      RULLST_SCORECARD_CHECK: ${{ needs.check.result }}
      RULLST_SCORECARD_TESTS: ${{ needs.test.result }}
      RULLST_SCORECARD_STRICT_DB: ${{ needs.strict-database-features.result }}
      RULLST_SCORECARD_REDIS: ${{ needs.redis-rate-limit.result }}
      RULLST_SCORECARD_FEATURES: ${{ needs.feature-boundaries.result }}
      RULLST_SCORECARD_THREAT: ${{ needs.threat-model-release-minimum.result }}
      RULLST_SCORECARD_AI_EVALS: ${{ needs.versioned-ai-evals.result }}
      RULLST_SCORECARD_LOCAL_ACCESS: ${{ needs.generated-release-access.result }}
      RULLST_SCORECARD_FACADE: ${{ needs.facade-composition.result }}
      RULLST_SCORECARD_MSRV: ${{ needs.msrv.result }}
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SHA-bound scorecard
        run: bash .github/generate-quality-scorecard.sh quality-scorecard.md

      - name: Add report to workflow summary
        run: cat quality-scorecard.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-scorecard-${{ github.sha }}
          path: quality-scorecard.md
          if-no-files-found: error
          retention-days: 90
