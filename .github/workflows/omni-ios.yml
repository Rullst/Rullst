name: Omni iOS Simulator

on:
  push:
    branches: [main, dev]
    paths:
      - "cargo-rullst/src/cli.rs"
      - "cargo-rullst/src/generators/desktop/**"
      - "cargo-rullst/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/omni-ios.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "cargo-rullst/src/cli.rs"
      - "cargo-rullst/src/generators/desktop/**"
      - "cargo-rullst/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/omni-ios.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  simulator-build:
    name: Generate and compile iOS simulator shell
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Select simulator architecture
        id: simulator
        shell: bash
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            echo "rust_target=aarch64-apple-ios-sim" >> "$GITHUB_OUTPUT"
            echo "tauri_target=aarch64-sim" >> "$GITHUB_OUTPUT"
          else
            echo "rust_target=x86_64-apple-ios" >> "$GITHUB_OUTPUT"
            echo "tauri_target=x86_64" >> "$GITHUB_OUTPUT"
          fi

      - name: Install simulator Rust target
        run: rustup target add "${{ steps.simulator.outputs.rust_target }}"

      - name: Build the Rullst CLI
        run: cargo build -p cargo-rullst --bin rullst

      - name: Create a disposable Rullst host project
        shell: bash
        run: |
          cargo new --bin "$RUNNER_TEMP/rullst-omni-host"
          cargo add rullst \
            --path "$GITHUB_WORKSPACE/rullst" \
            --manifest-path "$RUNNER_TEMP/rullst-omni-host/Cargo.toml"

      - name: Generate the iOS shell non-interactively
        working-directory: ${{ runner.temp }}/rullst-omni-host
        run: |
          "$GITHUB_WORKSPACE/target/debug/rullst" make:omni \
            --platform ios \
            --backend-url https://example.invalid

      - name: Compile the generated shell for the iOS simulator
        working-directory: ${{ runner.temp }}/rullst-omni-host/omni-app
        run: |
          npm run tauri -- ios build \
            --debug \
            --target "${{ steps.simulator.outputs.tauri_target }}" \
            --ci

      - name: Upload generated Apple project on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omni-ios-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/rullst-omni-host/omni-app/gen/apple
          if-no-files-found: ignore
          retention-days: 7
