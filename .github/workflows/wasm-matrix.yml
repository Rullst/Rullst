name: WebAssembly & Edge Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  wasm-build:
    name: Wasm Target (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm32-unknown-unknown
          - wasm32-wasip1
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}

      - name: Verify WebAssembly compilation for Island & Client Components
        # Verify rullst core and wasm client components compile cleanly without OS syscalls
        run: |
          cargo check -p rullst-core --target ${{ matrix.target }} --no-default-features
          cargo check -p rullst-macros --target ${{ matrix.target }}
