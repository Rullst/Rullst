name: WebAssembly & Edge Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  wasm-build:
    name: Wasm Target (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm32-unknown-unknown
          - wasm32-wasip1
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          target: ${{ matrix.target }}

      - name: Verify WebAssembly compilation for framework and client components
        # Verify Core, the public facade, and macros compile without native OS APIs.
        run: |
          cargo check -p rullst-core --target ${{ matrix.target }} --no-default-features
          cargo check -p rullst --target ${{ matrix.target }} --no-default-features
          cargo check -p rullst-macros --target ${{ matrix.target }}
