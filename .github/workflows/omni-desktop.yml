name: Omni Desktop Compile

on:
  push:
    branches: [main]
    paths:
      - "cargo-rullst/src/cli.rs"
      - "cargo-rullst/src/generators/desktop/**"
      - "cargo-rullst/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/omni-desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "cargo-rullst/src/cli.rs"
      - "cargo-rullst/src/generators/desktop/**"
      - "cargo-rullst/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/omni-desktop.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  desktop-check:
    name: Generate and check shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Build the Rullst CLI
        run: cargo build -p cargo-rullst --bin rullst

      - name: Create a disposable Rullst host project
        shell: bash
        run: |
          cargo new --bin "$RUNNER_TEMP/rullst-omni-host"
          cargo add rullst \
            --path "$GITHUB_WORKSPACE/rullst" \
            --manifest-path "$RUNNER_TEMP/rullst-omni-host/Cargo.toml"

      - name: Generate the desktop shell non-interactively
        shell: bash
        working-directory: ${{ runner.temp }}/rullst-omni-host
        run: |
          cli="$GITHUB_WORKSPACE/target/debug/rullst"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cli="${cli}.exe"
          fi
          "$cli" make:omni \
            --platform desktop \
            --backend-url https://example.invalid \
            --identifier dev.rullst.omnici

      - name: Check the generated Tauri crate
        shell: bash
        run: cargo check --manifest-path "$RUNNER_TEMP/rullst-omni-host/omni-app/Cargo.toml"
