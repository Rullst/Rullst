name: GitHub Actions Lint

on:
  push:
    branches: [main, v13]
  pull_request:
    branches: [main, v13]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actionlint:
    name: Validate workflow syntax and expressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test verification planning and timing observations
        run: |
          python3 .github/test-plan-verification.py
          python3 .github/test-report-ci-timings.py

      - name: Observe change impact without skipping checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          python3 .github/plan-verification.py \
            --base "$BASE_SHA" --head "$GITHUB_SHA" \
            > "$RUNNER_TEMP/verification-plan.json"
          {
            echo '### Verification impact observation'
            echo 'This report cannot skip checks or qualify as release evidence.'
            echo '```json'
            jq '{schema, phase, base_sha, head_sha, candidate_scope, enforced_scope,
                 may_skip_checks, release_evidence_eligible, fallback_reasons,
                 direct_packages, affected_packages}' "$RUNNER_TEMP/verification-plan.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the source-bound observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-plan-${{ github.sha }}
          path: ${{ runner.temp }}/verification-plan.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce canonical Action reference syntax
        run: |
          python3 .github/test-validate-action-pins.py
          python3 .github/validate-action-pins.py

      - name: Parse workflows and enforce immutable Action references
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@60e3a74c7b74a319e8e53e46bc455205f7173e1a # v5.0.8

      - name: Validate shared fuzz target inventory
        run: python3 .github/validate-fuzz-targets.py

      - name: Validate stable release-note extraction
        run: python3 .github/render-release-notes.py 12.0.0 "$RUNNER_TEMP/release-notes.md"

      - name: Validate mutation artifact aggregation
        run: bash .github/test-summarize-mutation-artifacts.sh

      - name: Validate exact-run mutation recovery planning
        run: python3 .github/test-plan-mutation-resume.py

      - name: Run actionlint 1.7.7
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            rhysd/actionlint:1.7.7@sha256:1d74bfc9fd1963af8f89a7c22afaaafd42f49aad711a09951d02cb996398f61d \
            -color
