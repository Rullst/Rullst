name: IoT Cryptography Containment

on:
  push:
    branches: [main, dev]
    paths:
      - "rullst-iot/**"
      - "rullst-security/src/vault.rs"
      - ".github/workflows/pqc-compliance.yml"
      - "Cargo.lock"
  pull_request:
    branches: [main, dev]
    paths:
      - "rullst-iot/**"
      - "rullst-security/src/vault.rs"
      - ".github/workflows/pqc-compliance.yml"
      - "Cargo.lock"
  schedule:
    # Weekly audit every Monday at 03:00 UTC
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  crypto-containment:
    name: Signed OTA & Simulator Boundary Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable

      - name: Test signed OTA and explicit simulator fixtures
        run: cargo test -p rullst-iot --all-features -- --nocapture

      - name: Run Vault encryption tests
        run: cargo test -p rullst-security vault -- --nocapture

      - name: Install cargo-audit
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-audit

      - name: Run cargo-audit (CVE scan on crypto deps)
        run: cargo audit --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2026-0002 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0173 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0221 --ignore RUSTSEC-2026-0253 --ignore RUSTSEC-2026-0258

      - name: Verify no unsafe blocks in OTA and fixture modules
        run: |
          echo "Scanning OTA, simulator, and vault files for unsafe blocks..."
          if grep -rn "unsafe" rullst-iot/src/ota.rs rullst-iot/src/pqc.rs rullst-iot/src/hsm.rs rullst-iot/src/mqtt.rs rullst-security/src/vault.rs; then
            echo "Unsafe blocks detected. Manual review required."
            exit 1
          else
            echo "No unsafe blocks detected in the scanned files."
          fi
