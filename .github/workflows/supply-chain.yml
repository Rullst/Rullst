name: Supply Chain

# Cargo Deny, Cargo Audit and the advisory-exception governance check, each in
# its own job. Until 13.0.0-alpha.4 they were cargo-deny.yml, audit.yml and
# security-audit.yml. The main ruleset requires the Cargo Deny job by its name,
# "Check Dependencies (Licenses, Vulnerabilities)": keep that name unchanged.
# A fourth job runs release.yml's evidence audit on the pull requests that
# can change it.

on:
  push:
    branches: [main, v12, v13]
  pull_request:
    branches: [main, v12, v13]
  workflow_dispatch:
  schedule:
    # Daily, so a new RustSec advisory or an expiring exception shows up
    # within a day even when nothing is pushed.
    - cron: '0 8 * * *'

concurrency:
  # A daily run must not cancel, or be cancelled by, the main push run that
  # release admission requires.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'schedule' && '-daily' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cargo-deny:
    name: Check Dependencies (Licenses, Vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docs/src/compatibility-policy.md#public-dependencies: crates exposed by
      # the public API stay on their 13.x lines unless the policy file changes.
      - name: Keep public dependencies on their 13.x lines
        run: |
          python3 .github/test-check-public-dependencies.py
          python3 .github/check-public-dependencies.py

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --workspace

  cargo-audit:
    name: Cargo Audit (production and fuzz locks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: 1.100.0
      - name: Install cargo-audit
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit
      - name: Audit production, fuzz and fixture dependency locks
        shell: bash
        run: |
          cargo audit --ignore RUSTSEC-2026-0459 --ignore RUSTSEC-2026-0440
          while IFS= read -r lockfile; do
            echo "Auditing $lockfile"
            cargo audit --no-fetch --ignore RUSTSEC-2026-0459 --ignore RUSTSEC-2026-0440 --file "$lockfile"
          done < <({
            find . -mindepth 3 -maxdepth 3 -path '*/fuzz/Cargo.lock' -print
            find ./.github/fixtures -name Cargo.lock -print
          } | sort)

  release-evidence-audit:
    name: Release evidence audit (governed exceptions)
    # The audits of release.yml's evidence step (.github/release-evidence-audit.sh)
    # with cargo-audit installed, so an exception missing from them fails on
    # the pull request instead of on the tag, as 13.0.0-alpha.5 did. Pull
    # requests run it only when they change the release workflow, this
    # workflow, the script, deny.toml, the exception ledger, the CLI's audit
    # code or Cargo.lock (a first step decides); manual runs always run it.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # Read-only reuse of the compiler outputs ci.yml seeds on main, as the
      # release's verify job does.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: rullst-ci-v1
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull-request merge commit and its base parent.
          fetch-depth: 2

      - name: Select the pull requests that change the release evidence audit
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          if grep -Eq '^(\.github/workflows/(release|supply-chain)\.yml|\.github/release-evidence-audit\.sh|deny\.toml|docs/src/security-advisory-exceptions\.md|Cargo\.lock|cargo-rullst/src/generators/audit[^/]*\.rs|cargo-rullst/src/cli/(commands|dispatch|runtime)\.rs)$' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change to the release evidence audit or its exceptions; release.yml runs it on the tag."
          fi

      - name: Set up content-addressed compiler cache
        if: steps.selection.outputs.run == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        if: steps.selection.outputs.run == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          cache: false

      - name: Install cargo-audit
        if: steps.selection.outputs.run == 'true'
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit

      - name: Run the release evidence audit with its governed exceptions
        if: steps.selection.outputs.run == 'true'
        run: bash .github/release-evidence-audit.sh "$RUNNER_TEMP/release-evidence"

  advisory-exceptions:
    name: Advisory exception governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate advisory exception governance
        shell: bash
        run: |
          set -euo pipefail

          ledger_ids="$(
            # shellcheck disable=SC2016
            sed -n 's/^| `\(RUSTSEC-[0-9-]*\)`.*/\1/p' \
              docs/src/security-advisory-exceptions.md | sort -u
          )"
          deny_ids="$(
            sed -n '/^\[advisories\]/,/^\[/p' deny.toml |
              grep -oE 'RUSTSEC-[0-9-]+' | sort -u || true
          )"
          # Read every workflow and the release evidence audit script that
          # release.yml runs, so an ignore added to any scanner (this file,
          # the release evidence bundle, the IoT crypto check or a new
          # workflow) must also be in the ledger.
          workflow_ids="$(
            grep -h -oE -- '--(audit-)?ignore RUSTSEC-[0-9-]+' \
              .github/workflows/*.yml .github/release-evidence-audit.sh |
              awk '{print $2}' | sort -u || true
          )"

          if [ "$ledger_ids" != "$deny_ids" ] || [ "$ledger_ids" != "$workflow_ids" ]; then
            echo "Advisory exception IDs differ between the ledger, deny.toml, and workflows."
            diff -u <(printf '%s\n' "$ledger_ids") <(printf '%s\n' "$deny_ids") || true
            diff -u <(printf '%s\n' "$ledger_ids") <(printf '%s\n' "$workflow_ids") || true
            exit 1
          fi

          today="$(date -u +%F)"
          awk -F '|' -v today="$today" '
            /^\| `RUSTSEC-/ {
              owner = $5
              expiry = $6
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", owner)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", expiry)
              if (owner == "" || expiry !~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/ || expiry < today) {
                print "Invalid or expired advisory exception row: " $0 > "/dev/stderr"
                failed = 1
              }
            }
            END { exit failed }
          ' docs/src/security-advisory-exceptions.md
