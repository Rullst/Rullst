name: Supply Chain

# Cargo Deny, Cargo Audit and the advisory-exception governance check, each in
# its own job. Until 13.0.0-alpha.4 they were cargo-deny.yml, audit.yml and
# security-audit.yml. The main ruleset requires the Cargo Deny job by its name,
# "Check Dependencies (Licenses, Vulnerabilities)": keep that name unchanged.
# A fourth job runs release.yml's evidence audit on the pull requests that
# can change it. A fifth, on scheduled runs only, reports a failure in an
# issue and closes that issue when a later scheduled run passes.

on:
  push:
    branches: [main, v12, v13]
  pull_request:
    branches: [main, v12, v13]
  workflow_dispatch:
  schedule:
    # Twice a day, so a new RustSec advisory or an expiring exception shows
    # up within about twelve hours even when nothing is pushed. GitHub often
    # starts these runs hours late: the 08:00 run of 17 November 2026 started
    # at 17:21 and so caught RUSTSEC-2026-0543, published at 10:14 UTC.
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'

concurrency:
  # A scheduled run must not cancel, or be cancelled by, the main push run
  # that release admission requires. Both schedules share the '-daily'
  # group; they start twelve hours apart and a run takes minutes, so one
  # would cancel the other only if GitHub delayed it by half a day.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'schedule' && '-daily' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cargo-deny:
    name: Check Dependencies (Licenses, Vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docs/src/compatibility-policy.md#public-dependencies: crates exposed by
      # the public API stay on their 13.x lines unless the policy file changes.
      - name: Keep public dependencies on their 13.x lines
        run: |
          python3 .github/test-check-public-dependencies.py
          python3 .github/check-public-dependencies.py

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --workspace

  cargo-audit:
    name: Cargo Audit (production and fuzz locks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: 1.100.0
      - name: Install cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit
      - name: Audit production, fuzz, fixture and website-generator dependency locks
        shell: bash
        run: |
          cargo audit --ignore RUSTSEC-2026-0459 --ignore RUSTSEC-2026-0440
          while IFS= read -r lockfile; do
            echo "Auditing $lockfile"
            cargo audit --no-fetch --ignore RUSTSEC-2026-0459 --ignore RUSTSEC-2026-0440 --file "$lockfile"
          done < <({
            find . -mindepth 3 -maxdepth 3 -path '*/fuzz/Cargo.lock' -print
            find ./.github/fixtures -name Cargo.lock -print
            echo ./site/Cargo.lock
          } | sort)

  release-evidence-audit:
    name: Release evidence audit (governed exceptions)
    # The audits of release.yml's evidence step (.github/release-evidence-audit.sh)
    # with cargo-audit installed, so an exception missing from them fails on
    # the pull request instead of on the tag, as 13.0.0-alpha.5 did. Pull
    # requests run it only when they change the release workflow, this
    # workflow, the script, deny.toml, the exception ledger, the CLI's audit
    # code or Cargo.lock (a first step decides); manual runs always run it.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # Read-only reuse of the compiler outputs ci.yml seeds on main, as the
      # release's verify job does.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: rullst-ci-v1
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull-request merge commit and its base parent.
          fetch-depth: 2

      - name: Select the pull requests that change the release evidence audit
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          if grep -Eq '^(\.github/workflows/(release|supply-chain)\.yml|\.github/release-evidence-audit\.sh|deny\.toml|docs/src/security-advisory-exceptions\.md|Cargo\.lock|cargo-rullst/src/generators/audit[^/]*\.rs|cargo-rullst/src/cli/(commands|dispatch|runtime)\.rs)$' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change to the release evidence audit or its exceptions; release.yml runs it on the tag."
          fi

      - name: Set up content-addressed compiler cache
        if: steps.selection.outputs.run == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust toolchain
        if: steps.selection.outputs.run == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          cache: false

      - name: Install cargo-audit
        if: steps.selection.outputs.run == 'true'
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit

      - name: Run the release evidence audit with its governed exceptions
        if: steps.selection.outputs.run == 'true'
        run: bash .github/release-evidence-audit.sh "$RUNNER_TEMP/release-evidence"

  advisory-exceptions:
    name: Advisory exception governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate advisory exception governance
        shell: bash
        run: |
          set -euo pipefail

          ledger_ids="$(
            # shellcheck disable=SC2016
            sed -n 's/^| `\(RUSTSEC-[0-9-]*\)`.*/\1/p' \
              docs/src/security-advisory-exceptions.md | sort -u
          )"
          deny_ids="$(
            sed -n '/^\[advisories\]/,/^\[/p' deny.toml |
              grep -oE 'RUSTSEC-[0-9-]+' | sort -u || true
          )"
          # Read every workflow and the release evidence audit script that
          # release.yml runs, so an ignore added to any scanner (this file,
          # the release evidence bundle, the IoT crypto check or a new
          # workflow) must also be in the ledger.
          workflow_ids="$(
            grep -h -oE -- '--(audit-)?ignore RUSTSEC-[0-9-]+' \
              .github/workflows/*.yml .github/release-evidence-audit.sh |
              awk '{print $2}' | sort -u || true
          )"

          if [ "$ledger_ids" != "$deny_ids" ] || [ "$ledger_ids" != "$workflow_ids" ]; then
            echo "Advisory exception IDs differ between the ledger, deny.toml, and workflows."
            diff -u <(printf '%s\n' "$ledger_ids") <(printf '%s\n' "$deny_ids") || true
            diff -u <(printf '%s\n' "$ledger_ids") <(printf '%s\n' "$workflow_ids") || true
            exit 1
          fi

          today="$(date -u +%F)"
          awk -F '|' -v today="$today" '
            /^\| `RUSTSEC-/ {
              owner = $5
              expiry = $6
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", owner)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", expiry)
              if (owner == "" || expiry !~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/ || expiry < today) {
                print "Invalid or expired advisory exception row: " $0 > "/dev/stderr"
                failed = 1
              }
            }
            END { exit failed }
          ' docs/src/security-advisory-exceptions.md

  scheduled-failure-issue:
    name: Report scheduled failures in an issue
    # A failed scheduled run used to notify only by e-mail. After each
    # scheduled run this job opens an issue titled "Scheduled supply-chain
    # check failed" with the supply-chain-alert label, or comments on the open
    # one, naming the failed jobs, the run and the RustSec IDs in their logs;
    # when a later scheduled run passes, it closes that issue. It is the only
    # job with issues: write; actions: read lets it list this run's jobs and
    # read their logs. It checks out no code.
    needs: [cargo-deny, cargo-audit, advisory-exceptions]
    if: github.event_name == 'schedule' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open, update or close the scheduled-failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Scheduled supply-chain check failed
          LABEL: supply-chain-alert
          DENY_RESULT: ${{ needs.cargo-deny.result }}
          AUDIT_RESULT: ${{ needs.cargo-audit.result }}
          GOVERNANCE_RESULT: ${{ needs.advisory-exceptions.result }}
        run: |
          set -euo pipefail
          # The open alert, if any (the oldest with this label and title).
          issue="$(gh issue list --label "$LABEL" --state open --limit 100 \
            --json number,title \
            --jq '[.[] | select(.title == env.TITLE)] | sort_by(.number) | .[0].number // empty')"

          if [ "$DENY_RESULT" = success ] && [ "$AUDIT_RESULT" = success ] \
            && [ "$GOVERNANCE_RESULT" = success ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" \
                --comment "The scheduled run $RUN_URL passed, so this alert is resolved."
            fi
            exit 0
          fi

          body="$RUNNER_TEMP/scheduled-failure.md"
          {
            echo "The scheduled \`supply-chain.yml\` run $RUN_URL failed on $GITHUB_SHA."
            echo
            echo '| Job | Result |'
            echo '| :--- | :--- |'
            echo "| Check Dependencies (Licenses, Vulnerabilities) | $DENY_RESULT |"
            echo "| Cargo Audit (production and fuzz locks) | $AUDIT_RESULT |"
            echo "| Advisory exception governance | $GOVERNANCE_RESULT |"
          } > "$body"

          # RustSec IDs as cargo-deny ("├ ID: RUSTSEC-…"), cargo-audit
          # ("ID:  RUSTSEC-…") and the governance check (an expired row)
          # print them in the failed jobs' logs. The ignore flags echoed with
          # each command are on other lines. gh refuses to print logs that
          # contain terminal escape sequences, so curl reads them.
          ids="$RUNNER_TEMP/advisory-ids.txt"
          : > "$ids"
          while IFS= read -r job; do
            log="$RUNNER_TEMP/job-$job.log"
            if ! curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' -o "$log" \
              "$GITHUB_API_URL/repos/$GH_REPO/actions/jobs/$job/logs"; then
              echo "Could not read the log of job $job." >&2
              continue
            fi
            sed 's/\x1b\[[0-9;]*m//g' "$log" |
              grep -E 'ID:[[:space:]]+RUSTSEC-[0-9]{4}-[0-9]{4}|expired advisory exception row' |
              grep -oE 'RUSTSEC-[0-9]{4}-[0-9]{4}' >> "$ids" || true
          done < <(gh api --paginate \
            "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | .id')
          if [ -s "$ids" ]; then
            {
              echo
              echo "RustSec advisories in the failed jobs' logs:"
              echo
              sort -u "$ids" | while IFS= read -r id; do
                echo "- [$id](https://rustsec.org/advisories/$id.html)"
              done
            } >> "$body"
          fi
          {
            echo
            echo 'Upgrade, or govern an exception as MAINTAINING.md ("Advisories") describes.'
            echo 'This issue closes when a later scheduled run passes.'
          } >> "$body"

          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$body"
          else
            gh label create "$LABEL" --color B60205 \
              --description 'A scheduled supply-chain.yml run failed' --force
            gh issue create --title "$TITLE" --label "$LABEL" --body-file "$body"
          fi
