name: Unsafe Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unsafe-scan:
    name: Enforce production unsafe boundary
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: "-D warnings"
          build-warnings: ""

      - name: Reject unreviewed unsafe production code
        env:
          RUSTFLAGS: -Dunsafe-code
        run: cargo check --workspace --all-features --lib --bins

      - name: Verify the reviewed exception allowlist
        run: |
          actual="$(
            grep -rn -l '#\[allow(unsafe_code)\]' \
              rullst*/src cargo-rullst/src rullst/src 2>/dev/null |
              sort
          )"
          expected="$(printf '%s\n' \
            'cargo-rullst/src/update/cache/windows_acl.rs' \
            'rullst-core/src/radar.rs' \
            'rullst-core/src/server/dylib_loader.rs' |
            sort)"
          if [ "$actual" != "$expected" ]; then
            echo "The reviewed unsafe exception allowlist changed:"
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

      - name: Publish the audited unsafe inventory
        run: |
          grep -En -n 'unsafe\s*(\{|fn|impl|trait|extern)' \
            cargo-rullst/src/update/cache/windows_acl.rs \
            rullst-core/src/radar.rs \
            rullst-core/src/server/dylib_loader.rs
