name: Unsafe Policy

on:
  push:
    branches: [main, v12, v13]
  pull_request:
    branches: [main, v12, v13]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unsafe-scan:
    name: Enforce production unsafe boundary
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          cache-on-failure: false

      - name: Reject unreviewed unsafe production code
        env:
          RUSTFLAGS: -Dunsafe-code
        run: cargo check --workspace --all-features --lib --bins

      - name: Verify the reviewed exception allowlist
        # Any `unsafe_code` inside allow/expect/warn, alone or among other
        # lints, through cfg_attr or over several lines, in any workspace
        # member or manifest, overrides -Dunsafe-code; the list is in the script.
        run: |
          python3 .github/test-check-unsafe-allowlist.py
          python3 .github/check-unsafe-allowlist.py

      - name: Publish the audited unsafe inventory
        run: |
          mapfile -t reviewed < <(python3 .github/check-unsafe-allowlist.py --list)
          grep -En -n 'unsafe\s*(\{|fn|impl|trait|extern)' "${reviewed[@]}"
