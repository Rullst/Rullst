name: TangleGuard Architecture Linter

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tangleguard:
    name: Architecture Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run TangleGuard Architecture Validation
        uses: TangleGuard/github-action@44130828f84df10ed841645208ec49ffdcbb959f # main
        with:
          language: "rust"
          fail_on_findings: "true"
