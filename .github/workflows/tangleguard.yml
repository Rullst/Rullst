name: TangleGuard Architecture Linter

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  tangleguard:
    name: Architecture Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run TangleGuard Architecture Validation
        uses: TangleGuard/github-action@44130828f84df10ed841645208ec49ffdcbb959f # main
        with:
          language: "rust"
          fail_on_findings: "true"
