name: Property Testing

on:
  schedule:
    - cron: '0 6 * * 0'  # Every Sunday at 06:00 UTC (avoids GitHub Actions weekend congestion)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proptest:
    name: Run Proptests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: stable

      - name: Run Proptests — all features (unit + integration)
        # --all-features activates strict-* flags simultaneously, which correctly
        # excludes the rullst-orm proptest_builder (it uses sqlite and needs no
        # strict features). That test is covered in the dedicated step below.
        env:
          PROPTEST_CASES: 10000
        run: cargo test --workspace --all-features --release

      - name: Run Proptests — ORM query builder (sqlite, no strict features)
        # proptest_builder.rs has #![cfg(not(any(feature = "strict-postgres",
        # feature = "strict-mysql")))] so it must run without those features.
        env:
          PROPTEST_CASES: 10000
        run: cargo test -p rullst-orm --test proptest_builder --release

      - name: Run Proptests — rullst-connect PKCE (embedded unit test)
        env:
          PROPTEST_CASES: 10000
        run: cargo test -p rullst-connect --lib --release
