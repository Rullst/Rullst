name: Property Testing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'  # Every Sunday at 06:00 UTC (weekly scheduled invariant audit)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: rullst-ci-v1

jobs:
  release-regression:
    name: Release-mode regression (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - workspace
          - cli-standard
          - cli-profiles
          - cli-lms
          - cli-saas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Install Rust Stable
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.98.1
          # The CLI release shards materialize fresh applications and enforce
          # their generated source with `cargo clippy -- -D warnings`.
          components: clippy
          cache: false

      - name: Run all-feature release regression shard
        # --all-features activates strict-* flags simultaneously, which correctly
        # excludes the rullst-orm proptest_builder (it uses sqlite and needs no
        # strict features). That test is covered in the dedicated step below.
        env:
          PROPTEST_CASES: 10000
        run: bash .github/run-workspace-test-shard.sh "${{ matrix.shard }}" --release

  proptest:
    name: Run dedicated property contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Install Rust Stable
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.98.1
          cache: false

      - name: Run Proptests — ORM query builder (sqlite, no strict features)
        # proptest_builder.rs has #![cfg(not(any(feature = "strict-postgres",
        # feature = "strict-mysql")))] so it must run without those features.
        env:
          PROPTEST_CASES: 10000
        run: cargo test -p rullst-orm --test proptest_builder --release

      - name: Run Proptests — rullst-connect PKCE (embedded unit test)
        env:
          PROPTEST_CASES: 10000
        run: cargo test -p rullst-connect --lib --release

      - name: Run Proptests — Security & Auth (AES-GCM, Vault, CSRF, Token)
        env:
          PROPTEST_CASES: 10000
        run: cargo test -p rullst-security -p rullst-auth --release
