name: IoT Integration Tests (QEMU)

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  iot-unit-tests:
    name: rullst-iot Unit Tests & OTA Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable

      - name: Run unit & OTA signature tests
        run: cargo test -p rullst-iot --all-features

  iot-no-std-qemu:
    name: rullst-iot no_std Cortex-M Target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust + ARM target
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Build no_std binary (Cortex-M4)
        run: |
          cargo build -p rullst-iot \
            --target thumbv7em-none-eabihf \
            --no-default-features \
            --release

      - name: Report no_std build status
        run: echo "rullst-iot no_std Cortex-M build complete."

