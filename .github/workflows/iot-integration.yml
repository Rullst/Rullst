name: IoT Helpers & Signed OTA Verification

on:
  push:
    branches: [main, v12, v13]
  pull_request:
    branches: [main, v12, v13]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  iot-unit-tests:
    name: rullst-iot Unit Tests & OTA Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          cache-on-failure: false

      - name: Run helper, simulator-boundary, and signed OTA tests
        run: cargo test -p rullst-iot --all-features

  iot-no-std-build:
    name: rullst-iot no_std Cortex-M Target
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain (with target)
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          target: thumbv7em-none-eabihf
          cache-on-failure: false

      - name: Add ARM target
        run: rustup target add thumbv7em-none-eabihf

      - name: Build no_std library (Cortex-M4)
        run: |
          cargo build -p rullst-iot \
            --target thumbv7em-none-eabihf \
            --no-default-features \
            --release

      - name: Report no_std build status
        run: echo "rullst-iot no_std Cortex-M build complete."

  iot-microbit-firmware:
    # Links and sizes a real no_std firmware (global allocator, panic handler,
    # cortex-m-rt) that runs the rullst-iot suite on a BBC micro:bit V2; the
    # library build above does not link. Running it needs the board (see the
    # fixture's src/main.rs); CI only builds it.
    name: rullst-iot micro:bit V2 Firmware Fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain (with target)
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: "-D warnings"
          build-warnings: ""
          target: thumbv7em-none-eabihf
          components: llvm-tools-preview
          cache-on-failure: false

      - name: Check the host-generated vectors are current
        run: |
          cargo run --locked --release \
            --manifest-path .github/fixtures/iot-microbit-v2/vectors/Cargo.toml
          git diff --exit-code -- .github/fixtures/iot-microbit-v2/firmware/src/expected.rs

      - name: Build the firmware for thumbv7em-none-eabihf
        working-directory: .github/fixtures/iot-microbit-v2/firmware
        run: cargo build --release --locked

      - name: Report flash and RAM use
        working-directory: .github/fixtures/iot-microbit-v2/firmware
        run: |
          size="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-size"
          elf=target/thumbv7em-none-eabihf/release/rullst-iot-microbit-v2
          "$size" -A "$elf" | grep -E '^(section|\.vector_table|\.text|\.rodata|\.data|\.bss|\.uninit) '
          {
            echo '### rullst-iot micro:bit V2 firmware (release)'
            echo
            echo 'Flash is text (vector table, code and read-only data, including a'
            echo '32 KiB test image); RAM is data + bss (a 32 KiB heap and a 32 KiB'
            echo 'test buffer); the stack takes the rest of the 128 KiB.'
            echo
            echo '```'
            "$size" "$elf"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
