name: IoT Helpers & Signed OTA Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  iot-unit-tests:
    name: rullst-iot Unit Tests & OTA Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Run helper, simulator-boundary, and signed OTA tests
        run: cargo test -p rullst-iot --all-features

  iot-no-std-build:
    name: rullst-iot no_std Cortex-M Target
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain (with target)
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: thumbv7em-none-eabihf

      - name: Add ARM target
        run: rustup target add thumbv7em-none-eabihf

      - name: Build no_std library (Cortex-M4)
        run: |
          cargo build -p rullst-iot \
            --target thumbv7em-none-eabihf \
            --no-default-features \
            --release

      - name: Report no_std build status
        run: echo "rullst-iot no_std Cortex-M build complete."
