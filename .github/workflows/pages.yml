name: Deploy Sites to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install mdBook
        run: cargo install mdbook

      - name: Build mdBook (Main Docs)
        run: mdbook build docs

      - name: Assemble Final Site
        run: |
          mkdir -p public_site

          # Root landing page
          cp docs/home_template.html public_site/index.html

          # mdBook
          mkdir -p public_site/book
          cp -r docs/book/* public_site/book/ || true
          cp docs/Rullst.png public_site/ || true

      - name: Fetch Benchmark Data from gh-pages
        run: |
          mkdir -p public_site/benches
          mkdir -p public_site/benches/orm
          mkdir -p public_site/benches/core
          mkdir -p public_site/benches/auth
          mkdir -p public_site/benches/connect

          git fetch origin gh-pages || true

          # ── rullst core bench ──────────────────────────────────────────────────
          git checkout origin/gh-pages -- benches/data.js 2>/dev/null \
            && mv benches/data.js public_site/benches/data.js || true
          cp docs/benches_template.html public_site/benches/index.html

          # ── rullst-orm bench ───────────────────────────────────────────────────
          git checkout origin/gh-pages -- benches-orm/data.js 2>/dev/null \
            && mv benches-orm/data.js public_site/benches/orm/data.js || true
          cp docs/benches_orm_template.html public_site/benches/orm/index.html

          # ── rullst-core primitives bench ───────────────────────────────────────
          git checkout origin/gh-pages -- benches-core/data.js 2>/dev/null \
            && mv benches-core/data.js public_site/benches/core/data.js || true
          cp docs/benches_core_template.html public_site/benches/core/index.html

          # ── rullst-auth bench ──────────────────────────────────────────────────
          git checkout origin/gh-pages -- benches-auth/data.js 2>/dev/null \
            && mv benches-auth/data.js public_site/benches/auth/data.js || true
          cp docs/benches_auth_template.html public_site/benches/auth/index.html

          # ── rullst-connect bench ───────────────────────────────────────────────
          git checkout origin/gh-pages -- benches-connect/data.js 2>/dev/null \
            && mv benches-connect/data.js public_site/benches/connect/data.js || true
          cp docs/benches_connect_template.html public_site/benches/connect/index.html

          # ── rullst-security bench ──────────────────────────────────────────────
          mkdir -p public_site/benches/security
          git checkout origin/gh-pages -- benches-security/data.js 2>/dev/null \
            && mv benches-security/data.js public_site/benches/security/data.js || true
          cp docs/benches_security_template.html public_site/benches/security/index.html

          # ── rullst-ai bench ────────────────────────────────────────────────────
          mkdir -p public_site/benches/ai
          git checkout origin/gh-pages -- benches-ai/data.js 2>/dev/null \
            && mv benches-ai/data.js public_site/benches/ai/data.js || true
          cp docs/benches_ai_template.html public_site/benches/ai/index.html

          # ── rullst-capital bench ───────────────────────────────────────────────
          mkdir -p public_site/benches/capital
          git checkout origin/gh-pages -- benches-capital/data.js 2>/dev/null \
            && mv benches-capital/data.js public_site/benches/capital/data.js || true
          cp docs/benches_capital_template.html public_site/benches/capital/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./public_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
