name: Mutation Testing (manual informational)
run-name: "Mutation testing: ${{ inputs.mode }} ${{ inputs.file }} ${{ inputs.mode == 'targeted' && inputs.test_scope || '' }} ${{ inputs.mode == 'contract' && inputs.contract || '' }} ${{ inputs.mode == 'contract' && inputs.mutants_regex != '.' && inputs.mutants_regex || '' }} ${{ inputs.shard }}"

on:
  workflow_dispatch: # STRICTLY MANUAL TRIGGER ONLY
    inputs:
      mode:
        description: Full campaign, one changed file, one owned-server contract, or exact-run recovery
        required: true
        default: full
        type: choice
        options:
          - full
          - targeted
          - contract
          - resume
          - finalize
      file:
        description: Repository-relative .rs file (required only for targeted mode)
        required: false
        type: string
      source_sha:
        description: Optional full-mode ancestor commit to measure with this workflow
        required: false
        type: string
      resume_run_id:
        description: Failed full-campaign run ID (required only for resume mode)
        required: false
        type: string
      resume_shards:
        description: Comma-separated failed shard indexes, for example 2,4,65
        required: false
        type: string
      test_scope:
        description: >-
          Targeted mode only. package runs the mutated package's whole test
          suite; lib runs only its library unit tests (cargo test --lib), so a
          mutant caught only by an integration test can be reported as missed
        required: false
        default: package
        type: choice
        options:
          - package
          - lib
      timeout_seconds:
        description: Targeted mode only. Per-mutant test timeout, also applied to the baseline (30-3600)
        required: false
        default: "300"
        type: string
      shard:
        description: Targeted and contract modes. Optional k/n slice of the mutants (n at most 16), for runs too slow for one job
        required: false
        type: string
      contract:
        description: >-
          Contract mode only. The wrapper that owns a disposable PostgreSQL,
          MySQL or Redis server; its adapter files are mutated and only its contract
          tests run against that server
        required: false
        default: none
        type: choice
        options:
          - none
          - passkey-postgres
          - auth-recovery-postgres
          - privacy-postgres
          - mail-postgres
          - recurring-postgres
          - messaging-redis
          - connect-sql
      mutants_regex:
        description: Contract mode only. cargo-mutants --re filter over the contract's mutants
        required: false
        default: "."
        type: string

concurrency:
  # Targeted and contract runs are independent diagnostics, so each file or
  # contract slice gets its own group; campaign and recovery modes keep the
  # shared per-ref group.
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.mode == 'targeted' && format('-targeted-{0}-{1}-{2}', inputs.file, inputs.test_scope, inputs.shard) || inputs.mode == 'contract' && format('-contract-{0}-{1}-{2}', inputs.contract, inputs.mutants_regex, inputs.shard) || '' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: rullst-mutants-v1
  SCCACHE_GHA_RW_MODE: READ_WRITE

jobs:
  plan:
    name: Validate mutation campaign scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      mode: ${{ steps.plan.outputs.mode }}
      file: ${{ steps.plan.outputs.file }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      artifact_count: ${{ steps.plan.outputs.artifact_count }}
      resume_run_id: ${{ steps.plan.outputs.resume_run_id }}
      resume_shards: ${{ steps.plan.outputs.resume_shards }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      provenance: ${{ steps.plan.outputs.provenance }}
      expected_inventory_sha256: ${{ steps.plan.outputs.expected_inventory_sha256 }}
      secondary_resume_run_id: ${{ steps.plan.outputs.secondary_resume_run_id }}
      incomplete_fragment_artifact: ${{ steps.plan.outputs.incomplete_fragment_artifact }}
      test_timeout_seconds: ${{ steps.plan.outputs.test_timeout_seconds }}
      build_timeout_seconds: ${{ steps.plan.outputs.build_timeout_seconds }}
      test_scope: ${{ steps.plan.outputs.test_scope }}
      targeted_shard: ${{ steps.plan.outputs.targeted_shard }}
      contract: ${{ steps.plan.outputs.contract }}
      mutants_regex: ${{ steps.plan.outputs.mutants_regex }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test exact-run recovery policy
        run: |
          python3 .github/test-plan-mutation-resume.py
          python3 .github/test-resolve-mutation-source.py

      - name: Export strict mutation scope
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_MODE: ${{ inputs.mode }}
          MUTATION_FILE: ${{ inputs.file }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          RESUME_SHARDS: ${{ inputs.resume_shards }}
          TEST_SCOPE: ${{ inputs.test_scope }}
          TARGETED_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          TARGETED_SHARD: ${{ inputs.shard }}
          CONTRACT: ${{ inputs.contract }}
          MUTANTS_REGEX: ${{ inputs.mutants_regex }}
        run: |
          resume_run_id=""
          test_scope="${TEST_SCOPE:-package}"
          if [ "$test_scope" != "package" ] && [ "$test_scope" != "lib" ]; then
            echo "test_scope must be package or lib." >&2
            exit 2
          fi
          if [ "$MUTATION_MODE" != "targeted" ] && [ "$test_scope" != "package" ]; then
            echo "Only targeted mode accepts a narrowed test scope." >&2
            exit 2
          fi
          targeted_shard="${TARGETED_SHARD:-}"
          if [ -n "$targeted_shard" ]; then
            if [ "$MUTATION_MODE" != "targeted" ] && [ "$MUTATION_MODE" != "contract" ]; then
              echo "Only targeted and contract modes accept a shard slice." >&2
              exit 2
            fi
            if [[ ! "$targeted_shard" =~ ^([0-9]|1[0-5])/([1-9]|1[0-6])$ ]] \
              || [ "${targeted_shard%/*}" -ge "${targeted_shard#*/}" ]; then
              echo "shard must be k/n with 0 <= k < n <= 16." >&2
              exit 2
            fi
          fi
          contract="${CONTRACT:-none}"
          mutants_regex="${MUTANTS_REGEX:-.}"
          if [ "$MUTATION_MODE" != "contract" ] \
            && { [ "$contract" != "none" ] || [ "$mutants_regex" != "." ]; }; then
            echo "Only contract mode accepts a contract and a mutant regex." >&2
            exit 2
          fi
          resume_shards=""
          source_sha=$(python3 .github/resolve-mutation-source.py \
            "$MUTATION_MODE" "$REQUESTED_SOURCE_SHA" "$GITHUB_SHA")
          artifact_count=1
          expected_inventory_sha256=""
          secondary_resume_run_id=""
          incomplete_fragment_artifact=""
          test_timeout_seconds=""
          build_timeout_seconds=""
          provenance=$(jq -cn \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_path ".github/workflows/mutants.yml" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg head_branch "$GITHUB_REF_NAME" \
            --arg source_sha "$source_sha" \
            --arg workflow_source_sha "$GITHUB_SHA" \
            --arg mode "$MUTATION_MODE" \
            --arg cargo_mutants_version "27.1.0" \
            '{schema: 1, repository: $repository, workflow_path: $workflow_path,
              run_id: $run_id, run_attempt: $run_attempt,
              head_branch: $head_branch, source_sha: $source_sha, mode: $mode,
              workflow_source_sha: $workflow_source_sha,
              cargo_mutants_version: $cargo_mutants_version}')
          case "$MUTATION_MODE" in
            full)
              if [ -n "$MUTATION_FILE" ] || [ -n "$RESUME_RUN_ID" ] || [ -n "$RESUME_SHARDS" ]; then
                echo "Full mode covers the workspace; leave file and resume inputs empty." >&2
                exit 2
              fi
              # Discover this source's complete inventory before execution.
              # Retain the 80-way partition, with only four concurrent jobs,
              # so informational work does not occupy the whole CI queue.
              shard_count=80
              matrix=$(jq -cn --argjson count "$shard_count" \
                '{include: [range(0; $count) | {index: ., count: $count, artifact: tostring}]}')
              artifact_count="$shard_count"
              ;;
            targeted)
              if [ -n "$RESUME_RUN_ID" ] || [ -n "$RESUME_SHARDS" ]; then
                echo "Targeted mode does not accept resume inputs." >&2
                exit 2
              fi
              if [[ ! "$MUTATION_FILE" =~ ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*\.rs$ \
                || "$MUTATION_FILE" == *".."* \
                || "$MUTATION_FILE" == tests/* \
                || "$MUTATION_FILE" == */tests/* \
                || ! -f "$MUTATION_FILE" ]]; then
                echo "Targeted mode requires one existing production .rs path." >&2
                exit 2
              fi
              if ! git ls-files --error-unmatch -- "$MUTATION_FILE" >/dev/null; then
                echo "Targeted mutation path must be tracked by Git." >&2
                exit 2
              fi
              # Bound every targeted run explicitly. The automatic timeout is
              # five times the baseline, which let one hanging mutant of a
              # slow package consume hours of the job budget. The explicit
              # test timeout also applies to the unmutated baseline.
              targeted_timeout="${TARGETED_TIMEOUT_SECONDS:-300}"
              if [[ ! "$targeted_timeout" =~ ^[1-9][0-9]{1,3}$ ]] \
                || [ "$targeted_timeout" -lt 30 ] \
                || [ "$targeted_timeout" -gt 3600 ]; then
                echo "timeout_seconds must be an integer from 30 to 3600." >&2
                exit 2
              fi
              test_timeout_seconds="$targeted_timeout"
              build_timeout_seconds=300
              shard_count=1
              matrix='{"include":[{"index":0,"count":1,"artifact":"0"}]}'
              ;;
            contract)
              if [ -n "$MUTATION_FILE" ] || [ -n "$RESUME_RUN_ID" ] || [ -n "$RESUME_SHARDS" ]; then
                echo "Contract mode mutates its wrapper's adapter files; leave file and resume inputs empty." >&2
                exit 2
              fi
              case "$contract" in
                passkey-postgres|auth-recovery-postgres|privacy-postgres|mail-postgres|recurring-postgres|messaging-redis|connect-sql)
                  ;;
                *)
                  echo "Contract mode requires one of the owned-server wrappers." >&2
                  exit 2
                  ;;
              esac
              if [ "${#mutants_regex}" -gt 200 ] || [[ "$mutants_regex" == *$'\n'* ]]; then
                echo "mutants_regex must be one line of at most 200 characters." >&2
                exit 2
              fi
              # The wrapper owns the inventory, timeouts and the server, so the
              # workspace inventory, matrix and aggregate jobs do not run.
              shard_count=1
              matrix='{"include":[{"index":0,"count":1,"artifact":"contract"}]}'
              ;;
            resume)
              if [ -n "$MUTATION_FILE" ]; then
                echo "Resume mode restores a full campaign; leave file empty." >&2
                exit 2
              fi
              if [[ ! "$RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
                echo "Resume mode requires a numeric failed workflow run ID." >&2
                exit 2
              fi
              shard_count=80
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_RUN_ID}" \
                > "$RUNNER_TEMP/mutation-resume-run.json"
              python3 .github/plan-mutation-resume.py \
                --run-json "$RUNNER_TEMP/mutation-resume-run.json" \
                --policy-json .github/mutation-recovery-policy.json \
                --shards "$RESUME_SHARDS" \
                > "$RUNNER_TEMP/mutation-resume-plan.json"
              source_sha=$(jq -er '.source_sha' \
                "$RUNNER_TEMP/mutation-resume-plan.json")
              matrix=$(jq -c '.matrix' "$RUNNER_TEMP/mutation-resume-plan.json")
              artifact_count=$(jq -er '.artifact_count' \
                "$RUNNER_TEMP/mutation-resume-plan.json")
              MUTATION_MODE=full
              resume_run_id="$RESUME_RUN_ID"
              resume_shards=$(jq -er '.resume_shards' \
                "$RUNNER_TEMP/mutation-resume-plan.json")
              expected_inventory_sha256=$(jq -er '.provenance.inventory_sha256' \
                "$RUNNER_TEMP/mutation-resume-plan.json")
              provenance=$(jq -c '.provenance' \
                "$RUNNER_TEMP/mutation-resume-plan.json")
              ;;
            finalize)
              if [ -n "$MUTATION_FILE" ] || [ -n "$RESUME_RUN_ID" ] || [ -n "$RESUME_SHARDS" ]; then
                echo "Finalization is fully bound by the reviewed recovery policy; leave all optional inputs empty." >&2
                exit 2
              fi
              shard_count=80
              resume_run_id=$(jq -er '.run_id' .github/mutation-recovery-policy.json)
              secondary_resume_run_id=$(jq -er '.finalization.run_id' \
                .github/mutation-recovery-policy.json)
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${resume_run_id}" \
                > "$RUNNER_TEMP/mutation-original-run.json"
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${secondary_resume_run_id}" \
                > "$RUNNER_TEMP/mutation-recovery-run.json"
              python3 .github/plan-mutation-resume.py \
                --run-json "$RUNNER_TEMP/mutation-original-run.json" \
                --recovery-run-json "$RUNNER_TEMP/mutation-recovery-run.json" \
                --policy-json .github/mutation-recovery-policy.json \
                > "$RUNNER_TEMP/mutation-finalization-plan.json"
              source_sha=$(jq -er '.source_sha' \
                "$RUNNER_TEMP/mutation-finalization-plan.json")
              matrix=$(jq -c '.matrix' \
                "$RUNNER_TEMP/mutation-finalization-plan.json")
              artifact_count=$(jq -er '.artifact_count' \
                "$RUNNER_TEMP/mutation-finalization-plan.json")
              resume_shards=$(jq -er '.resume_shards' \
                "$RUNNER_TEMP/mutation-finalization-plan.json")
              incomplete_fragment_artifact=$(jq -er '.incomplete_fragment_artifact' \
                "$RUNNER_TEMP/mutation-finalization-plan.json")
              test_timeout_seconds=$(jq -er '.test_timeout_seconds' \
                "$RUNNER_TEMP/mutation-finalization-plan.json")
              build_timeout_seconds=$(jq -er '.build_timeout_seconds' \
                "$RUNNER_TEMP/mutation-finalization-plan.json")
              expected_inventory_sha256=$(jq -er '.provenance.inventory_sha256' \
                "$RUNNER_TEMP/mutation-finalization-plan.json")
              provenance=$(jq -c '.provenance' \
                "$RUNNER_TEMP/mutation-finalization-plan.json")
              MUTATION_MODE=full
              ;;
            *)
              echo "Unsupported mutation campaign mode: $MUTATION_MODE" >&2
              exit 2
              ;;
          esac

          {
            echo "matrix=$matrix"
            echo "mode=$MUTATION_MODE"
            echo "file=$MUTATION_FILE"
            echo "shard_count=$shard_count"
            echo "artifact_count=$artifact_count"
            echo "resume_run_id=$resume_run_id"
            echo "resume_shards=$resume_shards"
            echo "source_sha=$source_sha"
            echo "provenance=$provenance"
            echo "expected_inventory_sha256=$expected_inventory_sha256"
            echo "secondary_resume_run_id=$secondary_resume_run_id"
            echo "incomplete_fragment_artifact=$incomplete_fragment_artifact"
            echo "test_timeout_seconds=$test_timeout_seconds"
            echo "build_timeout_seconds=$build_timeout_seconds"
            echo "test_scope=$test_scope"
            echo "targeted_shard=$targeted_shard"
            echo "contract=$contract"
            echo "mutants_regex=$mutants_regex"
          } >> "$GITHUB_OUTPUT"

  inventory:
    name: Verify mutation inventory before execution
    needs: plan
    if: needs.plan.outputs.mode != 'contract'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      inventory_sha256: ${{ steps.inventory.outputs.inventory_sha256 }}
      inventory_count: ${{ steps.inventory.outputs.inventory_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: 1.99.1

      - name: Install cargo-mutants
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-mutants@27.1.0

      - name: Discover and validate the exact candidate inventory
        id: inventory
        shell: bash
        env:
          MUTATION_MODE: ${{ needs.plan.outputs.mode }}
          MUTATION_FILE: ${{ needs.plan.outputs.file }}
          TARGETED_SHARD: ${{ needs.plan.outputs.targeted_shard }}
          EXPECTED_INVENTORY_SHA256: ${{ needs.plan.outputs.expected_inventory_sha256 }}
        run: |
          command=(cargo mutants --workspace --all-features --list --json)
          if [ "$MUTATION_MODE" = "targeted" ]; then
            command+=(--file "$MUTATION_FILE")
            if [ -n "$TARGETED_SHARD" ]; then
              command+=(--shard "$TARGETED_SHARD")
            fi
          fi
          "${command[@]}" > mutation-inventory.json

          jq -e '
            type == "array" and
            length > 0 and
            all(.[]; .name | type == "string" and length > 0) and
            ([.[].name] | unique | length) == length
          ' mutation-inventory.json >/dev/null
          inventory_count=$(jq 'length' mutation-inventory.json)
          inventory_sha256=$(sha256sum mutation-inventory.json | awk '{print $1}')
          if [ -n "$EXPECTED_INVENTORY_SHA256" ] \
            && [ "$inventory_sha256" != "$EXPECTED_INVENTORY_SHA256" ]; then
            echo "Mutation inventory digest differs from the reviewed recovery policy." >&2
            exit 1
          fi
          echo "inventory_sha256=$inventory_sha256" >> "$GITHUB_OUTPUT"
          echo "inventory_count=$inventory_count" >> "$GITHUB_OUTPUT"
          echo "Validated $inventory_count unique mutation candidates before execution."

      - name: Upload reviewed mutation inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-inventory
          path: mutation-inventory.json
          if-no-files-found: error
          retention-days: 30

  mutants:
    permissions:
      contents: read
    name: cargo-mutants informational shard ${{ matrix.index }}/${{ matrix.count }}
    needs: [plan, inventory]
    if: needs.plan.outputs.mode != 'contract'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # The RULLST_TEST_REDIS_URL contracts of the all-feature build (Security
    # rate limit, Core cache inspection) run in the baseline and for every
    # mutant, as in ci.yml. The ORM query-cache and hash-scope ones need the
    # non-strict pool, so the all-feature build compiles them out.
    services:
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false

      - name: Set up content-addressed compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: 1.99.1

      - name: Install cargo-mutants
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-mutants@27.1.0

      - name: Prefetch the frozen workspace dependency graph
        # Materialized CLI tests copy the workspace lockfile and deliberately
        # validate generated projects offline. A fresh mutation runner must
        # therefore fetch every locked package before cargo-mutants performs
        # its unmutated baseline; sccache contains compiler outputs, not Cargo
        # registry sources.
        run: cargo fetch --locked

      - name: Run mutants shard on whole workspace
        # We test the same entire workspace inventory in smaller shards so each
        # result and artifact stays within the bounded runner budget.
        # Exit 2 (missed) and 3 (timed out) are valid informational findings.
        # Baseline/usage/internal failures remain real workflow failures.
        shell: bash
        env:
          MUTATION_MODE: ${{ needs.plan.outputs.mode }}
          MUTATION_FILE: ${{ needs.plan.outputs.file }}
          SHARD_INDEX: ${{ matrix.index }}
          SHARD_COUNT: ${{ matrix.count }}
          TEST_TIMEOUT_SECONDS: ${{ needs.plan.outputs.test_timeout_seconds }}
          BUILD_TIMEOUT_SECONDS: ${{ needs.plan.outputs.build_timeout_seconds }}
          TEST_SCOPE: ${{ needs.plan.outputs.test_scope }}
          TARGETED_SHARD: ${{ needs.plan.outputs.targeted_shard }}
          RULLST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          # Keep the release feature surface explicit in hosted logs as well as
          # in .cargo/mutants.toml, which applies the same policy locally.
          command=(cargo mutants --workspace --in-place --all-features)
          if [ "$MUTATION_MODE" = "full" ]; then
            command+=(--shard "$SHARD_INDEX/$SHARD_COUNT")
          else
            command+=(--file "$MUTATION_FILE")
            if [ -n "$TARGETED_SHARD" ]; then
              command+=(--shard "$TARGETED_SHARD")
            fi
          fi
          if [ -n "$TEST_TIMEOUT_SECONDS" ]; then
            command+=(--timeout "$TEST_TIMEOUT_SECONDS")
          fi
          if [ -n "$BUILD_TIMEOUT_SECONDS" ]; then
            command+=(--build-timeout "$BUILD_TIMEOUT_SECONDS")
          fi
          if [ "$MUTATION_MODE" = "targeted" ]; then
            # Cap each test binary's address space (8 GiB). A mutant that
            # allocates without bound then aborts its own test process, which
            # counts as caught, instead of exhausting the runner's memory and
            # losing the whole job. Compilers and linkers are not capped.
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="prlimit --as=8589934592 --"
          fi
          if [ "$MUTATION_MODE" = "targeted" ] && [ "$TEST_SCOPE" = "lib" ]; then
            # Library unit tests only: avoids rebuilding generated projects in
            # slow integration suites, at the cost of reporting mutants that
            # only an integration test catches as missed.
            command+=(-- --lib)
          fi

          set +e
          "${command[@]}"
          mutation_status=$?
          set -e
          case "$mutation_status" in
            0|2|3)
              echo "cargo-mutants completed with informational status $mutation_status"
              ;;
            *)
              echo "cargo-mutants failed before producing valid findings (status $mutation_status)" >&2
              exit "$mutation_status"
              ;;
          esac

      - name: Upload shard results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-out-${{ matrix.artifact }}
          path: mutants.out/
          if-no-files-found: error
          retention-days: 30

  contract:
    permissions:
      contents: read
    name: cargo-mutants contract ${{ needs.plan.outputs.contract }} ${{ needs.plan.outputs.targeted_shard }}
    needs: plan
    if: needs.plan.outputs.mode == 'contract'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      # One build directory serves every mutant, so incremental rebuilds of
      # the mutated crate and its few test binaries are much faster than
      # cached full ones. sccache refuses incremental compilation, so this job
      # compiles without it. Debug info only slows linking.
      RUSTC_WRAPPER: ""
      CARGO_INCREMENTAL: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: 1.99.1

      - name: Install cargo-mutants
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-mutants@27.1.0

      - name: Prefetch the frozen workspace dependency graph
        # The wrappers run cargo-mutants with --locked --offline.
        run: cargo fetch --locked

      - name: Run the contract's mutants against its owned server
        # The wrapper starts its disposable server, mutates its adapter files
        # and runs only its exercise-phase contract tests, resetting the server
        # before every test binary. Exit 2 (missed) and 3 (timed out) are
        # informational findings; a broken baseline, a reset failure, a
        # contract test the baseline did not run or a server failure is not.
        shell: bash
        env:
          CONTRACT: ${{ needs.plan.outputs.contract }}
          MUTANTS_REGEX: ${{ needs.plan.outputs.mutants_regex }}
          TARGETED_SHARD: ${{ needs.plan.outputs.targeted_shard }}
          # The 8 GiB test-binary cap of targeted runs; the wrapper keeps it
          # behind its own runner.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: prlimit --as=8589934592 --
        run: |
          case "$CONTRACT" in
            passkey-postgres|auth-recovery-postgres|privacy-postgres|mail-postgres|recurring-postgres|messaging-redis|connect-sql)
              ;;
            *)
              echo "Unknown owned-server contract: $CONTRACT" >&2
              exit 2
              ;;
          esac
          command=(python3 ".github/check-$CONTRACT.py" --mutants "$MUTANTS_REGEX")
          if [ -n "$TARGETED_SHARD" ]; then
            command+=(--shard "$TARGETED_SHARD")
          fi

          set +e
          "${command[@]}"
          mutation_status=$?
          set -e
          case "$mutation_status" in
            0|2|3)
              echo "cargo-mutants completed with informational status $mutation_status"
              ;;
            *)
              echo "The contract run failed before producing valid findings (status $mutation_status)" >&2
              exit "$mutation_status"
              ;;
          esac

      - name: Verify and summarize contract outcomes
        shell: bash
        env:
          CONTRACT: ${{ needs.plan.outputs.contract }}
        run: |
          outcomes=mutants.out/outcomes.json
          # Every listed mutant needs exactly one classification.
          jq -e '
            .total_mutants > 0 and
            ([.outcomes[] | select(.scenario | type == "object")] | length) == .total_mutants and
            (.caught + .missed + .timeout + .unviable) == .total_mutants
          ' "$outcomes" >/dev/null
          {
            echo "### Contract \`$CONTRACT\`"
            echo
            jq -r '"\(.total_mutants) mutants: \(.caught) caught, \(.missed) missed, \(.timeout) timed out, \(.unviable) unviable."' "$outcomes"
            for outcome in missed timeout; do
              if [ -s "mutants.out/$outcome.txt" ]; then
                echo
                echo "**$outcome:**"
                echo '```'
                cat "mutants.out/$outcome.txt"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload contract results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-out-contract
          path: mutants.out/
          if-no-files-found: error
          retention-days: 30

  aggregate-results:
    name: Verify and aggregate mutation artifacts
    if: needs.inventory.result == 'success' && needs.mutants.result == 'success'
    needs: [plan, inventory, mutants]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false

      - name: Download reusable artifacts from the interrupted campaign
        if: needs.plan.outputs.resume_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-out-*
          path: mutation-artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.plan.outputs.resume_run_id }}

      - name: Remove incomplete artifacts replaced by resumed shards
        if: needs.plan.outputs.resume_run_id != ''
        env:
          RESUME_SHARDS: ${{ needs.plan.outputs.resume_shards }}
        run: |
          IFS=',' read -ra shard_indexes <<< "$RESUME_SHARDS"
          for shard_index in "${shard_indexes[@]}"; do
            rm -rf -- "mutation-artifacts/mutants-out-${shard_index}"
          done

      - name: Download completed fragments from the first recovery
        if: needs.plan.outputs.secondary_resume_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-out-*
          path: mutation-artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.plan.outputs.secondary_resume_run_id }}

      - name: Remove the interrupted recovery fragment
        if: needs.plan.outputs.incomplete_fragment_artifact != ''
        env:
          INCOMPLETE_FRAGMENT_ARTIFACT: ${{ needs.plan.outputs.incomplete_fragment_artifact }}
        run: |
          if [[ ! "$INCOMPLETE_FRAGMENT_ARTIFACT" =~ ^resume-[0-9]+-[0-9]+$ ]]; then
            echo "Invalid incomplete fragment artifact identity." >&2
            exit 2
          fi
          rm -rf -- "mutation-artifacts/mutants-out-${INCOMPLETE_FRAGMENT_ARTIFACT}"

      - name: Download newly completed mutation shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-out-*
          path: mutation-artifacts

      - name: Download the reviewed mutation inventory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-inventory
          path: expected-mutation-inventory

      - name: Reject incomplete evidence and write aggregate
        env:
          MUTATION_MODE: ${{ needs.plan.outputs.mode }}
          ARTIFACT_COUNT: ${{ needs.plan.outputs.artifact_count }}
          EXPECTED_FULL_INVENTORY: ${{ needs.inventory.outputs.inventory_count }}
          CAMPAIGN_PROVENANCE: ${{ needs.plan.outputs.provenance }}
          INVENTORY_SHA256: ${{ needs.inventory.outputs.inventory_sha256 }}
        run: |
          expected_inventory=""
          if [ "$MUTATION_MODE" = "full" ]; then
            expected_inventory="$EXPECTED_FULL_INVENTORY"
          fi
          bash .github/summarize-mutation-artifacts.sh \
            mutation-artifacts "$MUTATION_MODE" "$ARTIFACT_COUNT" \
            "$expected_inventory" 27.1.0 \
            expected-mutation-inventory/mutation-inventory.json

          # shellcheck disable=SC2016 # jq programs intentionally own `$` names.
          jq -e 'type == "object"' <<< "$CAMPAIGN_PROVENANCE" >/dev/null
          # shellcheck disable=SC2016
          jq --arg inventory_sha256 "$INVENTORY_SHA256" \
            --argjson inventory_count "$(jq length expected-mutation-inventory/mutation-inventory.json)" \
            '. + {inventory_sha256: $inventory_sha256,
                  inventory_count: $inventory_count}' \
            <<< "$CAMPAIGN_PROVENANCE" > mutation-campaign-provenance.json
          # shellcheck disable=SC2016
          jq --slurpfile provenance mutation-campaign-provenance.json \
            '. + {campaign_provenance: $provenance[0]}' \
            mutation-summary.json > mutation-summary.with-provenance.json
          mv mutation-summary.with-provenance.json mutation-summary.json
          {
            echo
            echo "### Campaign provenance"
            echo
            printf -- "- Source: \`%s\` (\`%s\`)\n" \
              "$(jq -r .source_sha mutation-campaign-provenance.json)" \
              "$(jq -r .head_branch mutation-campaign-provenance.json)"
            printf -- "- Originating run: \`%s\`, attempt \`%s\`, workflow \`%s\`\n" \
              "$(jq -r .run_id mutation-campaign-provenance.json)" \
              "$(jq -r .run_attempt mutation-campaign-provenance.json)" \
              "$(jq -r .workflow_path mutation-campaign-provenance.json)"
            printf -- "- Inventory SHA-256: \`%s\`\n" "$INVENTORY_SHA256"
          } >> mutation-summary.md
          cat mutation-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified aggregate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-summary-${{ needs.plan.outputs.source_sha }}-${{ needs.inventory.outputs.inventory_sha256 }}
          path: |
            mutation-summary.json
            mutation-summary.md
            mutation-campaign-provenance.json
          if-no-files-found: error
          retention-days: 30

  evidence-boundary:
    name: Mutation campaign evidence boundary
    if: always()
    needs: [plan, inventory, mutants, aggregate-results, contract]
    runs-on: ubuntu-latest
    steps:
      - name: Record informational scope and infrastructure result
        env:
          MUTATION_MODE: ${{ needs.plan.outputs.mode }}
          INVENTORY_RESULT: ${{ needs.inventory.result }}
          MATRIX_RESULT: ${{ needs.mutants.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate-results.result }}
          MUTATION_FILE: ${{ needs.plan.outputs.file }}
          TEST_SCOPE: ${{ needs.plan.outputs.test_scope }}
          TARGETED_SHARD: ${{ needs.plan.outputs.targeted_shard }}
          SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
          ARTIFACT_COUNT: ${{ needs.plan.outputs.artifact_count }}
          RESUME_RUN_ID: ${{ needs.plan.outputs.resume_run_id }}
          RESUME_SHARDS: ${{ needs.plan.outputs.resume_shards }}
          SECONDARY_RESUME_RUN_ID: ${{ needs.plan.outputs.secondary_resume_run_id }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          INVENTORY_SHA256: ${{ needs.inventory.outputs.inventory_sha256 }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          CONTRACT: ${{ needs.plan.outputs.contract }}
          MUTANTS_REGEX: ${{ needs.plan.outputs.mutants_regex }}
        run: |
          if [ "$MUTATION_MODE" = "contract" ]; then
            {
              echo "## Mutation testing"
              echo
              echo "Mode: \`contract\`; contract result: \`$CONTRACT_RESULT\`."
              echo "Contract: \`$CONTRACT\`; regex: \`$MUTANTS_REGEX\`; slice: \`${TARGETED_SHARD:-all}\`; measured source: \`$SOURCE_SHA\`."
              echo "Only the wrapper's exercise-phase contract tests ran against its owned server, so a mutant that another test of the package catches can still be reported as missed. This is correction feedback, not a full-workspace campaign."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$CONTRACT_RESULT" != "success" ]; then
              exit 1
            fi
            exit 0
          fi
          {
            echo "## Mutation testing"
            echo
            echo "Mode: \`$MUTATION_MODE\`; inventory result: \`$INVENTORY_RESULT\`; matrix result: \`$MATRIX_RESULT\`; aggregate result: \`$AGGREGATE_RESULT\`."
            if [ "$MUTATION_MODE" = "targeted" ]; then
              echo "Targeted file: \`$MUTATION_FILE\`; test scope: \`$TEST_SCOPE\`; slice: \`${TARGETED_SHARD:-all}\`. This is correction feedback, not a full-workspace campaign."
              if [ "$TEST_SCOPE" = "lib" ]; then
                echo "Library-only scope can report a mutant as missed when only an integration test would catch it."
              fi
            else
              echo "The complete workspace was partitioned into $SHARD_COUNT shards. Missed and timed-out mutants remain informational findings in the artifacts."
              if [ -n "$RESUME_RUN_ID" ]; then
                printf "Resumed shards: %s; reused immutable artifacts from run %s; final aggregate requires %s complete artifacts.\n" \
                  "$RESUME_SHARDS" "$RESUME_RUN_ID" "$ARTIFACT_COUNT"
              fi
              if [ -n "$SECONDARY_RESUME_RUN_ID" ]; then
                printf "Completed recovery fragments reused from run %s.\n" \
                  "$SECONDARY_RESUME_RUN_ID"
              fi
              printf "Measured source: \`%s\`; inventory SHA-256: \`%s\`.\n" \
                "$SOURCE_SHA" "$INVENTORY_SHA256"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$INVENTORY_RESULT" != "success" ] \
            || [ "$MATRIX_RESULT" != "success" ] \
            || [ "$AGGREGATE_RESULT" != "success" ]; then
            exit 1
          fi
