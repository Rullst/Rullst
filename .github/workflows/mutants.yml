name: Mutation Testing (manual informational)

on:
  workflow_dispatch: # STRICTLY MANUAL TRIGGER ONLY

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mutants:
    permissions:
      contents: read
    name: cargo-mutants informational shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.98.1

      - name: Install cargo-mutants
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-mutants@27.1.0

      - name: Run mutants shard on whole workspace
        # We test the entire workspace, divided in 8 shards
        # Exit code 2 = missed mutants found; continue-on-error so CI doesn't
        # hard-fail — results are captured in the uploaded artifact for review.
        continue-on-error: true
        run: cargo mutants --workspace --shard ${{ matrix.shard }}/8 --in-place

      - name: Upload shard results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-out-${{ matrix.shard }}
          path: mutants.out/
