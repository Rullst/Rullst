name: TruffleHog Secret Scanner

on:
  push:
    branches: [main, v12]
  pull_request:
    branches: [main, v12]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Run weekly

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trufflehog:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required for TruffleHog to scan git history
          
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@288a8a8643a2c5a36b81d231c550dccfa0beeb64 # main @ 2026-09-10
        with:
          path: ./
          # Pin the scanner image as well as the composite Action wrapper.
          version: 3.97.4@sha256:562bc231afa9de3d04de44cfe624252b08207de1fc3cebc5e7ed92bed7f279e4
          extra_args: --debug --only-verified
