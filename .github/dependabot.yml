version: 2
# Main develops v13; v12 receives compatible stable maintenance.
# This configuration takes effect from the repository default branch.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    groups:
      # These crates share public types; update their adapter family together.
      opentelemetry-family:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # utoipa-swagger-ui requires the matching utoipa major; update them together.
      utoipa-family:
        patterns:
          - "utoipa"
          - "utoipa-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      safe-updates:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Review/test the tools together, including all CodeQL sub-actions.
    groups:
      ci-tools:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "v12"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    # v12 takes compatible maintenance only; majors are evaluated on main first.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Held for Smithy JSON 0.63 compatibility; see rullst-mail/Cargo.toml.
      - dependency-name: "aws-smithy-types"
    groups:
      opentelemetry-family:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
        update-types:
          - "major"
          - "minor"
          - "patch"
      safe-updates:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v12"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Review/test the tools together, including all CodeQL sub-actions.
    groups:
      ci-tools:
        patterns:
          - "*"
