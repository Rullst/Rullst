version: 2
updates:
  # Enable Cargo updates for the Rust workspace
  - package-ecosystem: "cargo"
    directory: "/"
    # Dependency PRs target the actively maintained v12 integration line.
    # The frozen v5 branch receives no routine dependency updates.
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    # Group minor and patch updates together in a single PR to reduce noise.
    # Breaking (major) updates will still be individual PRs.
    groups:
      safe-updates:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Action updates belong to the actively maintained v12 integration line.
    # The frozen v5 branch receives no routine workflow maintenance.
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
