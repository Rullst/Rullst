version: 2
# Main develops v13; v12 reached end of life on 16 October 2026 (no updates).
# This configuration takes effect from the repository default branch.
updates:
  - package-ecosystem: "cargo"
    # The fuzz workspaces keep their own Cargo.lock, which CI resolves with
    # --locked; listing them here puts their lockfile updates in the same
    # grouped pull request as the root lockfile.
    directories:
      - "/"
      - "/rullst-ai/fuzz"
      - "/rullst-capital/fuzz"
      - "/rullst-connect/fuzz"
      - "/rullst-iot/fuzz"
      - "/rullst-mail/fuzz"
      - "/rullst-nexus/fuzz"
      - "/rullst-orm/fuzz"
      - "/rullst-privacy/fuzz"
      - "/rullst-security/fuzz"
      - "/rullst-studio/fuzz"
      - "/rullst/fuzz"
      # The IoT firmware fixture builds with --locked on its own locks too.
      - "/.github/fixtures/iot-microbit-v2/firmware"
      - "/.github/fixtures/iot-microbit-v2/vectors"
      # The rullst.win site generator (site/) builds with --locked too.
      - "/site"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    groups:
      # These crates share public types; update their adapter family together.
      opentelemetry-family:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # utoipa-axum and other utoipa crates require the matching utoipa major; update them together.
      utoipa-family:
        patterns:
          - "utoipa"
          - "utoipa-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      safe-updates:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    # Outside the root, Dependabot reads only composite actions (action.yml),
    # so it does not bump the CI workflow that `cargo rullst new` writes
    # (cargo-rullst/src/generators/project/ci/.github/workflows/ci.yml) or the
    # one `cargo rullst add browser-tests` writes. They pin the same action
    # SHAs as Rullst's own workflows, and workflow-lint.yml and a cargo-rullst
    # test fail until `python3 .github/sync-template-action-pins.py` updates
    # them in the same pull request (MAINTAINING.md, section 3).
    directories:
      - "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Review/test the tools together, including all CodeQL sub-actions.
    groups:
      ci-tools:
        patterns:
          - "*"