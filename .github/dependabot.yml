version: 2
# Main develops v13; v12 reached end of life on 16 October 2026 (no updates).
# This configuration takes effect from the repository default branch.
updates:
  - package-ecosystem: "cargo"
    # The fuzz workspaces keep their own Cargo.lock, which CI resolves with
    # --locked; listing them here puts their lockfile updates in the same
    # grouped pull request as the root lockfile.
    directories:
      - "/"
      - "/rullst-ai/fuzz"
      - "/rullst-capital/fuzz"
      - "/rullst-connect/fuzz"
      - "/rullst-iot/fuzz"
      - "/rullst-mail/fuzz"
      - "/rullst-nexus/fuzz"
      - "/rullst-orm/fuzz"
      - "/rullst-privacy/fuzz"
      - "/rullst-security/fuzz"
      - "/rullst-studio/fuzz"
      - "/rullst/fuzz"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    groups:
      # These crates share public types; update their adapter family together.
      opentelemetry-family:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # utoipa-axum and other utoipa crates require the matching utoipa major; update them together.
      utoipa-family:
        patterns:
          - "utoipa"
          - "utoipa-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      safe-updates:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Review/test the tools together, including all CodeQL sub-actions.
    groups:
      ci-tools:
        patterns:
          - "*"