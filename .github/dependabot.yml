version: 2
# Main develops v13; v12 receives compatible stable maintenance.
# This configuration takes effect from the repository default branch.
updates:
  - package-ecosystem: "cargo"
    # The fuzz workspaces keep their own Cargo.lock, which CI resolves with
    # --locked; listing them here puts their lockfile updates in the same
    # grouped pull request as the root lockfile.
    directories:
      - "/"
      - "/rullst-ai/fuzz"
      - "/rullst-capital/fuzz"
      - "/rullst-connect/fuzz"
      - "/rullst-iot/fuzz"
      - "/rullst-mail/fuzz"
      - "/rullst-nexus/fuzz"
      - "/rullst-orm/fuzz"
      - "/rullst-privacy/fuzz"
      - "/rullst-security/fuzz"
      - "/rullst-studio/fuzz"
      - "/rullst/fuzz"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    groups:
      # These crates share public types; update their adapter family together.
      opentelemetry-family:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # utoipa-swagger-ui requires the matching utoipa major; update them together.
      utoipa-family:
        patterns:
          - "utoipa"
          - "utoipa-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      safe-updates:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Review/test the tools together, including all CodeQL sub-actions.
    groups:
      ci-tools:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "v12"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    # v12 takes compatible maintenance only; majors are evaluated on main first.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Held for Smithy JSON 0.63 compatibility; see rullst-mail/Cargo.toml.
      - dependency-name: "aws-smithy-types"
      # Held at =0.8.0-rc.4: sad-rsa 0.10.2 (via xml-sec) does not build with
      # rc.5; see rullst-capital/Cargo.toml on v12.
      - dependency-name: "pkcs1"
      # Held at =0.1.17: with 0.1.19 the NFS-e DPS XMLDSig no longer verifies
      # (rullst-capital fiscal journal/protocol tests, #484); the NFS-e stack
      # is pinned exactly in rullst-capital/Cargo.toml on v12.
      - dependency-name: "xml-sec"
    groups:
      opentelemetry-family:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
        update-types:
          - "major"
          - "minor"
          - "patch"
      safe-updates:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v12"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Review/test the tools together, including all CodeQL sub-actions.
    groups:
      ci-tools:
        patterns:
          - "*"
