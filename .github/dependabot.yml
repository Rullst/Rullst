version: 2
# Main develops v13; v12 receives compatible stable maintenance.
# This configuration takes effect from the repository default branch.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "v12"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    groups:
      safe-updates:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v12"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Review/test the tools together, including all CodeQL sub-actions.
    groups:
      ci-tools:
        patterns:
          - "*"
