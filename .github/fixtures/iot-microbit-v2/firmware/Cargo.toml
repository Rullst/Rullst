[package]
name = "rullst-iot-microbit-v2"
version = "0.0.0"
edition = "2024"
publish = false
description = "Build-checked no_std firmware that runs the rullst-iot test suite on a BBC micro:bit V2"

# A separate workspace: CI builds it for thumbv7em-none-eabihf on its own lock.
[workspace]

[dependencies]
rullst-iot = { path = "../../../../rullst-iot", default-features = false }
# Board support and runtime, each a release older than 14 days when locked.
cortex-m = { version = "=0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "=0.7.7"
microbit-v2 = "=0.16.0"
embedded-alloc = { version = "=0.7.0", default-features = false, features = ["llff"] }
critical-section = "=1.2.0"
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc"] }
# `--features ed25519-fast` measures curve25519-dalek's precomputed tables:
# Cargo feature unification turns them on for rullst-iot's ed25519-dalek.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast"], optional = true }

[features]
ed25519-fast = ["dep:ed25519-dalek"]

[profile.dev]
panic = "abort"
opt-level = "s"

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
