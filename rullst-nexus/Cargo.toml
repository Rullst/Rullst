[package]
name = "rullst-nexus"
version = "12.0.0"
edition = "2024"
license = "MIT"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)'] }


[dependencies]
rullst-core = { path = "../rullst-core" }
rullst-orm = { version = "12.0.0", path = "../rullst-orm" }
rullst-auth = { path = "../rullst-auth" }
axum = { version = "0.8.9" }
base64 = "0.22.1"
subtle = "2.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.44.0", features = ["full"] }

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]
