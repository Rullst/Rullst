[package]
name = "rullst-nexus"
version = "13.0.0-alpha.4"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Auto-generated Admin CMS, model CRUD visualizer, and AI Assistant for Rullst."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-nexus"
keywords = ["admin", "cms", "crud", "nexus", "dashboard"]
categories = ["web-programming", "gui"]

# docs.rs documents the default features (every ORM driver) plus `tz`; the
# `strict-*` profiles select one ORM backend instead of `drivers-all`.
[package.metadata.docs.rs]
features = ["tz"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }


[features]
default = ["drivers-all", "ai"]
drivers-all = ["rullst-core/drivers-all", "rullst-orm/drivers-all"]
strict-sqlite = ["rullst-core/strict-sqlite", "rullst-orm/strict-sqlite"]
strict-postgres = ["rullst-core/strict-postgres", "rullst-orm/strict-postgres"]
strict-mysql = ["rullst-core/strict-mysql", "rullst-orm/strict-mysql"]
# v13: `NexusTimeZone::named`, `DateTimeUtc` form values in a named IANA time
# zone (system zoneinfo, bundled `jiff` database as fallback).
tz = ["dep:jiff"]
# The AI assistant at `/nexus/chat`, which answers through the providers
# `rullst-ai` reads from the environment. Without it (v13: the `rullst` facade's
# `nexus` feature no longer enables it; `nexus-ai` does), Nexus does not
# depend on `rullst-ai`, hides the assistant link and answers `/nexus/chat`
# and `/nexus/chat/query` with 404 and a notice naming this feature.
ai = ["dep:rullst-ai", "dep:ammonia"]

[dependencies]
rullst-core = { workspace = true, features = ["orm"] }
rullst-orm = { workspace = true }
rullst-auth = { workspace = true }
rullst-security = { workspace = true }
rullst-ai = { workspace = true, optional = true }
axum = { workspace = true }
# Sanitizes the assistant's answers (`ai`).
ammonia = { version = "4.2.4", optional = true }
base64 = { workspace = true }
subtle = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
jiff = { version = "0.2.35", optional = true, default-features = false, features = ["std", "tzdb-zoneinfo", "tzdb-bundle-always"] }
url = "2.5.8"
urlencoding = { workspace = true }

[dev-dependencies]
rullst-orm = { workspace = true, features = ["drivers-all"] }
testcontainers = { version = "0.27.3", default-features = false, features = ["aws-lc-rs"] }
testcontainers-modules = { version = "0.15.0", default-features = false, features = ["aws-lc-rs", "postgres", "mysql"] }
tower = { workspace = true, features = ["util"] }

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]
