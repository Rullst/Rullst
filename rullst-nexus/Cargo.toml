[package]
name = "rullst-nexus"
version = "12.0.0-rc.1"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Auto-generated Admin CMS, model CRUD visualizer, and AI Assistant for Rullst."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-nexus"
keywords = ["admin", "cms", "crud", "nexus", "dashboard"]
categories = ["web-programming", "gui"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }


[features]
default = []
strict-sqlite = ["rullst-core/strict-sqlite", "rullst-orm/strict-sqlite"]
strict-postgres = ["rullst-core/strict-postgres", "rullst-orm/strict-postgres"]
strict-mysql = ["rullst-core/strict-mysql", "rullst-orm/strict-mysql"]

[dependencies]
rullst-core = { workspace = true, features = ["orm"] }
rullst-orm = { workspace = true }
rullst-auth = { workspace = true }
rullst-security = { workspace = true }
rullst-ai = { workspace = true }
axum = { workspace = true }
ammonia = "4.0.0"
base64 = { workspace = true }
dotenvy = { workspace = true }
subtle = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
url = "2.5.8"
urlencoding = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]
