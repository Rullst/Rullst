[package]
name = "rullst-iot"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Embedded IoT and edge sensor ingestion engine for Rullst (#![no_std] compatible)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-iot"
keywords = ["iot", "embedded", "no-std", "mqtt", "sensors"]
categories = ["embedded", "no-std", "network-programming"]

[features]
default = ["std"]
std = ["serde/std", "serde_json/std"]

[dependencies]
serde = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, features = ["alloc"] }
sha2 = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }
