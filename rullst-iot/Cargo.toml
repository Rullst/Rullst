[package]
name = "rullst-iot"
version = "13.0.0-alpha.4"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "no_std telemetry/frame helpers and signed firmware verification for Rullst."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-iot"
keywords = ["iot", "embedded", "firmware", "telemetry", "ed25519"]
categories = ["embedded", "no-std", "cryptography"]

# docs.rs documents every feature, `std` included, on one hosted target: a
# `no_std` target cannot build `std`. The labels show what needs `std`.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["std"]
std = ["ed25519-dalek/std", "serde/std", "serde_json/std"]
# Deterministic fixtures only. This feature does not provide MQTT transport,
# hardware-backed keys, signatures, or post-quantum cryptography.
experimental-simulators = []

[dependencies]
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc"] }
serde = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, features = ["alloc"] }
sha2 = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }
