[package]
name = "rullst-orm-macros"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Procedural macros and derive attributes for the rullst-orm Active Record pattern."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-orm-macros"
keywords = ["orm", "proc-macro", "database", "sqlx", "derive"]
categories = ["development-tools::procedural-macro-helpers", "database"]

[lib]
proc-macro = true

[features]
strict-postgres = []
strict-mysql = []
strict-sqlite = []

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
mutants = "0.0.4"
trybuild = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)'] }
