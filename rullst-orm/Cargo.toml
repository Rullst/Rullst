[package]
name = "rullst-orm"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Fast, un-opinionated, database-agnostic ORM and query builder for Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-orm"
keywords = ["orm", "database", "sqlite", "postgres", "mysql"]
categories = ["database"]

[dependencies]
rullst-orm-macros = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "postgres", "mysql", "any", "runtime-tokio", "macros", "json", "tls-rustls"] }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
redis = { workspace = true, features = ["tokio-rustls-comp", "connection-manager"], optional = true }
mongodb = { version = "3.8.2", optional = true }
duckdb = { version = "1.10505.0", features = ["bundled"], optional = true }
url = { version = "2.5.8", optional = true }
reqwest = { workspace = true, features = ["json", "rustls", "stream"], optional = true }
pgvector = { version = "0.4.2", features = ["serde", "sqlx"], optional = true }
aes-gcm = "0.11.0"
base64 = { workspace = true }
rand = { workspace = true }
async-stream = "0.3.5"
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
syn = { version = "3.0", features = ["full", "extra-traits"] }
thiserror = { workspace = true }
sha2 = { workspace = true, optional = true }
zeroize = { workspace = true }

walkdir = "2.5.0"

[features]
default = []
redis = ["dep:redis", "dep:sha2", "dep:url"]
mongodb = ["dep:mongodb"]
duckdb = ["dep:duckdb"]
turso = ["dep:reqwest", "dep:url", "dep:sha2"]
surrealdb = ["dep:reqwest"]
scout-http = ["dep:reqwest", "dep:url"]
pgvector = ["dep:pgvector"]
qdrant = ["dep:reqwest", "dep:url"]
polyglot = ["mongodb", "duckdb", "turso", "surrealdb", "qdrant"]
strict-postgres = []
strict-mysql = []
strict-sqlite = []

[dev-dependencies]
mutants = "0.0.4"
rand = { workspace = true }
axum = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
diesel = { version = "=2.3.12", default-features = false, features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
sea-orm = { version = "=2.0.2", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "sqlite-use-returning-for-3_35"] }
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "mysql", "mariadb", "mongo", "surrealdb"] }
proptest = "1.11.0"
tracing-subscriber = { workspace = true }

[[bench]]
name = "orm_bench"
harness = false

[[bench]]
name = "orm_comparison"
harness = false
required-features = ["strict-sqlite"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(mutants)'] }
