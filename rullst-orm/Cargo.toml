[package]
name = "rullst-orm"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Fast, un-opinionated, database-agnostic ORM and query builder for Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-orm"
keywords = ["orm", "database", "sqlite", "postgres", "mysql"]
categories = ["database"]

[dependencies]
mutants = "0.0.4"
rullst-orm-macros = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "postgres", "mysql", "any", "runtime-tokio", "macros", "json", "tls-rustls"] }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
redis = { workspace = true, features = ["tokio-comp", "connection-manager"], optional = true }
aes-gcm = "0.11.0"
base64 = { workspace = true }
rand = { workspace = true }
async-stream = "0.3.5"
tracing = { workspace = true }
syn = { version = "2.0", features = ["full", "extra-traits"] }
thiserror = { workspace = true }

walkdir = "2.5.0"

[features]
default = []
redis = ["dep:redis"]
strict-postgres = []
strict-mysql = []
strict-sqlite = []

[dev-dependencies]
rand = { workspace = true }
axum = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "mysql"] }
proptest = "1.11.0"

[[bench]]
name = "orm_bench"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(mutants)'] }
