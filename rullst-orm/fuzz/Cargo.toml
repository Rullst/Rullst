[package]
name = "rullst-orm-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[package.metadata.cargo-machete]
ignored = ["libsqlite3-sys"]

[dependencies]
rullst-orm = { path = "..", features = ["drivers-all"] }
syn = { version = "3", features = ["full"] }
proc-macro2 = "1"
libfuzzer-sys = "0.4"
tokio = { version = "1.23.1", features = ["full"] }
libsqlite3-sys = { version = "0.37.0", features = ["bundled"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("redis"))', 'cfg(kani)'] }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_audit"
path = "fuzz_targets/fuzz_audit.rs"
test = false
doc = false

[[bin]]
name = "fuzz_schema"
path = "fuzz_targets/fuzz_schema.rs"
test = false
doc = false

[[bin]]
name = "fuzz_scout"
path = "fuzz_targets/fuzz_scout.rs"
test = false
doc = false

[[bin]]
name = "fuzz_builder"
path = "fuzz_targets/fuzz_builder.rs"
test = false
doc = false

[[bin]]
name = "fuzz_parser"
path = "fuzz_targets/fuzz_parser.rs"
test = false
doc = false
