[package]
name = "rullst"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
description = "The Full-Stack Web Framework for Rust Language"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/Rullst/Rullst"
exclude = ["tests/*", "benches/*", "storage/*", "*.db"]
rust-version = "1.96.0"
[features]
default = []
nexus = ["dep:rullst-nexus"]
studio = ["dep:rullst-studio", "rullst-core/studio"]
auth = ["dep:rullst-auth"]
mailer = ["mail-smtp", "dep:rullst-mail"]
queue-redis = ["dep:redis", "rullst-core/queue-redis"]
cache-redis = ["dep:redis", "rullst-core/cache-redis"]
mail-smtp = ["dep:lettre"]
oauth = ["dep:rullst-connect"]
ai = ["dep:rullst-ai"]
capital = ["dep:rullst-capital"]
telemetry = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "rullst-core/telemetry"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
rullst-macros = { version = "12.0.0", path = "../rullst-macros" }
# Optional features dependencies
redis = { version = "1.2.2", features = ["tokio-comp", "aio"], optional = true }
lettre = { version = "0.11.22", optional = true, default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport", "hostname"] }
rullst-connect = { version = "12.0.0", path = "../rullst-connect", optional = true }
urlencoding = "2.1.3"
subtle = "2.6.1"
tracing-opentelemetry = { version = "0.33.0", optional = true }
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry-otlp = { version = "0.32.0", optional = true, features = ["reqwest-client", "http-proto", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.32.1", optional = true, features = ["rt-tokio"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }
rullst-orm = { version = "12.0.0", path = "../rullst-orm" }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "trace", "cors"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
async-trait = "0.1.89"
uuid = { version = "1.23.3", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
validator = { version = "0.20.0", features = ["derive"] }
rullst-core = { path = "../rullst-core" }
rullst-auth = { path = "../rullst-auth", optional = true }
rullst-mail = { path = "../rullst-mail", optional = true }
rullst-ai = { path = "../rullst-ai", optional = true }
rullst-nexus = { path = "../rullst-nexus", optional = true }
rullst-capital = { path = "../rullst-capital", optional = true }
rullst-studio = { path = "../rullst-studio", optional = true }

tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.123"
wasm-bindgen-futures = "0.4.73"
web-sys = { version = "0.3.100", features = ["Document", "Element", "Window", "EventTarget", "HtmlElement", "console", "Request", "RequestInit", "RequestMode", "Response"] }
js-sys = "0.3.103"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.4.2", features = ["wasm_js"] }

[dev-dependencies]
futures-util = "0.3.32"
tokio-tungstenite = "0.29.0"
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }
proptest = "1.11.0"
insta = { version = "1.41", features = ["yaml"] }
reqwest = "0.13.4"
base64 = "0.23.0"

[[bench]]
name = "rullst_bench"
harness = false

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]
