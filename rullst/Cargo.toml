[package]
name = "rullst"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "The AI-Native Full-Stack, SaaS & Edge/IoT Framework for Rust"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst"
keywords = ["framework", "web", "async", "tokio", "fullstack"]
categories = ["web-programming::http-server", "asynchronous"]
exclude = ["tests/*", "benches/*", "storage/*", "*.db", ".env*"]
[features]
default = ["orm", "queue-sqlite"]
orm = ["dep:rullst-orm", "rullst-core/orm"]
orm-mongodb = ["orm", "rullst-orm/mongodb"]
orm-duckdb = ["orm", "rullst-orm/duckdb"]
orm-turso = ["orm", "rullst-orm/turso"]
orm-surrealdb = ["orm", "rullst-orm/surrealdb"]
orm-polyglot = ["orm-mongodb", "orm-duckdb", "orm-turso", "orm-surrealdb"]
queue-sqlite = ["rullst-core/queue-sqlite"]
nexus = ["dep:rullst-nexus"]
studio = ["dep:rullst-studio", "rullst-core/studio"]
auth = ["dep:rullst-auth"]
auth-jwt = ["auth", "rullst-auth/jwt"]
mailer = ["mail-smtp"]
redis = ["queue-redis", "cache-redis"]
queue-redis = ["dep:redis", "rullst-core/queue-redis"]
cache-redis = ["dep:redis", "rullst-core/cache-redis"]
mail-smtp = ["dep:rullst-mail", "rullst-mail/mail-smtp"]
oauth = ["dep:rullst-connect"]
ai = ["dep:rullst-ai"]
capital = ["dep:rullst-capital"]
security = ["dep:rullst-security"]
security-redis = ["security", "rullst-security/redis-rate-limit"]
iot = ["dep:rullst-iot"]
telemetry = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "rullst-core/telemetry"]
strict-postgres = ["orm", "rullst-core/strict-postgres"]
strict-mysql = ["orm", "rullst-core/strict-mysql"]
strict-sqlite = ["orm", "rullst-core/strict-sqlite"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rullst-macros = { workspace = true }
# Optional features dependencies
redis = { workspace = true, features = ["tokio-comp", "aio"], optional = true }
rullst-connect = { workspace = true, optional = true }
rullst-iot = { workspace = true, optional = true }
urlencoding = { workspace = true }
subtle = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true, features = ["reqwest-client", "http-proto", "reqwest-rustls"] }
opentelemetry_sdk = { workspace = true, optional = true, features = ["rt-tokio"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true, features = ["macros", "ws"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }
rullst-orm = { workspace = true, optional = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs", "trace", "cors"] }
tower-layer = { workspace = true }
tower-service = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["clock"] }
validator = { workspace = true, features = ["derive"] }
rullst-core = { workspace = true }
rullst-auth = { workspace = true, optional = true }
rullst-mail = { workspace = true, optional = true }
rullst-ai = { workspace = true, optional = true }
rullst-nexus = { workspace = true, optional = true }
rullst-capital = { workspace = true, optional = true }
rullst-studio = { workspace = true, optional = true }
rullst-security = { workspace = true, optional = true }

tracing = { workspace = true }
tracing-core = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }


[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.123"
wasm-bindgen-futures = "0.4.73"
web-sys = { version = "0.3.100", features = ["Document", "Element", "Window", "EventTarget", "HtmlElement", "console", "Request", "RequestInit", "RequestMode", "Response"] }
js-sys = "0.3.103"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.4.2", features = ["wasm_js"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
futures-util = "0.3.32"
tokio-tungstenite = "0.30.0"
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }
proptest = "1.11.0"
insta = { version = "1.41", features = ["yaml"] }
reqwest = "0.13.4"
base64 = "0.23.0"
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }

[[bench]]
name = "rullst_bench"
harness = false

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]
