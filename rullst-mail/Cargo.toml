[package]
name = "rullst-mail"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Templated transactional email engine (Resend, SendGrid, Postmark, SMTP) for Rullst."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-mail"
keywords = ["mail", "email", "smtp", "resend", "transactional"]
categories = ["email", "web-programming"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }


[features]
default = []
mail-smtp = ["dep:lettre"]
aws-ses = ["dep:aws-sdk-sesv2"]
capital-invoice = ["dep:rullst-capital", "rullst-capital/invoice-pdf"]

[dependencies]
rullst-core = { workspace = true }
rullst-capital = { workspace = true, optional = true }
lettre = { workspace = true, optional = true, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport", "hostname"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }
chrono = { workspace = true, features = ["clock", "serde"] }
tracing = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
secrecy = "0.10"
aws-sdk-sesv2 = { workspace = true, optional = true }

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth", "tracing"]
