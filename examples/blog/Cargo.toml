[package]
name = "rullst-blog-example"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
publish = false
autobins = false
default-run = "rullst-blog-example"
license = "MIT"
description = "Example blog application built with the Rullst full-stack web framework."
[dependencies]
async-trait = "0.1.91"
rullst = { path = "../../rullst", features = ["orm", "auth", "capital", "ai", "studio", "nexus", "mailer"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[package.metadata.cargo-machete]
ignored = ["async-trait", "serde_json", "rullst-security", "rullst-auth", "rullst-capital", "rullst-ai", "rullst-studio", "rullst-nexus"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rullst-orm = { version = "12.0.0", path = "../../rullst-orm" }
rullst-security = { version = "12.0.0", path = "../../rullst-security" }
rullst-auth = { version = "12.0.0", path = "../../rullst-auth" }
rullst-capital = { version = "12.0.0", path = "../../rullst-capital" }
rullst-studio = { version = "12.0.0", path = "../../rullst-studio" }
rullst-nexus = { version = "12.0.0", path = "../../rullst-nexus" }
rullst-ai = { version = "12.0.0", path = "../../rullst-ai" }
tracing = "0.1"
tokio = { version = "1.52.3", features = ["full"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
axum = { version = "0.8.9", features = ["form", "ws"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rullst-blog-example"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.123"
web-sys = { version = "0.3.100", features = ["Document", "Element", "Window", "EventTarget", "HtmlElement", "console"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
