[package]
name = "rullst-blog-example"
version = "12.0.0-rc.1"
authors = ["Rullst Core Team"]
edition = "2024"
publish = false
autobins = false
default-run = "rullst-blog-example"
license = "MIT"
description = "Example blog application built with the Rullst full-stack web framework."
[dependencies]
async-trait = { workspace = true }
rullst = { workspace = true, features = ["orm", "auth", "capital", "ai", "studio", "nexus", "mailer"] }
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["async-trait", "serde_json", "rullst-security", "rullst-auth", "rullst-capital", "rullst-ai", "rullst-studio", "rullst-nexus"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rullst-orm = { workspace = true }
rullst-security = { workspace = true }
rullst-auth = { workspace = true }
rullst-capital = { workspace = true }
rullst-studio = { workspace = true }
rullst-nexus = { workspace = true }
rullst-ai = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["full"] }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }
axum = { workspace = true, features = ["form", "ws"] }
chrono = { workspace = true, features = ["serde"] }

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[[bin]]
name = "rullst-blog-example"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.123"
web-sys = { version = "0.3.100", features = ["Document", "Element", "Window", "EventTarget", "HtmlElement", "console"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
