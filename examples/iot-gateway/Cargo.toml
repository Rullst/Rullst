# An example application to copy from, not a supported starter: see README.md.
[package]
name = "rullst-iot-gateway-example"
version = "13.0.0-alpha.4"
edition = "2024"
rust-version = "1.96.0"
publish = false
license = "MIT"
description = "IoT gateway example: Arduino Uno boards -> per-device tokens -> Rullst telemetry receiver -> SSE dashboard"

[dependencies]
rullst = { workspace = true, features = ["orm", "strict-sqlite", "nexus", "iot-ingest"] }
rullst-orm = { workspace = true, features = ["strict-sqlite"] }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite"] }
tokio = { workspace = true, features = ["full"] }
serde_json = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["rustls"] }
# The serial port of each board. No libudev: ports are named on the command line.
serialport = { version = "=4.10.1", default-features = false }

[dev-dependencies]
tempfile = "3"
tower = { workspace = true, features = ["util"] }

# `#[derive(Orm)]` emits `cfg(feature = "redis")` blocks for Redis model events.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("redis"))', 'cfg(mutants)'] }

[package.metadata.cargo-machete]
# `sqlx`: declared, as `cargo rullst new` does, to select SQLx's runtime, TLS
# and SQLite features; the code reaches it through `rullst::db::sqlx`.
ignored = ["sqlx"]
