[package]
name = "rullst-capital"
version = "13.0.0-alpha.1"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Provider-neutral SaaS billing contracts, Stripe and InfinitePay adapters, verified webhooks and MRR/ARR analytics for Rullst."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-capital"
keywords = ["saas", "mrr", "stripe", "billing", "analytics"]
categories = ["web-programming"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }


[features]
default = ["axum"]
axum = ["dep:axum"]
actix = ["dep:actix-web", "dep:futures-util"]
invoice-pdf = ["dep:printpdf"]
quota-sql = ["dep:rullst-orm"]
webhook-sql = ["dep:rullst-orm"]

[dependencies]
rullst-core = { workspace = true }
rullst-orm = { workspace = true, default-features = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
ring = { workspace = true, features = ["std"] }
subtle = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
thiserror = { workspace = true }
axum = { workspace = true, optional = true }
actix-web = { version = "4", optional = true, default-features = false }
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"] }
printpdf = { workspace = true, optional = true }

[dev-dependencies]
# Local provider protocol fixtures need a server even without the public Axum adapter.
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
criterion = { workspace = true, features = ["async_tokio"] }
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "mysql", "mariadb"] }

[[bench]]
name = "capital_bench"
harness = false

[[example]]
name = "custom_provider"
required-features = ["axum"]

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]
