[package]
name = "rullst-capital"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Real-time SaaS billing metrics, MRR/ARR analytics, and webhook audit log ledger for Rullst."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-capital"
keywords = ["saas", "mrr", "stripe", "billing", "analytics"]
categories = ["web-programming"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }


[features]
default = ["axum"]
axum = ["dep:axum"]
actix = ["dep:actix-web", "dep:futures-util"]
nfse = ["dep:flate2", "dep:libc", "dep:oxixml-schema", "dep:p12-keystore", "dep:roxmltree", "dep:xml-sec"]
invoice-pdf = ["dep:printpdf"]
quota-sql = ["dep:rullst-orm"]
webhook-sql = ["dep:rullst-orm"]

[dependencies]
rullst-core = { workspace = true }
rullst-orm = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
ring = { workspace = true, features = ["std"] }
subtle = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
thiserror = { workspace = true }
zeroize = { workspace = true }
libc = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
oxixml-schema = { version = "=0.1.2", optional = true }
xml-sec = { version = "=0.1.16", default-features = false, features = ["xmldsig", "c14n", "xml-backend-xmloxide"], optional = true }
p12-keystore = { version = "=0.3.1", optional = true }
roxmltree = { version = "=0.19.0", optional = true }
axum = { workspace = true, optional = true }
actix-web = { version = "4", optional = true, default-features = false }
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"] }
printpdf = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
criterion = { workspace = true, features = ["async_tokio"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "zeroize"] }
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "mysql", "mariadb"] }

[[bench]]
name = "capital_bench"
harness = false

[[example]]
name = "nfse_v101_preview"
required-features = ["nfse"]

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]
