[package]
name = "rullst-ai"
version = "12.0.0"
authors = ["Rullst Core Team"]
edition = "2024"
rust-version = "1.96.0"
description = "Provider-agnostic LLM client, prompt defense, and PII masking engine for Rullst."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rullst/Rullst"
homepage = "https://rullst.github.io"
documentation = "https://docs.rs/rullst-ai"
keywords = ["ai", "llm", "openai", "gemini", "claude"]
categories = ["api-bindings", "web-programming"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)', 'cfg(kani)'] }


[dependencies]
rullst-core = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "sync", "time"] }
sqlx = { workspace = true, optional = true, features = ["any", "sqlite", "postgres", "mysql", "runtime-tokio", "tls-rustls"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = []
sql-memory = ["dep:sqlx"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
criterion = { workspace = true, features = ["async_tokio"] }
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "mysql", "mariadb"] }

[[bench]]
name = "ai_bench"
harness = false

[package.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]
