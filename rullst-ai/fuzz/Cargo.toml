[package]
name = "rullst-ai-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
rullst-ai = { path = ".." }
serde_json = "1"

[[bin]]
name = "fuzz_ai_tools"
path = "fuzz_targets/fuzz_ai_tools.rs"
test = false
doc = false

[[bin]]
name = "fuzz_rag"
path = "fuzz_targets/fuzz_rag.rs"
test = false
doc = false

[[bin]]
name = "fuzz_message_serde"
path = "fuzz_targets/fuzz_message_serde.rs"
test = false
doc = false
