[book]
authors = ["Rullst Contributors"]
language = "en"
src = "src"
title = "Rullst Framework Documentation"

[rust]
edition = "2024"

[preprocessor.canonical-links]
command = "python3 ../.github/mdbook-canonical-links.py"
before = ["links"]
source-revision = "main"

[output.html]
git-repository-url = "https://github.com/Rullst/Rullst"
edit-url-template = "https://github.com/Rullst/Rullst/edit/main/docs/{path}"
additional-css = ["theme/release-status.css"]
additional-js = ["theme/release-status.js"]

# Pages renamed in 13.0.0-alpha.5; the 13.0.0-alpha.4 CLI links the old ones.
[output.html.redirect]
"/green.html" = "footprint.html"
"/green-software-roadmap.html" = "resource-efficiency-roadmap.html"
