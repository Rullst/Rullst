codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 1
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: 90%
        threshold: 0%
      framework_libraries:
        target: 90%
        threshold: 0%
        paths:
          - "rullst/src/**"
          - "rullst-ai/src/**"
          - "rullst-auth/src/**"
          - "rullst-capital/src/**"
          - "rullst-connect/src/**"
          - "rullst-core/src/**"
          - "rullst-iot/src/**"
          - "rullst-mail/src/**"
          - "rullst-messaging/src/**"
          - "rullst-nexus/src/**"
          - "rullst-orm/src/**"
          - "rullst-security/src/**"
          - "rullst-studio/src/**"
    patch:
      default:
        target: 90%
        threshold: 0%

component_management:
  individual_components:
    - component_id: framework_libraries
      name: Framework libraries
      paths:
        - "rullst/src/**"
        - "rullst-ai/src/**"
        - "rullst-auth/src/**"
        - "rullst-capital/src/**"
        - "rullst-connect/src/**"
        - "rullst-core/src/**"
        - "rullst-iot/src/**"
        - "rullst-mail/src/**"
        - "rullst-messaging/src/**"
        - "rullst-nexus/src/**"
        - "rullst-orm/src/**"
        - "rullst-security/src/**"
        - "rullst-studio/src/**"
      statuses:
        - type: project
          target: 90%
          threshold: 0%
    - component_id: authentication
      name: Authentication (rullst-auth)
      paths:
        - "rullst-auth/src/**"
      statuses:
        - type: project
          target: 90%
          threshold: 0%
    - component_id: security
      name: Security (rullst-security)
      paths:
        - "rullst-security/src/**"
      statuses:
        - type: project
          target: 90%
          threshold: 0%
    - component_id: cli_tooling
      name: CLI tooling (informational)
      paths:
        - "cargo-rullst/src/**"
    - component_id: procedural_macros
      name: Procedural macros (informational)
      paths:
        - "rullst-macros/src/**"
        - "rullst-orm-macros/src/**"

comment:
  layout: "header, diff, components, files"
  behavior: default
  require_changes: false

ignore:
  - "examples/**/*"
  - "benches/**/*"
  - "benchmark/**/*"
  - "target/**/*"
  - "docs/**/*"
  - "**/test_support.rs"
  - "**/*_tests.rs"
  - "**/tests/**/*"
