codecov:
  require_ci_to_pass: false
  notify:
    after_n_builds: 1
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "80...100"
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%
        threshold: 1%

ignore:
  - "examples/**/*"
  - "cargo-rullst/**/*"
  - "rullst-macros/**/*"
  - "rullst-orm-macros/**/*"
  - "benches/**/*"
  - "benchmark/**/*"
  - "target/**/*"
  - "docs/**/*"
  - "**/*_tests.rs"
  - "**/tests/**/*"
