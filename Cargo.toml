[workspace]
members = [
    "rullst",
    "rullst-macros",
    "cargo-rullst",
    "rullst-orm",
    "rullst-orm-macros",
    "rullst-connect",
    "examples/blog", "rullst-core", "rullst-auth", "rullst-mail", "rullst-ai", "rullst-nexus", "rullst-capital", "rullst-studio", "rullst-security", "rullst-iot",
]
exclude = [
    "benchmark/rullst",
    "benchmark/axum",
    "benchmark/actix",
    "benchmark/loco",

    "benchmark/leptos",
    "benchmark/poem",
    "benchmark/warp",
    "benchmark/dioxus",
]
resolver = "2"

[workspace.dependencies]
# Internal workspace crates
rullst = { version = "12.0.0", path = "rullst" }
rullst-core = { version = "12.0.0", path = "rullst-core", default-features = false }
rullst-orm = { version = "12.0.0", path = "rullst-orm" }
rullst-orm-macros = { version = "12.0.0", path = "rullst-orm-macros" }
rullst-macros = { version = "12.0.0", path = "rullst-macros" }
rullst-auth = { version = "12.0.0", path = "rullst-auth" }
rullst-security = { version = "12.0.0", path = "rullst-security" }
rullst-capital = { version = "12.0.0", path = "rullst-capital" }
rullst-studio = { version = "12.0.0", path = "rullst-studio" }
rullst-nexus = { version = "12.0.0", path = "rullst-nexus" }
rullst-mail = { version = "12.0.0", path = "rullst-mail" }
rullst-ai = { version = "12.0.0", path = "rullst-ai" }
rullst-connect = { version = "12.0.0", path = "rullst-connect" }
rullst-iot = { version = "12.0.0", path = "rullst-iot" }
cargo-rullst = { version = "12.0.0", path = "cargo-rullst" }

# Shared external dependencies
tokio = { version = "1.52.3", default-features = false }
axum = { version = "0.8.9", features = ["macros", "ws"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.150", default-features = false }
sqlx = { version = "0.9.0", default-features = false }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.0", default-features = false }
tower-layer = "0.3.3"
tower-service = "0.3.3"
async-trait = "0.1.89"
rand = "0.10.1"
subtle = "2.6.1"
base64 = "0.23.0"
uuid = { version = "1.23.3", default-features = false, features = ["v4"] }
chrono = { version = "0.4.45", default-features = false }
tracing = "0.1.44"
tracing-core = "0.1.36"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0.19"
reqwest = { version = "0.13.4", default-features = false }
ring = { version = "0.17.14", default-features = false }
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"
dashmap = "6.2.1"
urlencoding = "2.1.3"
validator = { version = "0.20.0", default-features = false }
futures-util = "0.3.33"
criterion = { version = "0.8.2", default-features = false }
libloading = "0.9.0"
notify = "8.2.0"
toml = "1.1.2"
dotenvy = "0.15"
redis = { version = "1.2.2", default-features = false }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
lettre = { version = "0.11.22", default-features = false }
opentelemetry = { version = "0.32.0", default-features = false }
opentelemetry-otlp = { version = "0.32.0", default-features = false }
opentelemetry_sdk = { version = "0.32.1", default-features = false }
tracing-opentelemetry = { version = "0.33.0", default-features = false }

[workspace.metadata.cargo-machete]
ignored = ["async-trait", "rullst-core", "subtle", "serde", "axum", "serde_json", "tokio", "lettre", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "redis", "rullst-connect", "rullst-macros", "toml", "tracing-opentelemetry", "urlencoding", "base64", "notify", "ring", "rullst-auth"]
