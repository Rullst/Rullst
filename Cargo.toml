[workspace]
members = [
    "rullst",
    "rullst-macros",
    "cargo-rullst",
    "examples/blog", "rullst-core", "rullst-auth", "rullst-mail", "rullst-ai", "rullst-nexus", "rullst-capital", "rullst-studio",
]
exclude = [
    "benchmark/rullst",
    "benchmark/axum",
    "benchmark/actix",
    "benchmark/loco",

    "benchmark/leptos",
    "benchmark/poem",
    "benchmark/warp",
    "benchmark/dioxus",
]
resolver = "2"

