# cargo-deny configuration for Rullst Framework

[advisories]
# Temporary exceptions must have an owner, compensating control, and expiry in
# docs/src/security-advisory-exceptions.md. Patched or absent advisories are not ignored.
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite < 3.54 in libsqlite3-sys 0.37; sqlx-sqlite 0.9.0 caps it below 0.38; see docs/src/security-advisory-exceptions.md" },
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar is unmaintained; dev-dependency of testcontainers only; see docs/src/security-advisory-exceptions.md" },
]

[licenses]
# We allow typical open-source licenses compatible with MIT framework
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "OpenSSL",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "BSL-1.0",
    "0BSD",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = []

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
