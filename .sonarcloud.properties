# SonarCloud automatic analysis settings.
#
# Duplication is measured on production code only. Test files follow the
# convention of .github/filter-codeql-test-fixtures.py: anything under tests/,
# benches/ or fuzz/, and tests.rs, test.rs, *_tests.rs and *_test.rs modules
# (#[cfg(test)] in this repository). Tests often repeat their setup on purpose
# so that each one reads on its own. Bugs, vulnerabilities and code smells are
# still reported in these files; only the duplication measure skips them.
sonar.cpd.exclusions=**/tests/**,**/benches/**,**/fuzz/**,**/tests.rs,**/test.rs,**/*_tests.rs,**/*_test.rs
