# SonarCloud automatic analysis settings.
#
# Duplication is measured on production code only. Test files follow the
# convention of .github/filter-codeql-test-fixtures.py: anything under tests/,
# benches/ or fuzz/, and tests.rs, test.rs, *_tests.rs and *_test.rs modules
# (#[cfg(test)] in this repository). Tests often repeat their setup on purpose
# so that each one reads on its own. Bugs, vulnerabilities and code smells are
# still reported in these files; only the duplication measure skips them.
#
# The Brazilian Portuguese website pages (site/src/pages/landing/pt_*.rs,
# compare/pt.rs and privacy/pt.rs, the html! sources of the generator)
# translate the English pages and keep their markup on purpose:
# validate-site.py requires the same section ids, links and illustrations in
# both languages, and the duplication measure ignores the differing text.
#
# The CLDR tables of rullst-core's i18n formatting (format/data_*.rs) are
# generated by .github/generate-i18n-format-data.py; locales of one language
# share most of their names and patterns, so the rows repeat by design.
#
# rullst-messaging's POSIX cron evaluator (schedules/posix_cron.rs and
# posix_cron_field.rs) is a deliberate copy of rullst-core's
# (scheduler_cron.rs and scheduler_cron_field.rs): Messaging does not depend
# on Core, so it cannot call it. Its test posix_cron_tests.rs compares the
# copy with Core's evaluator through Core's `test-util` hook
# (scheduler::__test_hooks), so a change to one copy without the other fails.
# Only the duplication measure skips these two files.
sonar.cpd.exclusions=**/tests/**,**/benches/**,**/fuzz/**,**/tests.rs,**/test.rs,**/*_tests.rs,**/*_test.rs,site/src/pages/landing/pt_top.rs,site/src/pages/landing/pt_bottom.rs,site/src/pages/compare/pt.rs,site/src/pages/privacy/pt.rs,rullst-core/src/i18n/format/data_*.rs,rullst-messaging/src/schedules/posix_cron.rs,rullst-messaging/src/schedules/posix_cron_field.rs
